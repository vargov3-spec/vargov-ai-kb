    // вертикальных стержней, его быть не должно. У горизонтальной навивки
    // пробег вдоль оси на плато — и есть «поворот» (даёт метраж и
    // покрытие углов), поэтому синхронизация частичная: скучивание
    // ограничено (мин. шаг витка ≥ 0.75 номинала), а плато едет дальше
    const bSync=(fo && fo.ax===1) ? 1 : 0.45;
    const phEnd=Math.max(0.5, 1+bSync*phN(1));
    for(let k2=0;k2<=N;k2++){
      const t=k2/N;
      const phMod=phN(t);
      const tS=Math.min(1, Math.max(0, (t+bSync*phMod)/phEnd));
      const g=atSpine(S*(revAx ? 1-tS : tS));
      const T=g.T;
      // рамка навивки: e1 вдоль опорного вектора формы, e2 — ход×e1
      let e1=V.sub(sp.ref, V.mul(T, V.dot(sp.ref,T)));
      if(V.len(e1)<1e-4) e1=V.cross(T, Math.abs(T[1])>0.9?[1,0,0]:[0,1,0]);
      e1=V.norm(e1);
      const e2=V.norm(V.cross(T,e1));
      const th=ph0+turns*Math.PI*2*(t+phMod);
      const br=1+bAmp*Math.sin(Math.PI*2*bf*t+bp);
      // СИЛУЭТ ФОРМЫ ГАБАРИТА: сечение витка сужается по профилю формы
      // (у шара к полюсам, у конуса к низу, у песочных часов к середине)
      let kS=1;
      if(fo) kS=Math.max(0.10, fo.kAt(g.p[fo.ax]));
      // сход к оси на конце пути — лента приходит в центр низа формы
      if(revAx) kS*=Math.max(0.04, Math.min(1, (1-tS)/0.14));
      const B1=A1s*kS*br, B2=A2s*kS*br;
      // СЕЧЕНИЕ ВИТКА: эллипс, если его радиус на остром конце (b²/a) проходит
      // технологический предел, иначе стадион. Стадион — «скруглённый
      // прямоугольник», и в круглых формах (шар, цилиндр, конус) он читался
      // квадратом; эллипс даёт настоящий круглый силуэт
      const Bmx=Math.max(B1,B2), Bmn=Math.max(1,Math.min(B1,B2));
      const ell=(Bmn*Bmn/Bmx)>=1.2*R_FIT;
      const sec=coil ? (ell ? [B1*Math.cos(th), B2*Math.sin(th)]
                            : sectionLoop(th, B1, B2))
                     : (B1>=B2 ? [B1*Math.sin(th), 0] : [0, B2*Math.sin(th)]);
      // блуждание центра и размах плато сжимаются с АБСОЛЮТНЫМ радиусом
      // витка: где базовый радиус меньше самой болтанки (сход к оси,
      // полюсы вытянутой формы), хвост мотался вокруг оси и вязал узлы
      // (замер 900×900×3500: 689 касаний в нижних 750 мм). Порог 260 мм —
      // у полных сечений (куб, широкие боксы) болтанка не сжимается:
      // сжатие по профилю формы срезало покрытие объёма на кубе 1500³
      const kW=Math.max(0.20, Math.min(1, Math.min(B1,B2)/260));
      let R1=sec[0]+(cAmp1*Math.sin(Math.PI*2*cf1*t+cp1)
                   +tAmp1*Math.sin(Math.PI*2*altF*t+1.7))*kW;
      let R2=sec[1]+(cAmp2*Math.sin(Math.PI*2*cf2*t+cp2)
                   +tAmp2*Math.cos(Math.PI*2*altF*t+1.7))*kW;
      const q=[0,0,0];
      // РАЗМЕР ПОД ГАБАРИТ: secK — покоординатный масштаб навивки от центра
      // габарита. Его подбирает buildRibbon по факту (замер габарита ленты
      // после марша), чтобы фактический размер композиции совпал с заданным
      for(let x2=0;x2<3;x2++){
        const v=g.p[x2]+e1[x2]*R1+e2[x2]*R2;
        q[x2]=dims[x2]/2+softLim((v-dims[x2]/2)*sK[x2], dims[x2]/2-25);
      }
      // ЛЕНТА НЕ ДОЛЖНА ВЫХОДИТЬ ЗА ФОРМУ: точка поджимается к силуэту
      if(fo) fo.clampTo(q, 1.0, rw*0.15);
      pts.push(q);
      axisAt.push(T);   // стержни — вдоль осевой линии формы
    }
    pts.__axisAt=axisAt;
    pts.__target=target;   // цель метража по правилу производства
    if(fo){
      pts.__formIn=fo.inside;
      pts.__formAx={ax:fo.ax, c:fo.c.slice(), s0:fo.c[fo.ax]-fo.Rax, s1:fo.c[fo.ax]+fo.Rax};
      pts.__formDraw={c:fo.c.slice(), R:fo.R.slice(), form:box.form};
      pts.__formClamp=fo.clampTo;
    }
    return pts;
  }

  if(style === "wave"){
    // движение вдоль X, вертикальные волны со случайными складками
    const n = Math.max(6, Math.round((7 + rng()*3)*Math.max(1,lengthK*0.9)));
    const ph1 = rng()*Math.PI*2, ph2 = rng()*Math.PI*2;
    const f1 = (1.5+rng()*1.3)*lengthK, f2 = (3+rng()*2)*lengthK;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const y = 0.5 + ampl*(0.42*Math.sin(t*Math.PI*2*f1+ph1) + 0.25*Math.sin(t*Math.PI*2*f2+ph2)) + jitter(0.06);
      const z = laneZ + jitter(lanes>1 ? 0.10 : 0.22);
      pts.push([t*w, Math.min(0.95,Math.max(0.05,y))*h, Math.min(0.95,Math.max(0.05,z))*d]);
    }
  } else if(style === "serpentine"){
    // S-петли в плане, лента «на ребре»
    const n = Math.max(7, Math.round((8 + rng()*3)*Math.max(1,lengthK*0.9)));
    const ph = rng()*Math.PI*2;
    const f = (1.6+rng()*1.2)*lengthK;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const z = 0.5 + ampl*0.62*Math.sin(t*Math.PI*2*f+ph) + jitter(0.05);
      const y = laneZ*0.4+0.3 + ampl*0.22*Math.sin(t*Math.PI*2*(f*0.5)+ph*1.7) + jitter(0.05);
      pts.push([t*w, Math.min(0.95,Math.max(0.05,y))*h, Math.min(0.95,Math.max(0.05,z))*d]);
    }
  } else if(style === "spiral"){
    // спуск по спирали вокруг вертикальной оси
    const turns = (1.2 + ampl*1.6 + rng()*0.5)*lengthK;
    const n = Math.max(9, Math.round(turns*5));
    const ph = rng()*Math.PI*2;
    const dir = rng()<0.5 ? 1 : -1;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const a = ph + dir*t*turns*Math.PI*2;
      const r = 0.38 + 0.1*Math.sin(t*Math.PI*2+ph) + jitter(0.03);
      const yy = lanes>1 ? (1-t)*0.9+0.05 : (1-t)*0.86+0.07;
      pts.push([(0.5+r*Math.cos(a))*w, yy*h, (0.5+r*Math.sin(a))*d]);
    }
  } else if(style === "cascade"){
    // диагональный поток сверху вниз
    const n = Math.max(7, Math.round((8 + rng()*3)*Math.max(1,lengthK*0.9)));
    const ph = rng()*Math.PI*2;
    const f = (1.8+rng()*1.4)*lengthK;
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const y = 0.92 - t*0.84 + ampl*0.12*Math.sin(t*Math.PI*2*f+ph);
      const z = laneZ + ampl*0.35*Math.sin(t*Math.PI*2*f*0.7+ph*2) + jitter(0.05);
      pts.push([t*w, Math.min(0.95,Math.max(0.05,y))*h, Math.min(0.95,Math.max(0.05,z))*d]);
    }
  } else { // free
    const n = Math.max(7, Math.round((8 + rng()*4)*lengthK));
    let prev = [rng()*0.3, 0.3+rng()*0.4, 0.3+rng()*0.4];
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const p = [
        Math.min(0.97,Math.max(0.03, t + jitter(0.10))),
        Math.min(0.95,Math.max(0.05, prev[1] + jitter(0.30)*ampl*1.6)),
        Math.min(0.95,Math.max(0.05, prev[2] + jitter(0.34)*ampl*1.6)),
      ];
      pts.push([p[0]*w, p[1]*h, p[2]*d]);
      prev = p;
    }
  }
  return pts;
}

function buildRibbon(params, rngSeed, lane){
  const {style, box, ampl, twistAmt, ribbonW, rows, lengthK, lanes} = params;
  const foldK = params.foldK!==undefined ? params.foldK : 0.12;
  // общий rng (rngSeed одинаков для всех лент попытки) строит базовый
  // поток; rngL даёт каждой ленте индивидуальность
  const rng = mulberry32(rngSeed);
  const rngL = mulberry32((rngSeed + lane*7919 + 13)>>>0);

  // отступ: половина ширины ленты + радиус стержня
  const inset = ribbonW/2 + ROD_R + 5;
  const work = {
    w: Math.max(120, box.w - 2*inset),
    h: Math.max(120, box.h - 2*inset),
    d: Math.max(120, box.d - 2*inset),
  };

  const isFill = (style==="chaos" || lengthK>=1.9);
  // высокий габарит заполняется вертикальными пробегами
  const fillVert = isFill && box.h > box.w*1.15;
  const rw = ribbonW;
  // рабочий бокс укладки ПЛОСКОЙ ленты: стержни лежат поперёк хода
  // (у горизонтальной — вдоль глубины: отступы глубины ±170 =
  // полширины+радиус+запас; вертикаль ±100 на перекаты и волны)
  const relax = params.fillRelax||0;
  // винт: по оси винта нужен запас на полширины ленты, по сечению —
  // только на радиус стержня (лента в плоскости витка тонкая)
  const workF = { w: Math.max(200, box.w-40), h: Math.max(200, box.h-40),
                  d: Math.max(200, box.d-40), rw, relax,
                  form: params.form||"box", plast: params.plast||"mix",
                  plan: params.plan||"circle", rows: params.rows||2,
                  densK: params.densK||1, addLen: params.addLen||0,
                  concept: params.concept||null };

  let ctrl = controlPoints(style, rng, isFill?workF:work, lane, lanes, ampl, lengthK);

  // ПЛЕТЕНИЕ: ленты не параллельны — каждая вьётся вокруг общего потока
  // со своей фазой: обвивают друг друга, меняются сторонами, проходят
  // рядом и «пересекаются» визуально (геометрию разводит relax)
  if(lanes>1 && !isFill){
    const rB = Math.max(185, Math.min(0.3*Math.min(work.h, work.d)+60, 300));
    const winds = 0.4 + lengthK*0.35 + rng()*0.5;
    const ph0 = Math.PI*2*lane/lanes + rng()*0.5;
    const n0 = ctrl.length;
    const src = ctrl.map(c=>c.slice());
    for(let j=0;j<n0;j++){
      const t=j/(n0-1);
      const A=ph0 + winds*Math.PI*2*t;
      const p0=src[Math.max(0,j-1)], p1=src[Math.min(n0-1,j+1)];
      let tg=V.sub(p1,p0);
      tg = V.len(tg)>1e-6 ? V.norm(tg) : [1,0,0];
      const e1=V.norm(V.cross(tg, Math.abs(tg[1])>0.9?[1,0,0]:[0,1,0]));
      const e2=V.norm(V.cross(tg,e1));
      const ca=Math.cos(A), sa=Math.sin(A);
      for(let x=0;x<3;x++) ctrl[j][x]=src[j][x]+(e1[x]*ca+e2[x]*sa)*rB;
    }
  }

  // twist-профиль: у «Хаоса» сильнее и с третьей гармоникой — перекруты
  // заполнение: закрутка живёт на прямых участках пробегов (в изгибе
  // её гасят банк и анти-«штопор»); лента катится и вертится вдоль
  // пробегов — шаг строк по глубине расширяется под размах стержней
  // в винте твист не нужен: вращение даёт сама спираль, а твист съедает
  // бюджет расхождения торцов и включает анти-«штопор» (витки редеют)
  const twistEff = isFill ? 0 : twistAmt;
  const tf1 = 1+rngL()*2, tf2 = 2.5+rngL()*2.5, tf3 = 5+rngL()*4;
  const tp1 = rngL()*Math.PI*2, tp2 = rngL()*Math.PI*2, tp3 = rngL()*Math.PI*2;
  const tsc = style==="chaos" ? 1.5 : 1.15;
  const twistAt = s => twistEff*tsc*(
    0.50*Math.sin(s*Math.PI*2*tf1+tp1) +
    0.30*Math.sin(s*Math.PI*2*tf2+tp2) +
    0.20*Math.sin(s*Math.PI*2*tf3+tp3));
  // заполнение: ПЛОСКАЯ лента — стержни горизонтальны, поперёк хода
  // (лицо вверх у горизонтальной укладки, к зрителю — у вертикальной)
  let w0hint = null, fillAxisV = [0,1,0], axisAt = null;
  if(isFill){
    // стержни — вдоль осевой линии формы; у гнутых форм (кольцо, купол,
    // каскад) она поворачивается, поэтому ось банка задаётся ПОСТАНЦИОННО
    axisAt = ctrl.__axisAt || null;
    w0hint = axisAt ? axisAt[0].slice() : [1,0,0];
    fillAxisV = w0hint.slice();
  }
  // двурядная: центральный контур независим — провисает/поднимается.
  // Каждый ряд получает свой плавный профиль угла складки.
  // АМПЛИТУДА СКЛАДКИ ПО РАДИУСУ ВИТКА. Наклон рядов на угол α уводит
  // торцы с плоскости изгиба на полширины×sin α, а это ограничивает радиус
  // (внутрь поворота бюджет 0.6 мм на шаг). Чем теснее навивка, тем меньше
  // складки она держит: иначе марш не проходит повороты и лента обрывается.
  const foldGeo=(()=>{
    const dW=[workF.w, workF.h, workF.d];
    const axW=dW.indexOf(Math.max(...dW));
    const rB=(d)=>Math.max(90,(d-2*(ROD_R+12))/2);
    const Rsec=Math.min(rB(dW[(axW+1)%3]), rB(dW[(axW+2)%3]))*0.88;
    // тесное сечение раньше душило складку целиком; теперь допустимый
    // наклон считает сам марш по зазору, поэтому пол поднят
    return Math.max(0.55, Math.min(1, Rsec/700));
  })();
  const foldAmp = foldK*(0.3+0.7*ampl)*foldGeo;
  // ОБЩАЯ составляющая (одинаковый знак у обоих рядов) — «домик» или
  // «ложбина»: канты сближаются, и центральный контур уходит из их
  // плоскости. НЕЗАВИСИМАЯ составляющая оставляет рядам свободу друг от
  // друга — стержни крепятся к центральному контуру с двух сторон
  // независимо и свободно двигаются
  const ffC=0.6+rngL()*1.0, fpC=rngL()*Math.PI*2;
  // ОБЩАЯ составляющая — на пробегах в полную амплитуду: изгиба там нет,
  // бюджет зазоров огромен, и центральный контур имеет право провиснуть или
  // подняться на всю физически допустимую величину. Именно за счёт этого
  // лента местами сужается: расстояние между кантами = 2·длина_стержня·cos α
  const common = s => foldAmp*Math.sin(s*Math.PI*2*ffC+fpC);
  const ffU1=0.8+rngL()*1.7, fpU1=rngL()*Math.PI*2, ffU2=2+rngL()*2, fpU2=rngL()*Math.PI*2;
  const ffD1=0.8+rngL()*1.7, fpD1=rngL()*Math.PI*2, ffD2=2+rngL()*2, fpD2=rngL()*Math.PI*2;
  const foldDifU = s => 0.3*foldAmp*(0.7*Math.sin(s*Math.PI*2*ffU1+fpU1)+0.3*Math.sin(s*Math.PI*2*ffU2+fpU2));
  const foldDifD = s => 0.3*foldAmp*(0.7*Math.sin(s*Math.PI*2*ffD1+fpD1)+0.3*Math.sin(s*Math.PI*2*ffD2+fpD2));
  const foldUp = s => common(s) + foldDifU(s);
  const foldDn = s => common(s) + foldDifD(s);
  // «ветер»: многооктавная турбулентность направляющей — крупные
  // покачивания, средние волны и мелкое трепетание, как шёлк на ветру.
  // Марш отфильтрует нефизичное, лента живёт на пределе пластики.
  const wBase = Math.min(work.h, work.d) * (rows===2 ? 1 : 0.65);
  const wAmp = [0.30*wBase*ampl, 0.13*wBase*ampl, 0.05*wBase*ampl];
  const wind = [];
  for(let x=0;x<3;x++){
    const f1=(1.4+rngL()*1.4), f2=(3.5+rngL()*2.5), f3=(8+rngL()*6);
    const p1=rngL()*Math.PI*2, p2=rngL()*Math.PI*2, p3=rngL()*Math.PI*2;
    wind.push(t =>
      wAmp[0]*Math.sin(t*Math.PI*2*f1+p1) +
      wAmp[1]*Math.sin(t*Math.PI*2*f2+p2) +
      wAmp[2]*Math.sin(t*Math.PI*2*f3+p3));
  }
  // ветер заполнения: ограниченная турбулентность направляющей — лента
  // трепещет, но бюджет зазоров между строками не съедается
  const fWind=[];
  {
    const wK=Math.max(0.3, Math.min(1, 1.6-lengthK*0.35)); // насыщенность давит ветер
    const amps=[26*wK,16*wK,8*wK]; // x, y, z
    for(let x2=0;x2<3;x2++){
      const f1=1.3+rngL()*1.6, f2=3.2+rngL()*2.4;
      const p1=rngL()*Math.PI*2, p2=rngL()*Math.PI*2;
      fWind.push(t=>amps[x2]*(0.7*Math.sin(t*Math.PI*2*f1+p1)+0.3*Math.sin(t*Math.PI*2*f2+p2)));
    }
  }
  const edgeMode=(params.plast==="edge");
  const opt = {twistAt, ribbonW, rows, style, w0hint, foldUp, foldDn,
               wind: (isFill?fWind:wind), foldK, axisAt,
               // предельный наклон рядов, который просит пластика: в
               // повороте марш даёт ровно столько, сколько держит зазор
               foldMax: foldAmp,
               // профили складки: общая часть (положение центрального
               // контура на пробегах) и независимые части рядов
               foldCom: common, foldDifU, foldDifD,
               // на ребро: ориентация ленты задана жёстко — стержни вертикальны
               wForce: edgeMode ? [0,1,0] : null};

  // --- вписывание ---
  // Заполняющий маршрут построен сразу в верных координатах: сжатие ему
  // только вредит (сплющивает строки) — марш с рулём сам держит стены.
  const margin = ROD_R+1;
  let geo = null;
  if(isFill){
    // РАЗМЕР ПОД ГАБАРИТ И ДОБОР МЕТРАЖА. Композиция обязана дойти до граней
    // заданного габарита. Правильный размер задаётся в ГЕНЕРАТОРЕ (навивка
    // остаётся плавной и физичной), а не растяжкой готового пути: делаем
    // полный проход, замеряем фактический габарит и, если лента не дошла,
    // пересобираем навивку с исправленным покоординатным масштабом secK.
    // Из двух проходов остаётся лучший — тот, что вписался и заполнил больше.
    let secK=[1,1,1], shC=[0,0,0];
    let bestPass=null;

    for(let pass=0; pass<3; pass++){
      shC=[0,0,0];
      // ДОБОР МЕТРАЖА: предмарш замеряет фактическую длину. Марш срезает
      // повороты, поэтому длина выходит короче цели правила производства —
      // добавляем витков и повторяем (не больше трёх проходов)
      let boost=1;
      for(let bi=0; bi<3; bi++){
        workF.turnsBoost=boost;
        workF.secK=secK.slice();
        ctrl = controlPoints(style, mulberry32(rngSeed), workF, lane, lanes, ampl, lengthK);
        opt.axisAt = ctrl.__axisAt || null;
        if(opt.axisAt) opt.w0hint = ctrl.__axisAt[0].slice();
        geo = sampleGuide(ctrl, opt);
        geo.fillMode=true;
        geo.edgeMode=edgeMode;
        geo.fillAxis=(opt.w0hint||fillAxisV).slice();
        geo.noSteer=true;
        marchRibbon(geo);
        // ДОБОР МЕТРАЖА: марш срезает повороты и теряет длину, поэтому
        // добавляем витков и повторяем предмарш. Размером занимается
        // внешний проход — здесь только метраж
        const tg=ctrl.__target||0;
        const got=geo.ribbonLen||1;
        if(!tg || got>=0.94*tg || bi===1) break;
        boost=Math.min(2.6, boost*Math.min(1.45, tg/got));
      }
      // покрытие ПРЕДМАРША: если сорвался он, второй марш пройдёт короткую
      // направляющую целиком и обрыв останется незамеченным
      geo.covPre=geo.giMap[geo.giMap.length-1]/Math.max(1, geo.guideC.length-2);
      // ФОРМА ГАБАРИТА: предмарш идёт без рулей и может выйти за форму.
      // Точки его выхода подтягиваем к оси укладки — она внутри формы, —
      // иначе второй марш пойдёт по «внешней» направляющей и лента вылезет
      // из нарисованного пунктиром объёма
      if(ctrl.__formIn && ctrl.__formAx){
        const fin=ctrl.__formIn, fa=ctrl.__formAx, fcl=ctrl.__formClamp;
        for(const c of geo.centers){
          if(fin(c)) continue;
          // проекция на силуэт формы (жёстче прежней утяжки к оси)
          if(fcl){ fcl(c, 0.97); continue; }
          const near=[fa.c[0], fa.c[1], fa.c[2]];
          near[fa.ax]=Math.max(fa.s0, Math.min(fa.s1, c[fa.ax]));
          for(let it=0; it<12 && !fin(c); it++)
            for(let x=0;x<3;x++) c[x]=near[x]+(c[x]-near[x])*0.75;
        }
      }
      geo.escPre=geo.escapes||0;
      { // вылет предмарша за габарит: утяжка глубже 12% схлопывает витки,
        // а второй марш, воюя со стенами, срывается и обрывает ленту
        const bbP=geoBBox(geo), limP=[box.w,box.h,box.d];
        geo.preOver=Math.max(...[0,1,2].map(k=>(bbP.max[k]-bbP.min[k]+ROD_D)/limP[k]));
      }
      geo.guideC=geo.centers.map(c=>c.slice());
      geo.guideD=geo.dirs.map(v=>v.slice());
      // направляющая теперь идёт по станциям предмарша: ось навивки
      // переиндексируется через карту станция→гид
      if(geo.fillAxisArr && geo.giMap){
        const src=geo.fillAxisArr;
        geo.fillAxisArr=geo.giMap.map(g=>src[Math.min(src.length-1, g)].slice());
      }
      if(geo.dirUp){
        geo.guideUp=geo.dirUp.map(v=>v.slice());
        geo.guideDn=geo.dirDn.map(v=>v.slice());
      }
      if(lanes<=1){
        // одиночная лента центрируется по своему габариту. Вложенные спирали
        // центрировать порознь НЕЛЬЗЯ: у каждой жилы свой bbox, центры
        // разъезжаются, соосность теряется и жилы налезают друг на друга —
        // общее центрирование делает сцена
        // винта центрирование ОБЩЕЕ (иначе фазы жил съезжают и они
        // налезают друг на друга) — его делает сцена
        const bb=geoBBox(geo);
        const sh=[(box.w-(bb.min[0]+bb.max[0]))/2, (box.h-(bb.min[1]+bb.max[1]))/2, (box.d-(bb.min[2]+bb.max[2]))/2];
        for(const c of geo.guideC){ c[0]+=sh[0]; c[1]+=sh[1]; c[2]+=sh[2]; }
        shC=sh;
      }
      if(ctrl.__formIn){
        // предикат задан до центрирующего сдвига — компенсируем его
        const fin=ctrl.__formIn, fcl=ctrl.__formClamp, qq=[0,0,0], sh=shC.slice();
        geo.formIn=(q3)=>{ for(let x=0;x<3;x++) qq[x]=q3[x]-sh[x]; return fin(qq); };
        // поджать точку направляющей внутрь формы (с тем же сдвигом):
        // масштабирование направляющей при вписывании в габарит иначе
        // выносит её за силуэт формы
        if(fcl) geo.formClamp=(q3)=>{
          for(let x=0;x<3;x++) qq[x]=q3[x]-sh[x];
          // осевая линия — внутри силуэта формы, а стержням позволено
          // немного выходить за контур: такие выходы делают композицию живее
          fcl(qq, 1.0, 0, true);
          for(let x=0;x<3;x++) q3[x]=qq[x]+sh[x];
        };
        geo.formDraw=ctrl.__formDraw;
      }
      geo.noSteer=false;
      geo.clampMin=[0,0,0]; geo.clampMax=[box.w,box.h,box.d];
      marchRibbon(geo);
      // ВПИСЫВАНИЕ В ГАБАРИТ В ДВЕ СТОРОНЫ. Фактический размер композиции
      // должен СОВПАДАТЬ с заданным габаритом: перелёты марша утягиваются,
      // недобор — растягивается. И то и другое — масштаб направляющей с
      // повторным маршем: физику (шаг стержней, зазоры, радиус изгиба) заново
      // проверяет сам марш, поэтому масштабировать направляющую легально.
      // Марш нелинеен — точный масштаб за один проход не угадать, поэтому
      // идём итерациями и запоминаем ЛУЧШИЙ проходимый вариант (вписался,
      // лента доложена до конца), к нему и возвращаемся в конце.
      geo.shrK=1;
      if(lanes<=1){
        const lim=[box.w,box.h,box.d];
        const cum=[1,1,1];
        const covOf=()=>geo.giMap[geo.giMap.length-1]/Math.max(1, geo.guideC.length-2);
        const stateOf=()=>{
          const bb=geoBBox(geo);
          const ext=[0,1,2].map(k2=>bb.max[k2]-bb.min[k2]+ROD_D);
          return {bb, ext,
                  fill:Math.min(...[0,1,2].map(k2=>ext[k2]/lim[k2])),
                  fits:[0,1,2].every(k2=>ext[k2]<=lim[k2]+1),
                  ok:covOf()>=0.9 && (geo.escapes||0)<=2};
        };
        const scaleGuide=(k2, sc, bc)=>{
          cum[k2]*=sc;
          for(const c of geo.guideC) c[k2]=bc[k2]+(c[k2]-bc[k2])*sc;
          // вписывание в габарит не имеет права выносить ленту за форму
          if(geo.formClamp) for(const c of geo.guideC) geo.formClamp(c);
        };
        let st=stateOf();
        let best=null;
        const keep=()=>{
          if(st.fits && st.ok && (!best || st.fill>best.fill))
            best={g:geo.guideC.map(c=>c.slice()), fill:st.fill, cum:cum.slice()};
        };
        keep();
        // ШАГ 1 — УТЯЖКА: перелёты марша (петли разворотов, вихрь) лечатся
        // мягким сжатием направляющей по перебравшим осям. Сначала лента
        // обязана вписаться: только вписанный вариант можно потом растягивать
        for(let it2=0; it2<5; it2++){
          if(st.fits) break;
          const bc=[0,1,2].map(k2=>(st.bb.min[k2]+st.bb.max[k2])/2);
          for(let k2=0;k2<3;k2++){
            if(st.ext[k2]<=lim[k2]+1) continue;
            // с запасом и небольшим перебором: марш нелинеен, за один проход
            // точный масштаб не угадать
            const sc=Math.max(0.88,(lim[k2]-10-it2*4)/Math.max(1,st.ext[k2]))*0.99;
            scaleGuide(k2, sc, bc);
          }
          marchRibbon(geo);
          st=stateOf();
          keep();
        }
        // ШАГ 2 — РАСТЯЖКА ДО ГАБАРИТА: недобравшие оси растягиваются, пока
        // лента не дойдёт до граней. Если растянутая направляющая перестаёт
        // вписываться или марш её не проходит, ось поджимается назад; лучший
        // вписанный вариант сохраняется и в конце возвращается
        for(let it3=0; it3<4; it3++){
          if(st.fill>=0.97 && st.fits && st.ok) break;
          const bc=[0,1,2].map(k2=>(st.bb.min[k2]+st.bb.max[k2])/2);
          let moved=false;
          for(let k2=0;k2<3;k2++){
            const want=(lim[k2]-4)/Math.max(1,st.ext[k2]);
            const sc=want>1.012 ? Math.min(1.12, want)
                   : (st.ext[k2]>lim[k2]+1 ? Math.max(0.90, (lim[k2]-6)/st.ext[k2]) : 1);
            if(Math.abs(sc-1)<0.012) continue;
            scaleGuide(k2, sc, bc);
            moved=true;
          }
          if(!moved) break;
          marchRibbon(geo);
          st=stateOf();
          keep();
        }
        // вернуться к лучшему вписанному проходу
        if(best && (!st.fits || !st.ok || st.fill<best.fill-0.005)){
          geo.guideC=best.g;
          for(let k2=0;k2<3;k2++) cum[k2]=best.cum[k2];
          marchRibbon(geo);
        }
        geo.shrK=Math.min(1, cum[0], cum[1], cum[2]);
      }
      // фактический габарит после ПОЛНОГО прохода
      const bbP=geoBBox(geo), limP=[box.w,box.h,box.d];
      const extP=[0,1,2].map(k=>bbP.max[k]-bbP.min[k]+ROD_D);
      const fillP=Math.min(...[0,1,2].map(k=>extP[k]/limP[k]));
      const fitP=[0,1,2].every(k=>extP[k]<=limP[k]+2);
      const covP=geo.giMap[geo.giMap.length-1]/Math.max(1, geo.guideC.length-2);
      const okP=fitP && covP>=0.9 && (geo.escapes||0)<=2 && (geo.covPre||1)>=0.9;
      const score=okP ? fillP : fillP-1;
      if(!bestPass || score>bestPass.score) bestPass={geo, score};
      // второй проход только если недобор заметный: он удваивает время
      // второй проход — только по недобору заполнения, без оглядки на время:
      // от времени зависела бы сама геометрия (см. лестницу ниже)
      // концепт-формы не растягиваются под габарит: их размер — замысел
      if(workF.concept && CONCEPT_DIRECT[workF.concept]) break;
      if(pass===2 || (okP && fillP>=0.955)) break;
      // исправление масштаба по факту: не больше 25% за проход
      // масштаб навивки ограничен: генератор изначально строит её примерно
      // по габариту, поэтому сжатие сильнее 15% — признак того, что перелёт
      // дал не размер навивки, а срыв марша (его лечит утяжка направляющей),
      // и такое «исправление» только съедало длину композиции
      // ЦЕЛЬ С ПЕРЕБОРОМ, НО ТОЛЬКО КОГДА ЛЕНТА УЖЕ ПОЧТИ ДОШЛА. Марш и
      // разведение витков съедают часть размаха, поэтому навивку просим на
      // 3% больше габарита — излишек снимет утяжка, а недобор снять нечем.
      // Если же лента далеко не дотянулась, перебор только сбивает марш
      // (он срывается на переросшей направляющей) — тогда цель ровно габарит
      const aimK=(fillP>=0.88) ? 1.03 : 1.0;
      for(let k=0;k<3;k++) secK[k]=Math.min(1.6, Math.max(0.85,
        secK[k]*Math.min(1.25, Math.max(0.90,
          (limP[k]*aimK-(aimK>1?0:6))/Math.max(1,extP[k])))));
    }
    geo=bestPass.geo;
    const bbF = geoBBox(geo);
    // у многожильного винта вписывание проверяет и утягивает сцена:
    // жилы вместе занимают габарит, порознь их бракуют зря
    geo.fitScale = (lanes>1) ? 1 :
                   ((bbF.max[0]-bbF.min[0]+ROD_D > box.w+2 ||
                     bbF.max[1]-bbF.min[1]+ROD_D > box.h+2 ||
                     bbF.max[2]-bbF.min[2]+ROD_D > box.d+2) ? 0 : 1);
    if(!geo.fitScale) (window.__fitlog=window.__fitlog||[]).push(
      [0,1,2].map(k=>Math.round(bbF.max[k]-bbF.min[k]+ROD_D-[box.w,box.h,box.d][k])));
    return geo;
  }
  for(let iter=0; iter<16; iter++){
    geo = sampleGuide(ctrl, opt);
    geo.clampMin=[0,0,0]; geo.clampMax=[box.w,box.h,box.d];
    marchRibbon(geo);
    const bb = geoBBox(geo);
    const cx=(bb.min[0]+bb.max[0])/2, cy=(bb.min[1]+bb.max[1])/2, cz=(bb.min[2]+bb.max[2])/2;
    const sx=(box.w-2*margin-ROD_D)/Math.max(1,bb.max[0]-bb.min[0]);
    const sy=(box.h-2*margin-ROD_D)/Math.max(1,bb.max[1]-bb.min[1]);
    const sz=(box.d-2*margin-ROD_D)/Math.max(1,bb.max[2]-bb.min[2]);
    const fx=Math.min(sx,1.5), fy=Math.min(sy,1.5), fz=Math.min(sz,1.5);
    ctrl = ctrl.map(pt=>[
      box.w/2 + (pt[0]-cx)*fx,
      box.h/2 + (pt[1]-cy)*fy,
      box.d/2 + (pt[2]-cz)*fz,
    ]);
    if(Math.abs(1-fx)<0.004 && Math.abs(1-fy)<0.004 && Math.abs(1-fz)<0.004) break;
  }
  // точная доводка: сжимаем направляющую до попадания в бокс
  const cumS = [1,1,1];
  for(let it=0; it<18; it++){
    const bb = geoBBox(geo);
    const bc = [(bb.min[0]+bb.max[0])/2,(bb.min[1]+bb.max[1])/2,(bb.min[2]+bb.max[2])/2];
    const target = [box.w/2, box.h/2, box.d/2];
    const lim = [box.w, box.h, box.d];
    const scale = [1,1,1];
    let shrunk = false;
    for(let k=0;k<3;k++){
      const ext = bb.max[k]-bb.min[k];
      const s2 = (lim[k]-2*margin-ROD_D-3-it*1.3)/Math.max(1,ext); // растущий запас
      if(s2<1){ scale[k]=s2; cumS[k]*=s2; shrunk=true; }
    }
    if(!shrunk) break;
    for(const c of geo.guideC){
      for(let k=0;k<3;k++) c[k]=target[k]+(c[k]-bc[k])*scale[k];
    }
    marchRibbon(geo);
  }
  // сжатие направляющей в марш-архитектуре легально (шаг и зазоры
  // держит марш); бракуем только фактическое невписывание
  const bbF = geoBBox(geo);
  geo.fitScale = (bbF.max[0]-bbF.min[0]+ROD_D > box.w+2 ||
                  bbF.max[1]-bbF.min[1]+ROD_D > box.h+2 ||
                  bbF.max[2]-bbF.min[2]+ROD_D > box.d+2) ? 0 : 1;
  return geo;
}

/* Направляющая: сплайн → точки с шагом стержней + желаемые профили
   ориентации (твист, независимые складки рядов). Направляющая может быть
   сколь угодно хаотичной — марш-укладка ниже соблюдает физические лимиты. */
function sampleGuide(ctrl, opt){
  const {twistAt, ribbonW, style} = opt;
  const NS = 900;
  const raw = [], cum = [0];
  for(let i=0;i<=NS;i++) raw.push(catmullRom(ctrl, i/NS));
  for(let i=1;i<=NS;i++) cum.push(cum[i-1] + V.len(V.sub(raw[i],raw[i-1])));
  const stepEff = ROD_STEP;
  const natLen = cum[NS];
  const m = Math.max(10, Math.floor(natLen/stepEff));
  let ci = 0;
  const atLen = (L)=>{
    while(ci<NS && cum[ci+1]<L) ci++;
    while(ci>0 && cum[ci]>L) ci--;
    const seg = cum[ci+1]-cum[ci] || 1;
    const u = (L-cum[ci])/seg;
    return [
      raw[ci][0]+(raw[ci+1][0]-raw[ci][0])*u,
      raw[ci][1]+(raw[ci+1][1]-raw[ci][1])*u,
      raw[ci][2]+(raw[ci+1][2]-raw[ci][2])*u,
    ];
  };
  const G = [], Gu = [];
  for(let k=0;k<m;k++){
    G.push(atLen(Math.min(natLen-1e-6, (k+0.5)*stepEff)));
    Gu.push(ci/NS);   // параметр сплайна для этой станции
  }
  const n = G.length;
  // ось навивки (касательная осевой линии формы) по станциям
  let axArr = null;
  if(opt.axisAt){
    const nc = opt.axisAt.length;
    axArr = Gu.map(u=>{
      const j = Math.max(0, Math.min(nc-1, Math.round(u*(nc-1))));
      return opt.axisAt[j].slice();
    });
  }
  if(opt.wind){
    for(let i=0;i<n;i++){
      const t=i/(n-1);
      G[i][0]+=opt.wind[0](t);
      G[i][1]+=opt.wind[1](t);
      G[i][2]+=opt.wind[2](t);
    }
  }
  const T = [];
  for(let i=0;i<n;i++){
    T.push(V.norm(V.sub(G[Math.min(n-1,i+1)], G[Math.max(0,i-1)])));
  }
  // rotation-minimizing frame + твист
  let W0;
  if(opt.w0hint) W0 = V.norm(opt.w0hint);
  else if(style==="serpentine" || style==="cascade") W0 = [0,1,0];
  else if(style==="spiral") W0 = V.norm([0,1,0.35]);
  else W0 = V.norm(V.cross(T[0], Math.abs(T[0][1])>0.9?[1,0,0]:[0,1,0]));
  W0 = V.norm(V.sub(W0, V.mul(T[0], V.dot(W0,T[0]))));
  const Wf = [W0];
  for(let i=1;i<n;i++){
    const v1 = V.sub(G[i], G[i-1]);
    const c1 = V.dot(v1,v1)||1;
    const rL = V.sub(Wf[i-1], V.mul(v1, 2*V.dot(v1,Wf[i-1])/c1));
    const tL = V.sub(T[i-1],  V.mul(v1, 2*V.dot(v1,T[i-1])/c1));
    const v2 = V.sub(T[i], tL);
    const c2 = V.dot(v2,v2)||1;
    let w = V.sub(rL, V.mul(v2, 2*V.dot(v2,rL)/c2));
    w = V.norm(V.sub(w, V.mul(T[i], V.dot(w,T[i]))));
    Wf.push(w);
  }
  const rows = opt.rows||1;
  const halfW = ribbonW/2;
  const guideD = [];
  let guideUp = null, guideDn = null;
  if(rows===2){ guideUp=[]; guideDn=[]; }
  for(let i=0;i<n;i++){
    const t=T[i], w=Wf[i];
    const th = twistAt(i/(n-1));
    const cs=Math.cos(th), sn=Math.sin(th);
    // «на ребро»: направление стержней задано жёстко (вертикаль), а не
    // rotation-minimizing frame — иначе лента подкатывается с ребра
    const wN = opt.wForce ? orthoTo(opt.wForce, t)
                          : V.norm(V.add(V.mul(w,cs), V.mul(V.cross(t,w),sn)));
    guideD.push(wN);
    if(rows===2){
      const N=V.norm(V.cross(t,wN));
      const pU=opt.foldUp ? opt.foldUp(i/(n-1)) : 0;
      const pD=opt.foldDn ? opt.foldDn(i/(n-1)) : 0;
      const cU=Math.cos(pU), sU=Math.sin(pU);
      const cD=Math.cos(pD), sD=Math.sin(pD);
      guideUp.push(V.norm([ wN[0]*cU+N[0]*sU,  wN[1]*cU+N[1]*sU,  wN[2]*cU+N[2]*sU]));
      guideDn.push(V.norm([-wN[0]*cD+N[0]*sD, -wN[1]*cD+N[1]*sD, -wN[2]*cD+N[2]*sD]));
    }
  }
  return {guideC:G, guideD, guideUp, guideDn, rows, halfW, stepEff,
          foldK:opt.foldK||0, foldMax:opt.foldMax||0,
          foldCom:opt.foldCom, foldDifU:opt.foldDifU, foldDifD:opt.foldDifD,
          fillAxisArr:axArr};
}

/* поворот единичного вектора a к b не более чем на maxAng (slerp) */
function rotTowards(a, b, maxAng){
  const d=Math.max(-1, Math.min(1, V.dot(a,b)));
  const ang=Math.acos(d);
  if(ang<=maxAng) return [b[0],b[1],b[2]];
  const sa=Math.sin(ang);
  if(sa<1e-6) return [a[0],a[1],a[2]];
  const w1=Math.sin(ang-maxAng)/sa, w2=Math.sin(maxAng)/sa;
  return V.norm([a[0]*w1+b[0]*w2, a[1]*w1+b[1]*w2, a[2]*w1+b[2]*w2]);
}

function orthoTo(v, T){
  let o=V.sub(v, V.mul(T, V.dot(v,T)));
  if(V.len(o)<1e-4) o=V.cross(T, Math.abs(T[1])>0.9?[1,0,0]:[0,1,0]);
  return V.norm(o);
}

/* поворот вектора prev (⊥Tn) к цели tgt вокруг Tn с ограничением
   скорости rotMax и углового ускорения accMax (omega — прежняя
   скорость). Ускорение ограничено, чтобы канты каркаса из проволоки
   изгибались плавно, без острых углов. Возвращает [вектор, скорость]. */
function spinTowards(prev, tgt, Tn, omega, rotMax, accMax){
  const P=orthoTo(prev,Tn), G=orthoTo(tgt,Tn);
  let a=Math.atan2(V.dot(V.cross(P,G),Tn), Math.max(-1,Math.min(1,V.dot(P,G))));
  a=Math.max(-rotMax, Math.min(rotMax, a));
  a=Math.max(omega-accMax, Math.min(omega+accMax, a));
  const ca=Math.cos(a), sa=Math.sin(a);
  return [V.norm(V.add(V.mul(P,ca), V.mul(V.cross(Tn,P),sa))), a];
}

/* ============================================================
   МАРШ-УКЛАДКА: строит ленту вдоль направляющей станция за
   станцией. Физические лимиты соблюдаются ПО ПОСТРОЕНИЮ:
   - шаг станций ровно 17 мм (стержни одинаковые, зазор осей 2 мм);
   - изгиб/поворот ограничен конусом step/R_FIT (технологический
     предел проволоки; правило Ø200 снято);
   - поперечный изгиб («веер» стержней) в пределах зазора GAP_MIN;
   - скорость твиста/складки ограничена так, что торцы соседних
     стержней не расходятся дальше GAP_MAX.
   Направления стержней всегда ⊥ ходу ленты, поэтому их развороты
   двигают торцы только вбок — минимальный зазор не нарушается.
   ============================================================ */
function marchRibbon(rb){
  const G=rb.guideC, gn=G.length;
  const step=rb.stepEff, twoRow=!!rb.guideUp, halfW=rb.halfW;
  const budget=Math.sqrt(Math.pow(ROD_D+GAP_MAX,2)-step*step)/halfW;
  const A_OP=step/R_FIT;
  // бюджет сближения торцов (мм на шаг) делится между поперечным
  // изгибом (веер) и изгибом при наклонённых складкой рядах
  // IP_SLACK — бюджет «веера», OP_SLACK — сближения торцов на ВНУТРЕННЕЙ
  // стороне изгиба (там запас всего 0.6 мм: шаг 11.6 при трубке Ø10),
  // OP_OUT — их расхождения на ВНЕШНЕЙ (там запас до GAP_MAX, берём
  // четверть: остальное нужно твисту и вееру)
  const IP_SLACK=0.25, OP_SLACK=0.30;
  // РЫЧАГ ЗАЗОРА — ПО ФАКТИЧЕСКОЙ ТРУБКЕ, А НЕ ПО ШИРИНЕ ЛЕНТЫ. Торец не
  // доходит до проволоки на ROD_AIR, поэтому крайняя точка стекла ближе к оси
  // ленты, чем кант: при том же зазоре между трубками наклон рядов может
  // быть больше — центральный контур уходит из плоскости кантов заметнее
  const armW=Math.max(1, halfW-(WIRE_D/2+ROD_AIR));
  const OP_OUT=Math.max(1.0, (ROD_D+GAP_MAX-step)*0.25);
  const TH_IP=IP_SLACK/halfW;
  const ROT_ROW=0.85*budget;
  const ROT_W=(twoRow ? 0.9-0.45*Math.min(1, rb.foldK||0) : 0.9)*budget;
  // лимит углового ускорения: кромка (кант) изгибается не острее ~R_FIT
  const ACC=step*step/(Math.max(115,R_FIT)*halfW)*0.75;
  // таблица дуги направляющей
  const cum=[0];
  for(let i=1;i<gn;i++) cum.push(cum[i-1]+V.len(V.sub(G[i],G[i-1])));
  const total=cum[gn-1];
  const m=Math.max(8, Math.floor(total/step)+1);
  let gj=0;
  const atG=(L)=>{
    while(gj<gn-2 && cum[gj+1]<L) gj++;
    while(gj>0 && cum[gj]>L) gj--;
    const seg=cum[gj+1]-cum[gj]||1;
    const t=(L-cum[gj])/seg;
    const lp=(A)=>V.norm([A[gj][0]+(A[gj+1][0]-A[gj][0])*t, A[gj][1]+(A[gj+1][1]-A[gj][1])*t, A[gj][2]+(A[gj+1][2]-A[gj][2])*t]);
    return {
      c:[G[gj][0]+(G[gj+1][0]-G[gj][0])*t, G[gj][1]+(G[gj+1][1]-G[gj][1])*t, G[gj][2]+(G[gj+1][2]-G[gj][2])*t],
      d:lp(rb.guideD),
      u:twoRow?lp(rb.guideUp):null,
      v:twoRow?lp(rb.guideDn):null,
    };
  };
  const g0=atG(0), g1=atG(Math.min(total-1e-6, step));
  let T=V.sub(g1.c, g0.c);
  T = V.len(T)>1e-6 ? V.norm(T) : [1,0,0];
  let W=orthoTo(g0.d, T);
  let Up=twoRow?orthoTo(g0.u, T):null;
  let Dn=twoRow?orthoTo(g0.v, T):null;
  let omW=0, omU=0, omD=0; // угловые скорости разворота
  // сторона наклона рядов (складки), сглаженная по ходу ленты
  let foldS=0;
  const C=[[g0.c[0],g0.c[1],g0.c[2]]];
  const Ts=[T], dirs=[W];
  const dirUp=twoRow?[Up]:null, dirDn=twoRow?[Dn]:null;
  // PURE PURSUIT: цель — точка направляющей на упреждении впереди
  // БЛИЖАЙШЕЙ к текущей позиции. Иначе срезанные маршем повороты
  // копят «долг длины», который выстреливает прямой за габарит.
  // ВСЕ окна упреждения — в МИЛЛИМЕТРАХ (это физические длины: радиус
  // изгиба, длина перекрутки на ребро). В станциях их задавать нельзя:
  // шаг станции зависит от диаметра трубки, и при Ø8 поводок оказывался
  // короче радиуса поворота — цель уходила внутрь непроходимого круга,
  // марш срывался в орбитальную ловушку и лента обрывалась на середине.
  const ST=(mm)=>Math.max(2, Math.round(mm/step));   // мм → станции
  const LA=232;      // упреждение ≈2R изгиба: цель всегда достижима
  const LA_TURN=116; // в развороте поводок короче
  const W_NEAR=ST(232), W_AHEAD=ST(365), W_BANK=ST(564);
  // окно предикции для СКЛАДКИ короткое: ряды разворачиваются на 0.1 рад
  // за 2–3 станции, поэтому прижимать складку заранее не нужно — иначе она
  // умирает на всём подходе к развороту и центр дублирует канты
  const W_FOLD=ST(90);
  const STALL=ST(500), JUMP1=ST(200), JUMP2=ST(166), BEHIND=ST(365);
  const maxSt=Math.ceil(total/step*1.6)+8;
  // углы поворота направляющей по точкам — для предикции: складка и
  // закрутка прижимаются ДО прихода поворота, а не в нём
  const gAng=[0], gAx=[[0,1,0]];
  for(let i2=1;i2<gn-1;i2++){
    const a2=V.norm(V.sub(G[i2],G[i2-1])), b2=V.norm(V.sub(G[i2+1],G[i2]));
    gAng.push(Math.acos(Math.max(-1,Math.min(1,V.dot(a2,b2)))));
    // ось поворота направляющей в этой точке (для банка в виражах)
    let ax2=V.cross(a2,b2);
    const L2=V.len(ax2);
    gAx.push(L2>1e-6 ? V.mul(ax2,1/L2) : gAx[gAx.length-1]);
  }
  gAng.push(0); gAx.push(gAx[gAx.length-1]);
  let gi=0, stall=0, prevOp=0, behind=0, escapes=0;
  const giMap=[0]; // станция → гид-индекс (для разбивки по пробегам)
  const d2=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1],dz=a[2]-b[2];return dx*dx+dy*dy+dz*dz;};
  for(let k=1;k<maxSt;k++){
    // продвинуть указатель к ближайшей гид-точке: полный argmin по
    // окну (ранний break застревает на вершинах разворотов)
    const gi0=gi;
    let bd=d2(G[gi], C[k-1]);
    for(let t2=gi+1; t2<=Math.min(gn-1, gi+W_NEAR); t2++){
      const dd=d2(G[t2], C[k-1]);
      if(dd<bd-1e-9){ bd=dd; gi=t2; }
    }
    if(gi>=gn-2){ rb.endReason='end'; break; }
    if(gi===gi0){
      if(++stall>STALL){
        // вырыв из орбитальной ловушки: цель прыгает вперёд по гиду
        if(escapes<5 && gi<gn-JUMP1-4){ gi+=JUMP1; stall=0; escapes++; }
        else { rb.endReason='stall@'+gi; break; }
      }
    } else stall=0;
    let aheadAng=0;
    for(let t2=gi; t2<=Math.min(gn-1, gi+W_AHEAD); t2++) aheadAng=Math.max(aheadAng, gAng[t2]);
    const needTurn=Math.min(1, aheadAng/A_OP);
    // в развороте цель ведётся коротким поводком (~R изгиба) — орбитальная
    // ловушка не возникает; на прямых поводок длинный (гладкость)
    const LAe = needTurn>0.5 ? LA_TURN : LA;
    const g=atG(Math.min(total-1e-6, cum[gi]+LAe));
    let v=V.sub(g.c, C[k-1]);
    v = V.len(v)>1e-6 ? V.norm(v) : T;
    // стены слоя: дальний руль начинает разворот заранее (ленте
    // «плашмя» нужно ~0.4 м на перекрутку в поворот), ближний дожимает.
    // Отступ — по фактическому вылету станции на каждой оси.
    if(rb.clampMin && !rb.noSteer){
      const mn=rb.clampMin, mx=rb.clampMax;
      let steer=false;
      const v2=[v[0],v[1],v[2]];
      for(let x=0;x<3;x++){
        const kx = twoRow
          ? Math.max(Math.abs(Up[x]), Math.abs(Dn[x]))
          : Math.abs(W[x]);
        const mrg = kx*halfW + ROD_R + 4;
        // заполнение: направляющая уже физична и вписана (двойной
        // марш) — дальний руль только мешает складкам у торцов
        const HZ = rb.fillMode
          ? [[200,0.8],[66,2.2]]
          : [[498,0.7],[166,1.4],[50,3.0]];
        for(const hz of HZ){
          const look=hz[0], gain=hz[1];
          const pos=C[k-1][x]+v[x]*look;
          if(pos<mn[x]+mrg){ v2[x]+=(mn[x]+mrg-pos)/look*gain; steer=true; }
          else if(pos>mx[x]-mrg){ v2[x]-=(pos-(mx[x]-mrg))/look*gain; steer=true; }
        }
      }
      // ГРАНИЦА ФОРМЫ ГАБАРИТА: если прогноз хода уходит за форму, руль
      // тянет станцию к направляющей — она по построению внутри формы
      if(rb.formIn){
        // уже вышли за форму — доворот к направляющей с полной силой
        if(!rb.formIn(C[k-1])){
          for(let x=0;x<3;x++) v2[x]+=(g.c[x]-C[k-1][x])/220*2.6;
          steer=true;
        }
        for(const hz of [[230,1.0],[80,2.2]]){
          const look=hz[0], gain=hz[1];
          const q4=[C[k-1][0]+v[0]*look, C[k-1][1]+v[1]*look, C[k-1][2]+v[2]*look];
          if(!rb.formIn(q4)){
            for(let x=0;x<3;x++) v2[x]+=(g.c[x]-q4[x])/look*gain;
            steer=true;
          }
        }
      }
      if(steer) v=V.norm(v2);
    }
    // конусы поворота: поперечный («веер», по W) и основной изгиб
    const N=V.norm(V.cross(T,W));
    const xt=V.dot(v,T), yw=V.dot(v,W), zn=V.dot(v,N);
    const rawIp=Math.atan2(yw, Math.max(1e-4,xt));
    let rawOp=Math.max(-A_OP, Math.min(A_OP, Math.atan2(zn, Math.max(1e-4,xt))));
    // цель сбоку или позади — доворот максимальной кривизной в её
    // сторону (иначе сингулярность: op≈0 и лента летит прямо)
    if(xt<0.2){
      rawOp=A_OP*(Math.abs(zn)>1e-6 ? Math.sign(zn) : (prevOp>=0?1:-1));
      // цель слишком долго позади — она внутри непроходимого круга:
      // переносим её вперёд по направляющей
      if(++behind>BEHIND && gi<gn-JUMP2-4 && escapes<6){ gi+=JUMP2; behind=0; escapes++; }
    } else behind=0;
    let ip=Math.max(-TH_IP, Math.min(TH_IP, rawIp));
    // складка наклоняет торцы с оси изгиба: изгиб ограничен так,
    // чтобы внутренние торцы рядов не сблизились меньше GAP_MIN
    // СВЯЗКА «ИЗГИБ ↔ СКЛАДКА» — ЗНАКОВАЯ. Стержни жёсткие: как только
    // боковые контуры сближаются, центральный обязан выйти из их плоскости
    // (провиснуть или вздыбиться) — смещение центра = длина стержня × sin α.
    // Складка уводит торцы с плоскости изгиба: ушедшие ВНУТРЬ поворота
    // сближаются (запас 0.6 мм), ушедшие НАРУЖУ расходятся (запас до
    // GAP_MAX). Симметричный лимит душил складку в обе стороны, и центр
    // дублировал середину между кантами
    let hPos=1e-3, hNeg=1e-3;
    if(twoRow){
      const dU=V.dot(Up,N), dD=V.dot(Dn,N);
      hPos=Math.max(hPos, armW*Math.max(0,  dU), armW*Math.max(0,  dD));
      hNeg=Math.max(hNeg, armW*Math.max(0, -dU), armW*Math.max(0, -dD));
    }
    // разворот стержней (закрутка, перекрутка на ребро) требует более
    // пологого изгиба: пока торцы гуляют (omW), радиус не короче ~110 —
    // иначе «штопор»: тюбик ленты складывается сам на себя торец-к-торцу
    // (при R≥110 торцы безопасны при любом наклоне стержней к оси изгиба)
    const tSp=Math.min(1, Math.abs(omW)/(0.7*ROT_W));
    const opBase=A_OP*(1-tSp)+(step/145)*tSp;
    // при повороте к +N центр кривизны лежит со стороны +N, значит
    // внутренние торцы — те, что ушли в +N: им и достаётся жёсткий лимит
    const limPos=Math.min(opBase, OP_SLACK/hPos, OP_OUT/hNeg);
    const limNeg=Math.min(opBase, OP_SLACK/hNeg, OP_OUT/hPos);
    const opLim=Math.max(limPos, limNeg);
    let op=rawOp>=0 ? Math.min(rawOp, limPos) : Math.max(rawOp, -limNeg);
    prevOp=op;
    if(rb.__log) rb.__log.push([k, gi, +xt.toFixed(2), +rawOp.toFixed(3), +op.toFixed(3), +opLim.toFixed(4), +ip.toFixed(4), Math.round(C[k-1][0]), Math.round(C[k-1][2]),
      twoRow? +V.dot(Up,N).toFixed(3):0, +V.dot(W,[0,1,0]).toFixed(3), +omW.toFixed(4)]);
    const Tn=V.norm(V.add(V.add(T, V.mul(W,Math.tan(ip))), V.mul(N,Math.tan(op))));
    C.push(V.add(C[k-1], V.mul(Tn,step)));
    Ts.push(Tn);
    giMap.push(gi);
    // ориентация: к цели из направляющей со скоростным лимитом;
    // векторы всегда ⊥ Tn, разворот — только вокруг хода ленты.
    // Руление: если поворот «плашмя» невозможен (поперечный конус),
    // лента сама докручивается на ребро поворота — как в реальности
    let wTgt = orthoTo(g.d, Tn);
    if(rb.fillMode && !rb.edgeMode){
      // банк: в повороте стержни выравниваются с осью изгиба (как
      // мотоцикл в вираже) — закрутка живёт на прямых участках
      const need=Math.max(Math.min(1, Math.abs(rawOp)/(0.5*A_OP)), needTurn)*0.9;
      if(need>0.05){
        // ось предстоящего поворота НАПРАВЛЯЮЩЕЙ. Банк — ТОЛЬКО для
        // виражей вокруг оси заполнения (кольца в плане: стержни лягут
        // на ребро). Вертикальные перегибы и свитки крутят ленту вокруг
        // её собственных стержней — там банк не нужен и вреден
        // окно предикции ≈ длина перекрутки на ребро (90° ≈ 300 мм):
        // банк начинается заранее, иначе поворот в плане недостижим
        let axS=[0,0,0];
        for(let t2=gi; t2<=Math.min(gn-1, gi+W_BANK); t2++){
          axS[0]+=gAx[t2][0]*gAng[t2]; axS[1]+=gAx[t2][1]*gAng[t2]; axS[2]+=gAx[t2][2]*gAng[t2];
        }
        const axN=V.len(axS);
        const fA=rb.fillAxisArr ? rb.fillAxisArr[Math.min(rb.fillAxisArr.length-1, gi)]
                                : (rb.fillAxis||[0,1,0]);
        const al=axN>1e-5 ? Math.abs(V.dot(V.mul(axS,1/axN), fA)) : 0;
        if(al>0.6){
          let axO=orthoTo(V.mul(axS,1/axN), Tn);
          if(V.dot(axO,wTgt)<0) axO=V.mul(axO,-1);
          const k3=need*al;
          wTgt=V.norm([wTgt[0]+(axO[0]-wTgt[0])*k3, wTgt[1]+(axO[1]-wTgt[1])*k3, wTgt[2]+(axO[2]-wTgt[2])*k3]);
        } else {
          // изгиб вокруг оси стержней (складки, завитки, свитки) —
          // чистый изгиб: ориентация замирает, иначе разворот стержней
          // включает анти-«штопор» и душит кривизну (R→110)
          const wCur=orthoTo(W, Tn);
          const k4=need*(1-al);
          wTgt=V.norm([wTgt[0]+(wCur[0]-wTgt[0])*k4, wTgt[1]+(wCur[1]-wTgt[1])*k4, wTgt[2]+(wCur[2]-wTgt[2])*k4]);
        }
      }
    } else if(!rb.edgeMode && Math.abs(rawIp) > TH_IP*1.5){
      let ax=V.cross(T, v);
      if(V.len(ax)>1e-4){
        ax=V.norm(ax);
        if(V.dot(ax,W)<0) ax=V.mul(ax,-1);
        wTgt=orthoTo(ax, Tn);
      }
    }
    // «на ребро»: стержни вертикальны по всей ленте — ни банк, ни доворот
    // на ребро поворота не имеют права её подкатить
    if(rb.edgeMode) wTgt = orthoTo([0,1,0], Tn);
    const sw = spinTowards(W, wTgt, Tn, omW, ROT_W, ACC);
    W=sw[0]; omW=sw[1];
    dirs.push(W);
    if(twoRow){
      // ЦЕНТРАЛЬНЫЙ КОНТУР НЕЗАВИСИМ — И ЭТО СЛЕДСТВИЕ ФИЗИКИ ПОВОРОТА.
      // Стержни жёсткие: в повороте боковые контуры идут по разным дугам, их
      // шаг сближается на внутренней стороне и раскрывается на внешней.
      // Значит ряды ОБЯЗАНЫ наклониться, а центральный контур — выйти из
      // плоскости кантов на длина_стержня × sin α (вздыбиться в сторону
      // центра поворота). Наклон односторонний: торцы уходят НАРУЖУ
      // поворота, где зазор раскрывается до GAP_MAX (бюджет OP_OUT ≈ 1.6 мм
      // на шаг), а не внутрь, где запаса всего OP_SLACK = 0.3 мм. Поэтому
      // допустимый наклон в 5 раз больше симметричного:
      //     α ≤ OP_OUT / (нужный_изгиб × полширина)
      // На пробегах (изгиба нет) допуск огромен — там центр живёт по своему
      // плавному профилю (провисает и поднимается сам по себе).
      const needOp=Math.min(1, Math.abs(rawOp)/A_OP);
      // потребность в изгибе на КОРОТКОМ окне: складка живёт до самого
      // разворота и прижимается только там, где изгиб реально нужен
      let aheadF=0;
      for(let t2=gi; t2<=Math.min(gn-1, gi+W_FOLD); t2++) aheadF=Math.max(aheadF, gAng[t2]);
      const opNeed=Math.max(Math.abs(rawOp), aheadF, 1e-5);
      // сколько наклона просит пластика
      const aWant=rb.foldMax||0;
      // ОБЩИЙ наклон (оба ряда в одну сторону, «домик»): торцы уходят НАРУЖУ
      // поворота, где шаг раскрывается до GAP_MAX — бюджет OP_OUT
      const aAllow=Math.min(aWant, 0.30*OP_OUT/(opNeed*armW));
      // НЕЗАВИСИМАЯ часть рядов: у неё один торец уходит ВНУТРЬ поворота,
      // где запаса всего OP_SLACK — поэтому её лимит в пять раз жёстче
      const dLim=Math.min(aWant, 0.30*OP_SLACK/(opNeed*armW));
      // СТОРОНА НАКЛОНА — ПО ПРЕДСТОЯЩЕМУ ПОВОРОТУ НАПРАВЛЯЮЩЕЙ, ПЛАВНО.
      // Мгновенный знак изгиба дёргается: ряды гонялись бы за перекидывающейся
      // целью, связка «изгиб↔складка» зажимала бы кривизну и марш терял
      // направляющую. Знак берём по окну предикции и фильтруем — ряды
      // успевают приготовиться к повороту заранее
      {
        const Nc0=V.norm(V.cross(Tn,W));
        let sAh=0;
        for(let t2=gi; t2<=Math.min(gn-1, gi+W_AHEAD); t2++)
          sAh+=V.dot(gAx[t2],Nc0)*gAng[t2];
        const sTgt=Math.max(-1, Math.min(1, sAh/Math.max(1e-6, 0.5*A_OP)));
        foldS+=(sTgt-foldS)*0.10;
      }
      const sgn=Math.max(-1, Math.min(1, foldS*1.4));
      const sN=k/Math.max(1,m-1);
      const cl=(v,L)=>Math.max(-L, Math.min(L, v));
      // в повороте общий наклон задаёт физика (центр вздыбается к центру
      // кривизны), на пробеге — свой свободный профиль (провис/подъём)
      // свободный профиль пробега лимитируется СТРОГИМ бюджетом: его знак
      // случаен и может смотреть внутрь поворота, где запас всего OP_SLACK.
      // Иначе на подходе к развороту профиль зажимал изгиб впятеро и марш
      // терял направляющую
      const aCom=-sgn*aAllow + (1-Math.abs(sgn))*cl(rb.foldCom?rb.foldCom(sN):0, dLim);
      const aU=aCom+cl(rb.foldDifU?rb.foldDifU(sN):0, dLim);
      const aD=aCom+cl(rb.foldDifD?rb.foldDifD(sN):0, dLim);
      const Wc=orthoTo(W,Tn), Nc=orthoTo(N,Tn);
      const mkRow=(sd,a)=>{
        const c2=Math.cos(a), s2=Math.sin(a);
        return V.norm([sd*Wc[0]*c2+Nc[0]*s2, sd*Wc[1]*c2+Nc[1]*s2, sd*Wc[2]*c2+Nc[2]*s2]);
      };
      const uT=mkRow(1,aU), dT=mkRow(-1,aD);
      // насколько складка прижата изгибом (для лимита ускорения рядов)
      const flat=aWant>1e-5 ? 1-Math.min(1, Math.abs(aCom)/aWant) : 1;
      // в заполнении ряды идут за контуром с его же скоростью: иначе
      // они отстают на перекате и связка «изгиб↔складка» душит кривизну.
      // При прижатой складке лимит углового УСКОРЕНИЯ снимается: он даёт
      // перерегулирование, ряды входят в автоколебание ±45°, и связка
      // зажимает изгиб до R≈5 м (лента не может повернуть вообще)
      const rotRow = rb.fillMode ? ROT_W : ROT_ROW;
      // ускорение рядов при прижатой складке поднимаем, но не снимаем
      // совсем: полное снятие убивает автоколебание, зато кант получает
      // локальные заломы (радиус канта падал до 18 мм)
      const accRow = (rb.fillMode && flat>0.6) ? Math.min(rotRow, ACC*4) : ACC;
      const su = spinTowards(Up, uT, Tn, omU, rotRow, accRow);
      Up=su[0]; omU=su[1];
      const sd = spinTowards(Dn, dT, Tn, omD, rotRow, accRow);
      Dn=sd[0]; omD=sd[1];

      dirUp.push(Up); dirDn.push(Dn);
    }
    T=Tn;
  }
  // СГЛАЖИВАНИЕ КАРКАСА. Проволока Ø3 имеет собственную жёсткость и не
  // может идти мелкими биениями: изломы короче ~5 см она сама распрямляет.
  // Пропускаем осевую линию и направления рядов через лёгкий биномиальный
  // фильтр (1-4-6-4-1 по пяти станциям ≈ 5 см) — контуры получаются
  // плавными, а шаг станций и зазоры меняются меньше чем на процент.
  {
    const W5=[1,4,6,4,1], SW=16;
    const smoothPts=(A)=>{
      const out=A.map(p=>p.slice());
      for(let i=2;i<A.length-2;i++){
        for(let k=0;k<3;k++){
          let acc=0;
          for(let j=-2;j<=2;j++) acc+=A[i+j][k]*W5[j+2];
          out[i][k]=acc/SW;
        }
      }
      return out;
    };
    const smoothDirs=(A)=>{
      if(!A) return A;
      const out=A.map(p=>p.slice());
      for(let i=2;i<A.length-2;i++){
        const acc=[0,0,0];
        for(let j=-2;j<=2;j++) for(let k=0;k<3;k++) acc[k]+=A[i+j][k]*W5[j+2];
        const L=Math.hypot(acc[0],acc[1],acc[2])||1;
        out[i]=[acc[0]/L, acc[1]/L, acc[2]/L];
      }
      return out;
    };
    const Cs=smoothPts(C);
    for(let i=0;i<C.length;i++) C[i]=Cs[i];
    const ds=smoothDirs(dirs);
    for(let i=0;i<dirs.length;i++) dirs[i]=ds[i];
    if(twoRow){
      // ШАГРЕНЬ НА КАНТАХ. Канты идут по направлениям рядов, и мелкое дрожание
      // этих направлений читается на краю ленты рябью — «шагренью». Гасим её,
      // не тронув складку: направление ряда раскладывается на ОБЩУЮ ОСЬ ленты
      // (du−dd — по ней идут оба канта) и РАСТВОР рядов (du+dd — это и есть
      // складка, независимое положение центрального контура). Общую ось
      // сглаживаем сильно (пять станций), раствор — мягко (три станции),
      // поэтому внутренние торцы не сближаются ниже нормы
      const mild=(A)=>{
        const out=A.map(p=>p.slice());
        for(let i=1;i<A.length-1;i++)
          for(let k=0;k<3;k++) out[i][k]=(A[i-1][k]+2*A[i][k]+A[i+1][k])/4;
        return out;
      };
      const wide=(A)=>{
        const out=A.map(p=>p.slice());
        for(let i=2;i<A.length-2;i++)
          for(let k=0;k<3;k++){
            let acc=0;
            for(let j=-2;j<=2;j++) acc+=A[i+j][k]*W5[j+2];
            out[i][k]=acc/SW;
          }
        return out;
      };
      const axis=[], splay=[];
      for(let i=0;i<dirUp.length;i++){
        axis.push([(dirUp[i][0]-dirDn[i][0])/2, (dirUp[i][1]-dirDn[i][1])/2,
                   (dirUp[i][2]-dirDn[i][2])/2]);
        splay.push([(dirUp[i][0]+dirDn[i][0])/2, (dirUp[i][1]+dirDn[i][1])/2,
                    (dirUp[i][2]+dirDn[i][2])/2]);
      }
      // фильтр общей оси: широкий на 70% и мягкий на 30% — так шагрень
      // гаснет, а шаг стержней (норма зазора 1 мм) не съедается веером
      const axW=wide(axis), axM=mild(axis), sp2=mild(splay);
      const ax2=axW.map((v,i)=>[0.7*v[0]+0.3*axM[i][0],
                                0.7*v[1]+0.3*axM[i][1],
                                0.7*v[2]+0.3*axM[i][2]]);
      for(let i=0;i<dirUp.length;i++){
        dirUp[i]=V.norm([ax2[i][0]+sp2[i][0], ax2[i][1]+sp2[i][1], ax2[i][2]+sp2[i][2]]);
        dirDn[i]=V.norm([sp2[i][0]-ax2[i][0], sp2[i][1]-ax2[i][1], sp2[i][2]-ax2[i][2]]);
      }
    }
    // ПЕРЕСЭМПЛИРОВАНИЕ РОВНЫМ ШАГОМ. Сглаживание чуть сдвигает станции, а
    // шаг стержней должен остаться точным (иначе зазоры и радиус изгиба
    // считаются по неравномерной сетке). Проходим сглаженную линию по длине
    // дуги ровно через step и переносим на новую сетку направления рядов.
    {
      const cumC=[0];
      for(let i=1;i<C.length;i++) cumC.push(cumC[i-1]+V.len(V.sub(C[i],C[i-1])));
      const tot=cumC[cumC.length-1];
      const m2=Math.max(8, Math.floor(tot/step)+1);
      const C2=[], D2=[], U2=[], N2=[];
      let j2=0;
      for(let k2=0;k2<m2;k2++){
        const Lq=Math.min(tot, k2*step);
        while(j2<C.length-2 && cumC[j2+1]<Lq) j2++;
        const seg=cumC[j2+1]-cumC[j2]||1, u=(Lq-cumC[j2])/seg;
        const mix=(A)=>{
          const q=[0,0,0];
          for(let k=0;k<3;k++) q[k]=A[j2][k]+(A[j2+1][k]-A[j2][k])*u;
          return q;
        };
        C2.push(mix(C));
        D2.push(V.norm(mix(dirs)));
        if(twoRow){ U2.push(V.norm(mix(dirUp))); N2.push(V.norm(mix(dirDn))); }
      }
      C.length=0; dirs.length=0; Ts.length=0;
      if(twoRow){ dirUp.length=0; dirDn.length=0; }
      for(let k2=0;k2<C2.length;k2++){
        C.push(C2[k2]); dirs.push(D2[k2]);
        if(twoRow){ dirUp.push(U2[k2]); dirDn.push(N2[k2]); }
        Ts.push([1,0,0]);
      }
      for(let i=0;i<C.length;i++){
        const a=C[Math.max(0,i-1)], b2=C[Math.min(C.length-1,i+1)];
        const t2=V.sub(b2,a);
        Ts[i]=V.len(t2)>1e-6 ? V.norm(t2) : (i>0?Ts[i-1]:[1,0,0]);
      }
      if(giMap.length>C.length) giMap.length=C.length;
      while(giMap.length<C.length) giMap.push(giMap[giMap.length-1]||0);
    }
  }
  // сборка стержней, кантов, нормалей
  // ПРАВИЛО СБОРКИ: стержень НЕ ДОХОДИТ до проволоки каркаса на 2 мм —
  // между торцом стекла и каркасом остаётся воздух, поэтому и сам каркас,
  // и диоды на нём видны. Каркас (канты и центральный контур) стоит на
  // своих местах: ширина ленты по-прежнему равна длине стержня × рядность
  // отступ торца трубки от ОСИ проволоки: радиус проволоки + воздух
  const IN=WIRE_D/2+ROD_AIR;
  const n=C.length;
  const rods=[], railA=[], railB=[], uTop=[], uBot=[];
  for(let i=0;i<n;i++){
    if(twoRow){
      const du=dirUp[i], dd=dirDn[i];
      rods.push({st:i, u1:IN,      u2:halfW-IN, len:halfW-2*IN, nom:halfW,
        a:[C[i][0]+du[0]*(halfW-IN), C[i][1]+du[1]*(halfW-IN), C[i][2]+du[2]*(halfW-IN)],
        b:[C[i][0]+du[0]*IN, C[i][1]+du[1]*IN, C[i][2]+du[2]*IN], n:V.norm(V.cross(Ts[i],du))});
      rods.push({st:i, u1:-(halfW-IN), u2:-IN, len:halfW-2*IN, nom:halfW,
        a:[C[i][0]+dd[0]*(halfW-IN), C[i][1]+dd[1]*(halfW-IN), C[i][2]+dd[2]*(halfW-IN)],
        b:[C[i][0]+dd[0]*IN, C[i][1]+dd[1]*IN, C[i][2]+dd[2]*IN], n:V.norm(V.cross(Ts[i],dd))});
      railA.push([C[i][0]+du[0]*halfW, C[i][1]+du[1]*halfW, C[i][2]+du[2]*halfW]);
      railB.push([C[i][0]+dd[0]*halfW, C[i][1]+dd[1]*halfW, C[i][2]+dd[2]*halfW]);
    } else {
      const d=dirs[i];
      rods.push({st:i, u1:-(halfW-IN), u2:halfW-IN, len:2*(halfW-IN), nom:2*halfW,
        a:[C[i][0]+d[0]*(halfW-IN), C[i][1]+d[1]*(halfW-IN), C[i][2]+d[2]*(halfW-IN)],
        b:[C[i][0]-d[0]*(halfW-IN), C[i][1]-d[1]*(halfW-IN), C[i][2]-d[2]*(halfW-IN)],
        n:V.norm(V.cross(Ts[i],d))});
      railA.push([C[i][0]+d[0]*halfW, C[i][1]+d[1]*halfW, C[i][2]+d[2]*halfW]);
      railB.push([C[i][0]-d[0]*halfW, C[i][1]-d[1]*halfW, C[i][2]-d[2]*halfW]);
    }
    uTop.push(halfW); uBot.push(-halfW);
  }
  rb.giMap=giMap; rb.escapes=escapes;
  rb.centers=C; rb.dirs=dirs; rb.dirUp=dirUp; rb.dirDn=dirDn;
  rb.rods=rods; rb.railA=railA; rb.railB=railB;
  rb.uTop=uTop; rb.uBot=uBot;
  rb.ribbonLen=n*step;
}

function geoBBox(geo){
  const min=[1e9,1e9,1e9], max=[-1e9,-1e9,-1e9];
  for(const r of geo.rods){
    for(const p of [r.a,r.b]){
      for(let k=0;k<3;k++){
        if(p[k]<min[k])min[k]=p[k];
        if(p[k]>max[k])max[k]=p[k];
      }
    }
  }
  return {min,max};
}

/* ============================================================
   Коллизии: лента и стержни не должны пересекаться.
   Каждый стержень — капсула Ø15. Проверяем пары стержней разных
   лент и далёких участков одной ленты (капсула-капсула), витки
   расталкиваем итеративной релаксацией; «веер» на крутом изгибе
   внутри ленты лечим локальным распрямлением дуги.
   ============================================================ */
let CLEAR_FAR  = ROD_D + 11;   // мин. дистанция осей далёких стержней (стекло + 11 воздуха)
// внутри ленты: уточнение производства — зазор трубок от 0.1 мм,
// касание допустимо, пересечение — никогда
let CLEAR_NEAR = ROD_D + 0.1;
let SKIP_NEAR  = 2;    // соседи по каркасу не проверяются (~33 мм)
let NEAR_WIN   = 8;    // «ближняя зона» своей ленты (~133 мм)

function closestSegSeg(P1,Q1,P2,Q2){
  const d1=V.sub(Q1,P1), d2=V.sub(Q2,P2), r=V.sub(P1,P2);
  const a=V.dot(d1,d1), e=V.dot(d2,d2), f=V.dot(d2,r);
  const c=V.dot(d1,r), b=V.dot(d1,d2);
  const denom=a*e-b*b;
  let s = denom!==0 ? Math.min(1,Math.max(0,(b*f-c*e)/denom)) : 0;
  let t = (b*s+f)/e;
  if(t<0){ t=0; s=Math.min(1,Math.max(0,-c/a)); }
  else if(t>1){ t=1; s=Math.min(1,Math.max(0,(b-c)/a)); }
  const c1=V.add(P1,V.mul(d1,s)), c2=V.add(P2,V.mul(d2,t));
  return [V.len(V.sub(c1,c2)), c1, c2];
}

/* обход близких пар стержней через пространственный хэш */
/* ПЕРЕБОР БЛИЗКИХ ПАР СТЕРЖНЕЙ — узкое место всей генерации: на плотной
   композиции стержней тысячи, пар — миллионы. Ускорено двумя вещами:
   ячейки сетки мельче (стержень отмечается восемью точками вдоль себя, а не
   четырьмя), и дедупликация пар идёт не через Set с миллионами ключей, а
   отметкой номера текущего стержня в типизированном массиве — без аллокаций
   и без давления на сборщик мусора.
   Замер (пластика «на ребро», 2400×2400×900, 6408 стержней, 37 пог. м):
   разведение занимало 147 с, стало 0.9 с — при том же результате
   (касаний нет, зазоры 1.36–1.9 мм). */
function forEachClosePair(ribbons, radius, cb){
  const H = 110+radius;
  const grid = new Map();
  const items = [];
  ribbons.forEach((rb,ri)=>rb.rods.forEach((r,i)=>items.push({ri,i,r})));
  const cellsOf = items.map(()=>null);
  items.forEach((o,oi)=>{
    const {a,b} = o.r;
    let prev = null;
    const list=[];
    for(let s=0;s<=7;s++){
      const k = Math.floor((a[0]+(b[0]-a[0])*s/7)/H)+"|"
              + Math.floor((a[1]+(b[1]-a[1])*s/7)/H)+"|"
              + Math.floor((a[2]+(b[2]-a[2])*s/7)/H);
      if(k!==prev){
        let cell = grid.get(k);
        if(!cell){ cell=[]; grid.set(k,cell); }
        cell.push(oi); prev=k; list.push(k);
      }
    }
    cellsOf[oi]=list;
  });
  const stamp = new Int32Array(items.length);
  for(let oi=0; oi<items.length; oi++){
    const A=items[oi], mark=oi+1;
    for(const key of cellsOf[oi]){
      const p=key.split("|");
      const cx=+p[0], cy=+p[1], cz=+p[2];
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
        const nb = grid.get((cx+dx)+"|"+(cy+dy)+"|"+(cz+dz));
        if(!nb) continue;
        for(let t=0;t<nb.length;t++){
          const oj=nb[t];
          if(oj<=oi || stamp[oj]===mark) continue;
          stamp[oj]=mark;
          const B=items[oj];
          if(A.ri===B.ri && Math.abs(A.r.st-B.r.st)<=SKIP_NEAR) continue;
          cb(A,B);
        }
      }
    }
  }
}

function resolveCollisions(ribbons, box){
  // Коллизии ищутся на ФАКТИЧЕСКОЙ (марш) геометрии, а разводятся
  // смещением НАПРАВЛЯЮЩЕЙ с повторным маршем: физические лимиты
  // ленты при этом не нарушаются никогда.
  const KW=[];
  for(let k=-5;k<=5;k++) KW.push(0.5*(1+Math.cos(Math.PI*k/6)));
  let last={collisions:0, minClear:1e9, near:0, self:0, cross:0};
  let stagBest=1e9, stagCnt=0;
  for(let it=0; it<90; it++){
    const disp = ribbons.map(rb=>rb.guideC.map(()=>null));
    const chords = [];
    let coll=0, minClear=1e9, nearC=0, selfC=0, crossC=0;
    forEachClosePair(ribbons, CLEAR_FAR, (A,B)=>{
      const sa=A.r.st, sb=B.r.st;
      const near = A.ri===B.ri && Math.abs(sa-sb)<=NEAR_WIN;
      const limD = near ? CLEAR_NEAR : CLEAR_FAR;
      const [d,c1,c2] = closestSegSeg(A.r.a,A.r.b,B.r.a,B.r.b);
      if(d<minClear) minClear=d;
      if(d>=limD) return;
      coll++;
      if(window.__collLog) window.__collLog.push([A.ri,B.ri,sa,sb,+d.toFixed(1),
        Math.round(A.r.a[0]),Math.round(A.r.a[1]),Math.round(A.r.a[2]),
        A.r.u1<0?'dn':'up', B.r.u1<0?'dn':'up']);
      if(near) nearC++; else if(A.ri===B.ri) selfC++; else crossC++;
      const giA=Math.min(ribbons[A.ri].guideC.length-1, sa);
      const giB=Math.min(ribbons[B.ri].guideC.length-1, sb);
      if(near){
        chords.push([A.ri, Math.min(giA,giB), Math.max(giA,giB)]);
      } else {
        let nv=V.sub(c1,c2), L=V.len(nv);
        if(L<1e-6){
          nv=V.cross(ribbons[A.ri].dirs[sa], ribbons[B.ri].dirs[sb]); L=V.len(nv);
          if(L<1e-6){ nv=[0,1,0]; L=1; }
        }
        nv=V.mul(nv,1/L);
        const need=(limD-d)*0.5*0.8;
        for(let k=-5;k<=5;k++){
          const w=KW[k+5];
          const ia=giA+k;
          if(ia>=0 && ia<ribbons[A.ri].guideC.length){
            const D=disp[A.ri][ia]||(disp[A.ri][ia]=[0,0,0]);
            D[0]+=nv[0]*need*w; D[1]+=nv[1]*need*w; D[2]+=nv[2]*need*w;
          }
          const ib=giB+k;
          if(ib>=0 && ib<ribbons[B.ri].guideC.length){
            const D=disp[B.ri][ib]||(disp[B.ri][ib]=[0,0,0]);
            D[0]-=nv[0]*need*w; D[1]-=nv[1]*need*w; D[2]-=nv[2]*need*w;
          }
        }
      }
    });
    last={collisions:coll, minClear, near:nearC, self:selfC, cross:crossC};
    if(coll===0) break;
    if(coll>=stagBest){ if(++stagCnt>=18) break; } else { stagBest=coll; stagCnt=0; }
    // «вееры»: распрямляем направляющую и сгоняем градиенты ориентации
    for(const ch of chords){
      const rb=ribbons[ch[0]], i=ch[1], j=ch[2];
      const GC=rb.guideC;
      for(let k=i+1;k<j;k++){
        const t=(k-i)/(j-i);
        for(let x=0;x<3;x++){
          GC[k][x]+=0.4*((GC[i][x]*(1-t)+GC[j][x]*t) - GC[k][x]);
        }
        const arrs = rb.guideUp ? [rb.guideD, rb.guideUp, rb.guideDn] : [rb.guideD];
        for(const A2 of arrs){
          const ai=A2[i], aj=A2[j], ak=A2[k];
          const tg=V.norm([ai[0]*(1-t)+aj[0]*t, ai[1]*(1-t)+aj[1]*t, ai[2]*(1-t)+aj[2]*t]);
          A2[k]=V.norm([ak[0]+(tg[0]-ak[0])*0.5, ak[1]+(tg[1]-ak[1])*0.5, ak[2]+(tg[2]-ak[2])*0.5]);
        }
      }
    }
    // смещения направляющей (шаг ограничен 12 мм) + мягкий клэмп в слой
    ribbons.forEach((rb,ri)=>{
      disp[ri].forEach((D,i)=>{
        if(!D) return;
        const l=V.len(D), sc=l>12 ? 12/l : 1;
        rb.guideC[i][0]+=D[0]*sc; rb.guideC[i][1]+=D[1]*sc; rb.guideC[i][2]+=D[2]*sc;
      });
      const mn=rb.clampMin||[0,0,0], mx=rb.clampMax||[box.w,box.h,box.d];
      const M=ROD_R+4;
      for(let i=0;i<rb.guideC.length;i++){
        const mi=Math.min(rb.centers.length-1, i);
        for(let x=0;x<3;x++){
          const kx = rb.dirUp
            ? Math.max(Math.abs(rb.dirUp[mi][x]), Math.abs(rb.dirDn[mi][x]))
            : Math.abs(rb.dirs[mi][x]);
          const reach=kx*rb.halfW + M;
          if(rb.guideC[i][x]<mn[x]+reach) rb.guideC[i][x]=mn[x]+reach;
          else if(rb.guideC[i][x]>mx[x]-reach) rb.guideC[i][x]=mx[x]-reach;
        }
      }
      // сглаживание направляющей — только локально у коллизий,
      // иначе глобальный Laplacian съедает длину ленты
      const touched=new Set();
      disp[ri].forEach((D,i)=>{
        if(!D) return;
        for(let k=-3;k<=3;k++){
          const t2=i+k;
          if(t2>0 && t2<rb.guideC.length-1) touched.add(t2);
        }
      });
      for(const ch of chords){
        if(ch[0]!==ri) continue;
        for(let k=Math.max(1,ch[1]); k<=Math.min(rb.guideC.length-2,ch[2]); k++) touched.add(k);
      }
      for(const i of touched){
        for(let x=0;x<3;x++){
          rb.guideC[i][x]+=0.12*((rb.guideC[i-1][x]+rb.guideC[i+1][x])/2 - rb.guideC[i][x]);
        }
      }
      marchRibbon(rb);
    });
  }
  return last;
}

function measureClearance(ribbons){
  let minClear=1e9;
  forEachClosePair(ribbons, 40, (A,B)=>{
    const [d] = closestSegSeg(A.r.a,A.r.b,B.r.a,B.r.b);
    if(d<minClear) minClear=d;
  });
  return minClear;
}

/* фактические зазоры между соседними стержнями одного ряда */
function measureGaps(ribbons){
  let gmin=1e9, gmax=-1e9;
  for(const rb of ribbons){
    const rowsArr = new Map();
    for(const r of rb.rods){
      const key = r.u2>0.1 ? "up" : "dn";
      if(!rowsArr.has(key)) rowsArr.set(key, []);
      rowsArr.get(key)[r.st]=r;
    }
    for(const arr of rowsArr.values()){
      for(let i=0;i+1<arr.length;i++){
        const r1=arr[i], r2=arr[i+1];
        if(!r1||!r2) continue;
        for(let t=0;t<=4;t++){
          const u=t/4;
          const dx=(r1.b[0]+(r1.a[0]-r1.b[0])*u)-(r2.b[0]+(r2.a[0]-r2.b[0])*u);
          const dy=(r1.b[1]+(r1.a[1]-r1.b[1])*u)-(r2.b[1]+(r2.a[1]-r2.b[1])*u);
          const dz=(r1.b[2]+(r1.a[2]-r1.b[2])*u)-(r2.b[2]+(r2.a[2]-r2.b[2])*u);
          const g=Math.hypot(dx,dy,dz)-ROD_D;
          if(g<gmin) gmin=g;
          if(g>gmax) gmax=g;
        }
      }
    }
  }
  return {gmin,gmax};
}

/* фактический минимальный радиус изгиба кантов каркаса (проволока) */
function measureRailRadius(ribbons){
  let minR=1e9;
  for(const rb of ribbons){
    const rails = rb.rows===2 ? [rb.railA, rb.railB, rb.centers] : [rb.railA, rb.railB];
    for(const R of rails){
      for(let i=1;i<R.length-1;i++){
        const v1=V.sub(R[i],R[i-1]), v2=V.sub(R[i+1],R[i]);
        const l1=V.len(v1), l2=V.len(v2);
        if(l1<1e-6||l2<1e-6) continue;
        const cosA=Math.min(1,Math.max(-1, V.dot(v1,v2)/(l1*l2)));
        const ang=Math.acos(cosA);
        if(ang>1e-6) minR=Math.min(minR, (l1+l2)/2/ang);
      }
    }
  }
  return minR;
}

/* фактический минимальный радиус изгиба осевой линии */
function measureMinRadius(ribbons){
  let minR=1e9;
  for(const rb of ribbons){
    const C=rb.centers;
    for(let i=1;i<C.length-1;i++){
      const v1=V.sub(C[i],C[i-1]), v2=V.sub(C[i+1],C[i]);
      const l1=V.len(v1)||1, l2=V.len(v2)||1;
      const cosA=Math.min(1,Math.max(-1, V.dot(v1,v2)/(l1*l2)));
      const ang=Math.acos(cosA);
      if(ang>1e-6) minR=Math.min(minR, (l1+l2)/2/ang);
    }
  }
  return minR;
}

/* ВОРОТА КАЧЕСТВА: лента обязана быть УЛОЖЕНА ДО КОНЦА по своей
   направляющей. Марш может сорваться (орбитальная ловушка на вершине
   разворота) и оборваться на середине — получается чистая, вписанная,
   но вырожденная композиция: комок в трети габарита с метражом вдвое
   ниже правила производства. Такое не показываем — лестница ищет дальше.
   Проверка идёт по покрытию направляющей, а не по габариту: у круглых
   форм (кольцо, восьмёрка) незаполненные углы — это сама форма. */
/* ПОКРЫТИЕ ОБЪЁМА: доля клеток сетки 5×3×3 по габариту, через которые прошла
   лента. Габаритного бокса недостаточно — лента может пройти одной прядью по
   диагонали: бокс «заполнен», а объём пустой (замер: 4.73 пог. м в габарите
   2400×900×800, покрытие 0.42 против 0.62 у живого варианта). */
/* «ЛЕСКА» — ДОЗАКРЫТИЕ ВЕЕРОВ ТОРЦОВ. Данные производства: стеклянные
   трубки крепятся к контурам не жёстко, а свободной петлёй лески —
   стержень может скользить вдоль проволоки и доворачиваться. Поэтому
   веер торцов на крутом изгибе (наружные концы соседних стержней
   расходятся шире 2 шагов) можно закрыть, РАЗРАВНИВАЯ ОРИЕНТАЦИИ
   стержней: осевая линия и центральный контур стоят на месте, стержень
   поворачивается вокруг своей точки крепления у центра, канты
   перерисовываются по новым торцам. Правится только окно веера
   (±4 станции), принимается только чистый результат: веер закрылся,
   зазоры и бокс соблюдены — иначе откат */
function closeFans(ribbons, box){
  const lim3=[box.w, box.h, box.d];
  let closed=0;
  for(const rb of ribbons){
    const twoRow=!!rb.dirUp, n=rb.centers.length;
    if(n<6) continue;
    const step=rb.stepEff, gapLim=step*2.2;
    const IN2=WIRE_D/2+ROD_AIR;
    const rows = twoRow ? [rb.rods.filter(r=>r.u2>0), rb.rods.filter(r=>r.u2<=0)]
                        : [rb.rods.slice()];
    for(const row of rows){
      row.sort((q,z)=>q.st-z.st);
      const railOf=(r)=> twoRow ? (r.u2>0? rb.railA : rb.railB) : rb.railA;
      for(let i=1;i<row.length;i++){
        if(row[i].st-row[i-1].st>3) continue;
        const g0=V.len(V.sub(row[i].a, row[i-1].a));
        if(g0<=gapLim) continue;
        const i0w=Math.max(0, i-4), i1w=Math.min(row.length-1, i+3);
        const stSet=new Set();
        for(let k=i0w;k<=i1w;k++) stSet.add(Math.min(n-1, row[k].st));
        // ПОЛНЫЙ снимок окна: все стержни этих станций (оба ряда),
        // центральный контур и оба канта
        const bakR=[], bakC=[], winRods=rb.rods.filter(r=>stSet.has(Math.min(n-1,r.st)));
        for(const r of winRods) bakR.push({r, a:r.a.slice(), b:r.b.slice(), nn:r.n.slice()});
        for(const st of stSet) bakC.push({st, c:rb.centers[st].slice(),
          rA:rb.railA[st]?rb.railA[st].slice():null,
          rB:rb.railB[st]?rb.railB[st].slice():null});
        const winSet=new Set(winRods);
        // ориентации ряда с веером
        const U=[], LEN=[];
        for(let k=i0w;k<=i1w;k++){
          const r=row[k];
          U.push(V.norm(V.sub(r.a, r.b)));
          LEN.push(V.len(V.sub(r.a, r.b)));
        }
        const smoothU=()=>{ for(let it=0; it<12; it++)
          for(let k=1;k<U.length-1;k++)
            U[k]=V.norm([U[k][0]+0.5*(U[k-1][0]+U[k+1][0]-2*U[k][0]),
                         U[k][1]+0.5*(U[k-1][1]+U[k+1][1]-2*U[k][1]),
                         U[k][2]+0.5*(U[k-1][2]+U[k+1][2]-2*U[k][2])]); };
        // пересадка ряда: опора — крепление у центра (у однорядной — середина)
        const applyRow=()=>{
          for(let k=i0w;k<=i1w;k++){
            const r=row[k], u=U[k-i0w], L=LEN[k-i0w];
            const st=Math.min(n-1, r.st), P=rb.centers[st];
            const aOld=r.a.slice(), bOld=r.b.slice();
            if(twoRow){
              r.b=[P[0]+u[0]*IN2, P[1]+u[1]*IN2, P[2]+u[2]*IN2];
              r.a=[P[0]+u[0]*(IN2+L), P[1]+u[1]*(IN2+L), P[2]+u[2]*(IN2+L)];
            } else {
              r.a=[P[0]+u[0]*L/2, P[1]+u[1]*L/2, P[2]+u[2]*L/2];
              r.b=[P[0]-u[0]*L/2, P[1]-u[1]*L/2, P[2]-u[2]*L/2];
            }
            const t0=Math.max(0,st-1), t1=Math.min(n-1,st+1);
            const T=V.norm(V.sub(rb.centers[t1], rb.centers[t0]));
            r.n=V.norm(V.cross(T,u));
            // кант двигается ДЕЛЬТОЙ торца: в зонах сварки кант идёт своей
            // кривой (мост), и абсолютная пересадка рвала его углом до 132°
            const rl=railOf(r);
            if(rl && rl[st]) for(let x=0;x<3;x++) rl[st][x]+=r.a[x]-aOld[x];
            if(!twoRow && rb.railB[st])
              for(let x=0;x<3;x++) rb.railB[st][x]+=r.b[x]-bOld[x];
          }
        };
        // ЭТАП 1: доворот стержней (скольжение на леске), контур на месте
        smoothU();
        applyRow();
        // ЭТАП 2 (идея пользователя): если веер ещё раскрыт — сместить
        // ЦЕНТРАЛЬНЫЙ КОНТУР колоколом в сторону раскрытого края; ноги
        // стержней съезжают за проволокой, ориентации разравниваются
        // заново, второй ряд переезжает вместе с контуром
        if(V.len(V.sub(row[i].a, row[i-1].a)) > step*1.9){
          const dir=[0,0,0];
          for(const u of U){ dir[0]+=u[0]; dir[1]+=u[1]; dir[2]+=u[2]; }
          const uAvg=V.norm(dir);
          const mAmp=Math.min(rb.halfW*0.35, Math.max(14, (g0-step*1.6)*0.8));
          // ШИРОКОЕ ОКНО С НУЛЕВЫМИ КРАЯМИ И ПРЕДЕЛОМ КРУТИЗНЫ (замечание
          // пользователя: острые углы на контуре физически невозможны).
          // Узкий колокол обрывался ступенькой до 20 мм на границе окна —
          // теперь смещение растянуто на ±10 станций за веер, по краям
          // ровно ноль, крутизна не выше 3 мм на станцию
          const stA=Math.min(n-1, row[i0w].st), stB=Math.min(n-1, row[i1w].st);
          const wideLo=Math.max(0, Math.min(stA,stB)-10);
          const wideHi=Math.min(n-1, Math.max(stA,stB)+10);
          const sts=[];
          for(let st=wideLo; st<=wideHi; st++) sts.push(st);
          const m2=sts.length;
          const prof=sts.map((st,si)=>mAmp*Math.sin(Math.PI*si/Math.max(1,m2-1)));
          for(let p2=0;p2<2;p2++){
            for(let si=1;si<m2;si++) prof[si]=Math.min(prof[si], prof[si-1]+3);
            for(let si=m2-2;si>=0;si--) prof[si]=Math.min(prof[si], prof[si+1]+3);
          }
          // расширить снимок и набор стержней на широкое окно
          for(const st of sts){
            if(stSet.has(st)) continue;
            stSet.add(st);
            bakC.push({st, c:rb.centers[st].slice(),
              rA:rb.railA[st]?rb.railA[st].slice():null,
              rB:rb.railB[st]?rb.railB[st].slice():null});
          }
          for(const r of rb.rods){
            const st=Math.min(n-1,r.st);
            if(st>=wideLo && st<=wideHi && !winSet.has(r)){
              winRods.push(r); winSet.add(r);
              bakR.push({r, a:r.a.slice(), b:r.b.slice(), nn:r.n.slice()});
            }
          }
          const fanSet=new Set();
          for(let k=i0w;k<=i1w;k++) fanSet.add(row[k]);
          sts.forEach((st,si)=>{
            const dv=[uAvg[0]*prof[si], uAvg[1]*prof[si], uAvg[2]*prof[si]];
            const P=rb.centers[st];
            P[0]+=dv[0]; P[1]+=dv[1]; P[2]+=dv[2];
            // все стержни станции, кроме пересаживаемого ряда веера,
            // переезжают жёстко вместе с контуром
            for(const r of winRods){
              if(Math.min(n-1,r.st)!==st || fanSet.has(r)) continue;
              for(let x=0;x<3;x++){ r.a[x]+=dv[x]; r.b[x]+=dv[x]; }
              const rl2=railOf(r);
              if(rl2 && rl2[st]) for(let x=0;x<3;x++) rl2[st][x]+=dv[x];
            }
          });
          smoothU();
          applyRow();
        }
        // приёмка: веер закрылся, зазоры и бокс чисты — иначе полный откат
        let ok=V.len(V.sub(row[i].a, row[i-1].a)) < g0-2;
        if(ok){
          outer2:
          for(const r of winRods){
            for(const p2 of [r.a, r.b]) for(let x=0;x<3;x++)
              if(p2[x]<-ROD_R-6 || p2[x]>lim3[x]+ROD_R+6){ ok=false; break outer2; }
            for(const rb2 of ribbons) for(const q of rb2.rods){
              if(q===r || winSet.has(q)) continue;
              if(Math.abs(q.a[0]-r.a[0])>420 && Math.abs(q.b[0]-r.b[0])>420) continue;
              const near=(rb2===rb) && Math.abs(q.st-r.st)<=NEAR_WIN;
              const lim=near? CLEAR_NEAR : CLEAR_FAR;
              if(closestSegSeg(r.a,r.b,q.a,q.b)[0] < lim){ ok=false; break outer2; }
            }
          }
        }
        if(!ok){
          for(const bk of bakR){ bk.r.a=bk.a; bk.r.b=bk.b; bk.r.n=bk.nn; }
          for(const bk of bakC){
            rb.centers[bk.st][0]=bk.c[0]; rb.centers[bk.st][1]=bk.c[1];
            rb.centers[bk.st][2]=bk.c[2];
            if(bk.rA) rb.railA[bk.st]=bk.rA;
            if(bk.rB) rb.railB[bk.st]=bk.rB;
          }
        } else closed++;
      }
    }
  }
  return closed;
}

/* ПРОВИС ЦЕНТРА ДВУХРЯДНОЙ ЛЕНТЫ (физика от пользователя: «центр ленты
   у двухрядной должен провисать под весом»). Средняя проволока держится
   на стержнях свободными петлями лески, и на плоских участках (стержни
   горизонтальны, лента лежит плашмя) провисает ПОПЕРЁК ленты: сечение
   складывается неглубокой галочкой. Центр и внутренние концы стержней
   опускаются на δ·f, где f — горизонтальность стержней станции
   (сглаженная по ленте): на ребре и в крутых «юбках» стержни
   вертикальны и f=0 — там провиса нет. δ ≤ 12 мм (8% полуширины).
   После применения — полный скан зазоров сцены: при нарушении δ
   делится пополам (до двух послаблений), затем полный откат */
function centerSag(ribbons){
  let anyTwo=false;
  for(const rb of ribbons){
    if(!rb.dirUp) continue;
    anyTwo=true;
    const n=rb.centers.length;
    const f=new Array(n).fill(0);
    for(let i=0;i<n;i++){
      const uy=rb.dirUp[i]? Math.abs(rb.dirUp[i][1]) : 1;
      const dy2=rb.dirDn[i]? Math.abs(rb.dirDn[i][1]) : 1;
      f[i]=Math.max(0, 1-Math.max(uy,dy2)/0.5);
    }
    // НЕ ВЕЗДЕ, А МЕСТАМИ (уточнение пользователя): тросы поддерживают
    // боковые канты, поэтому у якорей сечение собрано, а центральная
    // проволока провисает под своим весом и весом стержней сильнее всего
    // в СЕРЕДИНЕ ПРОЛЁТА между тросами — параболой, как и провис вдоль
    if(rb.cabSt && rb.cabSt.length){
      const A2=rb.cabSt, w=new Array(n).fill(0);
      // ГЛУБИНА ПРОВИСА — ОТ ДЛИНЫ ПРОЛЁТА (данные пользователя: «делай
      // провисы и подъёмы до 100-150 мм спокойно, это возможно при
      // скручивании, на практике так и происходит»)
      const ampOf=(spanMm)=>Math.min(145, 20+0.09*spanMm);
      const ramp=(dist)=>Math.min(1, Math.pow(dist*rb.stepEff/500, 2));
      for(let i=0;i<A2[0];i++) w[i]=ramp(A2[0]-i)*60;
      for(let k=1;k<A2.length;k++){
        const s0=A2[k-1], s1=A2[k], amp=ampOf((s1-s0)*rb.stepEff);
        for(let i=s0+1;i<s1;i++){ const u=(i-s0)/(s1-s0); w[i]=4*u*(1-u)*amp; }
      }
      const aL=A2[A2.length-1];
      for(let i=aL+1;i<n;i++) w[i]=ramp(i-aL)*60;
      for(let i=0;i<n;i++) f[i]*=w[i];
    } else {
      for(let i=0;i<n;i++) f[i]*=40;
    }
    for(let it=0; it<10; it++)
      for(let i=1;i<n-1;i++) f[i]=(f[i-1]+2*f[i]+f[i+1])/4;
    // ОСТРЫХ УГЛОВ НА КОНТУРЕ НЕ БЫВАЕТ (замечание пользователя: «это
    // физически невозможно»). У перекатов горизонтальность стержней
    // гаснет за пару станций, и профиль провиса обрывался ступенькой.
    // Крутизна профиля ограничена 2.5 мм на станцию проходами вперёд и
    // назад — контур опускается и поднимается только плавно
    for(let p2=0;p2<2;p2++){
      for(let i=1;i<n;i++) f[i]=Math.min(f[i], f[i-1]+3.5);
      for(let i=n-2;i>=0;i--) f[i]=Math.min(f[i], f[i+1]+3.5);
    }
    rb.__csag=f;
  }
  if(!anyTwo) return 0;
  const bak=ribbons.map(rb=>({c:rb.centers.map(p=>p[1]),
                              b:rb.rods.map(r=>r.b[1])}));
  const restore=()=>{ ribbons.forEach((rb,ri)=>{
    rb.centers.forEach((p,i)=>{ p[1]=bak[ri].c[i]; });
    rb.rods.forEach((r,i)=>{ r.b[1]=bak[ri].b[i]; });
  }); };
