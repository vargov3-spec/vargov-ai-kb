        ? Object.assign({}, params, {
            twistAmt:0, foldK: 0, lanes:1, fillRelax: 0,
            ampl: 0.3*Math.pow(0.85,k4),
            // плотность спирали снижаем шаг за шагом: это единственный
            // надёжный способ развести витки «на ребро»
            densK: Math.max(0.18, 0.7*Math.pow(0.80,k4)),
            lengthK: Math.max(0.5, 1-0.06*k4)})
        : Object.assign({}, params, {
            // складку здесь не просим совсем, иначе теряется сама гарантия
            style:"wave", twistAmt:0, foldK: 0,
            ampl: 0.22*Math.pow(0.75,k4), lengthK: 0.3, lanes:1,
            fillRelax: 0});
      const rbF = buildRibbon(pF, (state.seed + 770001 + k4*911)>>>0, 0);
      rbF.clampMin=[0,0,0]; rbF.clampMax=[box.w,box.h,box.d];
      if(!rbF.fillMode) marchRibbon(rbF);
      if(!rbF.fitScale){ (window.__lastR=window.__lastR||[]).push([k4,'nofit']); continue; }
      const clF = resolveCollisions([rbF], box);
      const bF = geoBBox(rbF);
      const lim5=[box.w,box.h,box.d];
      let fitsF=true, fillF=1;
      for(let k5=0;k5<3;k5++){
        const e5=bF.max[k5]-bF.min[k5]+ROD_D;
        if(e5>lim5[k5]+2) fitsF=false;
        fillF=Math.min(fillF, e5/lim5[k5]);
      }
      (window.__lastR=window.__lastR||[]).push([k4, clF.collisions, fitsF?1:0,
                                                 +fillF.toFixed(2)]);
      if(clF.collisions===0 && fitsF){
        clF.attempt=98; clF.lanes=1;
        // и последний рубеж выбирается по заполнению габарита
        if(!bestLast || fillF>bestLast.fill) bestLast={rb:rbF, cl:clF, fill:fillF};
        if(fillF>=0.93) break;
      }
    }
    if(bestLast){ ribbons=[bestLast.rb]; clear=bestLast.cl; }
  }
  // жёсткий перенос сцены в бокс: перенос не меняет форму, зазоры
  // и радиусы — только позицию
  {
    const mM=[1e9,1e9,1e9], xM=[-1e9,-1e9,-1e9];
    for(const rb of ribbons){
      const b=geoBBox(rb);
      for(let k=0;k<3;k++){ mM[k]=Math.min(mM[k],b.min[k]); xM[k]=Math.max(xM[k],b.max[k]); }
    }
    const lim=[box.w,box.h,box.d];
    const sh=[0,0,0];
    for(let k=0;k<3;k++){
      const ext=xM[k]-mM[k]+ROD_D;
      if(ext < lim[k]-60){
        // композиция заметно меньше габарита (сработала страховка или
        // короткий вариант) — ставим её по ЦЕНТРУ, а не прижимаем к краю
        sh[k]=(lim[k]-(mM[k]+xM[k]))/2;
      } else if(mM[k]-ROD_R<0) sh[k]=ROD_R-mM[k];
      else if(xM[k]+ROD_R>lim[k]) sh[k]=lim[k]-xM[k]-ROD_R;
    }
    if(sh[0]||sh[1]||sh[2]){
      for(const rb of ribbons){
        for(const c of rb.centers){ c[0]+=sh[0]; c[1]+=sh[1]; c[2]+=sh[2]; }
        for(const c of rb.guideC){ c[0]+=sh[0]; c[1]+=sh[1]; c[2]+=sh[2]; }
        for(const r of rb.rods){ for(let x=0;x<3;x++){ r.a[x]+=sh[x]; r.b[x]+=sh[x]; } }
        for(const p2 of rb.railA){ p2[0]+=sh[0]; p2[1]+=sh[1]; p2[2]+=sh[2]; }
        for(const p2 of rb.railB){ p2[0]+=sh[0]; p2[1]+=sh[1]; p2[2]+=sh[2]; }
      }
    }
  }
  // LED-точки и тросы
  const scene0Plast=params.plast||"mix";
  // «леска»: дозакрытие вееров торцов доворотом стержней (только «микс»:
  // на ребре стержни вертикальны и веером не расходятся). Поперечный
  // провис центра — ниже, после расстановки тросов (ему нужны якоря)
  if(scene0Plast!=="edge") closeFans(ribbons, box);
  // высота до потолка: на столько потолок выше верха габарита
  const ceilH=Math.max(0, Math.min(10000, +ui.dimC.value||0));
  ribbons.forEach((rb, ri)=>{
    // диоды — белые точки Ø4 на одном контуре каркаса:
    // у двурядной — центральный контур; шаг хаотичный, в среднем 100 мм
    rb.leds = [];
    if(ui.leds.checked){
      // ДИОДЫ: светящиеся белые шарики Ø4 мм НА ПРОВОЛОКЕ КАРКАСА — у
      // двурядной ленты на центральном контуре, у однорядной на одном из
      // двух. Шаг ровно 100 мм каркаса (данные производства: 0.1 W / 3 V)
      const wirePts = rb.rows===2 ? rb.centers : rb.railA;
      let acc = 0;
      rb.ledSt=[];                       // станции диодов — для анимации сборки
      for(let i=1;i<wirePts.length;i++){
        acc += rb.stepEff;
        if(acc>=LED_PITCH){ rb.leds.push(wirePts[i]); rb.ledSt.push(i); acc=0; }
      }
    }
    // ПОДВЕСЫ: расставляются по физике, а не «через равные промежутки».
    // Три правила: (1) пролёт между подвесами не больше допустимого для
    // проволоки Ø5 с грузом стержней; (2) каждый изгиб фиксируется —
    // на крутых участках подвес обязателен, иначе лента распрямится;
    // (3) точка крепления сдвигается на локальную вершину контура, чтобы
    // трос шёл вертикально и работал на растяжение, а не тянул форму вбок.
    rb.cabs = [];
    if(ui.cables.checked){
      const C=rb.centers, n=C.length;
      // радиус кривизны осевой по станциям
      const R=new Array(n).fill(1e9);
      for(let i=1;i<n-1;i++){
        const v1=V.sub(C[i],C[i-1]), v2=V.sub(C[i+1],C[i]);
        const l1=V.len(v1)||1, l2=V.len(v2)||1;
        const a2=Math.acos(Math.max(-1,Math.min(1,V.dot(v1,v2)/(l1*l2))));
        if(a2>1e-6) R[i]=(l1+l2)/2/a2;
      }
      const topAt=(i)=> rb.railA[i][1]>rb.railB[i][1] ? rb.railA[i] : rb.railB[i];
      // локальная вершина контура в окне ±9 станций (~150 мм)
      const peak=(i)=>{
        let bi=i, by=topAt(i)[1];
        for(let k=Math.max(0,i-9); k<=Math.min(n-1,i+9); k++){
          const y=topAt(k)[1];
          if(y>by){ by=y; bi=k; }
        }
        return bi;
      };
      const picked=[];
      // ПОДВЕСЫ У «НА РЕБРО» — КАЖДЫЕ 1000 ММ И НА КОНЦАХ ЛЕНТЫ (правило
      // пользователя). Лента на ребре стоит на трёх контурах, поставленных
      // вертикально: такой каркас держит форму сам, поэтому пролёт большой,
      // а добавочные подвесы на крутых изгибах не ставятся — на ребре изгиб
      // идёт вокруг стержней и не распрямляется
      const onEdge=(scene0Plast==="edge");
      const MAXSPAN=onEdge ? 1000 : CABLE_STEP;  // предельный пролёт, мм
      let lastS=-1e9;
      for(let i=0;i<n;i++){
        const sArc=i*rb.stepEff;
        // изгиб круче ~R400 нужно держать: без подвеса он распрямляется
        const sharp = R[i]<400;
        const need = (sArc-lastS>=MAXSPAN)
                     || (!onEdge && sharp && sArc-lastS>=MAXSPAN*0.45);
        if(!need) continue;
        const j=peak(i);
        const jj=picked.length && Math.abs(j-picked[picked.length-1])*rb.stepEff<120
                 ? -1 : j;
        if(jj<0) continue;
        picked.push(jj);
        lastS=jj*rb.stepEff;
      }
      // концы ленты держим обязательно — иначе свободный конец падает;
      // у «на ребро» трос на конце ставится ВСЕГДА (правило пользователя)
      if(n>4){
        const thr=onEdge ? 120 : MAXSPAN*0.6;
        if(!picked.length || picked[0]*rb.stepEff>thr) picked.unshift(peak(2));
        const lastIdx=picked[picked.length-1]||0;
        if((n-1-lastIdx)*rb.stepEff>thr) picked.push(peak(n-3));
      }
      for(const i of picked){
        const top=topAt(i);
        // ВЫСОТА ДО ПОТОЛКА: трос идёт от точки крепления на ленте до
        // потолка, который стоит выше габарита на заданную величину
        rb.cabs.push({from:[top[0], box.h+ceilH, top[2]], to:top, st:i});
      }
      rb.cabSt=picked.slice().sort((q,z)=>q-z);
      // фактический максимальный пролёт — в спецификацию
      let span=0;
      for(let k=1;k<picked.length;k++) span=Math.max(span,(picked[k]-picked[k-1])*rb.stepEff);
      rb.cabSpan=Math.round(span);
      // НАГРУЗКА НА КАЖДЫЙ ТРОС: масса стекла и каркаса раздаётся по
      // станциям, станция тянет ближайший якорь (границы зон — середины
      // пролётов). Идёт в «Расчёт» (максимум на трос) и в монтажную карту
      // (по каждому тросу) — язык проектировщика, а не только картинка
      if(picked.length){
        const secA=Math.PI*(ROD_R*ROD_R-(ROD_R-GLASS_WALL)*(ROD_R-GLASS_WALL));
        const mSt=new Array(n).fill(rb.stepEff*(rb.rows===2?3:2)*WIRE_AREA*STEEL_DENSITY);
        for(const r of rb.rods)
          mSt[Math.max(0,Math.min(n-1,r.st))]+=secA*(r.nom||r.len)*GLASS_DENSITY;
        const A3=rb.cabSt, loads=new Array(A3.length).fill(0);
        for(let i=0;i<n;i++){
          let bk=0, bd=1e9;
          for(let k=0;k<A3.length;k++){ const dd=Math.abs(A3[k]-i); if(dd<bd){bd=dd; bk=k;} }
          loads[bk]+=mSt[i];
        }
        for(const c of rb.cabs){ const k=A3.indexOf(c.st); c.load=(k>=0?loads[k]:0)/1000; }
      }
    }
  });
  // ПРОВИС ПОД ВЕСОМ (гравитационный реализм). Марш строит идеальную
  // геометрию; настоящая лента слегка провисает между тросами — стрела
  // растёт с квадратом пролёта (катенарная), свободные концы провисают
  // консольно. Провис применяется К ГОТОВОЙ геометрии после разводки и
  // подвесов: якорные станции стоят на месте, сдвиг плавный, стрела
  // ограничена 14 мм — на зазоры влияет меньше допуска ближнего лимита
  // ПРОВИС ПОД ВЕСОМ — всегда: идеально ровная лента между подвесами
  // выглядит рендером, а не вещью (галочка убрана по решению пользователя)
  if(ui.cables.checked){
    for(const rb of ribbons){
      const A2=rb.cabSt;
      if(!A2 || !A2.length) continue;
      const n=rb.centers.length;
      const sagOf=(span)=>Math.min(14, 8*Math.pow(span/1000, 2));
      const dy=new Array(n).fill(0);
      // консоль до первого якоря
      for(let i=0;i<A2[0];i++)
        dy[i]=Math.min(10, 6*Math.pow((A2[0]-i)*rb.stepEff/800, 2));
      // пролёты между якорями
      for(let k=1;k<A2.length;k++){
        const s0=A2[k-1], s1=A2[k], span=(s1-s0)*rb.stepEff;
        const sg=sagOf(span);
        for(let i=s0+1;i<s1;i++){
          const u=(i-s0)/(s1-s0);
          dy[i]=sg*4*u*(1-u);
        }
      }
      // консоль после последнего якоря
      const aL=A2[A2.length-1];
      for(let i=aL+1;i<n;i++)
        dy[i]=Math.min(10, 6*Math.pow((i-aL)*rb.stepEff/800, 2));
      const drop=(P,i)=>{ if(P && P[i]) P[i][1]-=dy[i]; };
      for(let i=0;i<n;i++){
        drop(rb.centers,i); drop(rb.railA,i); drop(rb.railB,i);
        if(rb.guideC && rb.guideC[i]) rb.guideC[i][1]-=dy[i];
      }
      for(const r of rb.rods){
        const d2=dy[Math.min(n-1, r.st)];
        r.a[1]-=d2; r.b[1]-=d2;
      }
    }
  }
  // поперечный провис центральной проволоки — после тросов и продольного
  // провиса: модуляция по пролётам требует якорей rb.cabSt; затем
  // сглаживание углов кантов (сварки и правки не имеют права оставлять
  // на проволоке угол круче 32°)
  if(scene0Plast!=="edge"){ centerSag(ribbons); smoothRails(ribbons, box); }
  // раздвижка гребёнки — после всех провисов и сглаживаний: пропуски у
  // швов разбираются скольжением станций вдоль ленты (для любой пластики)
  spreadGaps(ribbons, box);
  // ПУНКТИР ФОРМЫ ГАБАРИТА рисуем по выбору пользователя, а не по
  // построенной ленте: даже если композиция ушла на страховочный проход,
  // выбранная форма должна быть видна
  let env=null;
  {
    const fo=formOf([Math.max(200,box.w-40), Math.max(200,box.h-40), Math.max(200,box.d-40)],
                    params.ribbonW, params.form);
    // ПУНКТИР ФОРМЫ ПОКАЗЫВАЕМ ТОЛЬКО ДЛЯ «НА РЕБРО». В «миксе» форма одна
    // («Шар») и служит только генератору: она задаёт силуэт потока, но
    // рисовать её контур не нужно — виден только габаритный бокс
    // ПУНКТИР ФОРМЫ НЕ РИСУЕТСЯ: форма нужна генератору, а на экране она
    // только мешала — виден габаритный бокс и сама композиция
    env=null; void fo;
  }
  // кэш раскладки градиента мог быть насчитан по старой сцене (нарезка
  // собирает отсеки рекурсивно и подменяет scene) — сбрасываем всегда:
  // замер 4400: у ленты 2 кэш расходился со свежей маской в 650 из 970
  for(const rb of ribbons) rb.__gradMask=null;
  scene = {box, ribbons, params, clear, env};
  // пересборка показывается целиком: слайдер сборки возвращается на 100%
  state.asm=1;
  if(ui.asm) ui.asm.value=100;
  state.boxPreview=null;
  // автоматика нарезки объясняет себя: плашка при появлении отрезков
  if(ribbons.length>1 && state.lastRibN!==ribbons.length && typeof toast==="function")
    toast("Лента длиннее ~5 пог. м — разбита на "+ribbons.length
          +" отрезка с невидимым стыком (правило производства)");
  state.lastRibN=ribbons.length;
  // ВЫРОЖДЕННЫЕ ВАРИАНТЫ НЕ ПОКАЗЫВАЮТСЯ. Иногда лестница и страховка
  // выходят с короткой лентой, висящей в углу габарита (замер: 3.14 пог. м
  // при заполнении около 40% на однорядной 2400×900×800). Такой вариант
  // чистый, но показывать его нельзя: пересобираем с другим зерном.
  // Пересборка разрешена дважды — разведение теперь быстрое, время есть
  {
    const mm=[1e9,1e9,1e9], xx=[-1e9,-1e9,-1e9];
    for(const rb of ribbons){
      const bb=geoBBox(rb);
      for(let k=0;k<3;k++){ mm[k]=Math.min(mm[k],bb.min[k]); xx[k]=Math.max(xx[k],bb.max[k]); }
    }
    const lim=[box.w,box.h,box.d];
    const fillMin=Math.min(...[0,1,2].map(k=>(xx[k]-mm[k]+ROD_D)/lim[k]));
    // ПОКРЫТИЕ ОБЪЁМА. Габаритного бокса недостаточно: лента может пройти
    // одной прядью по диагонали — бокс «заполнен», а объём пустой (замер:
    // 4.73 пог. м в габарите 2400×900×800, покрытие 0.33). Габарит делится
    // на сетку 5×3×3, и считается доля клеток, через которые лента прошла
    const NGX=5, NGY=3, NGZ=3, cellN=NGX*NGY*NGZ;
    const cellHit=new Uint8Array(cellN);
    for(const rb of ribbons) for(const p of rb.centers){
      const ix=Math.max(0,Math.min(NGX-1,Math.floor(p[0]/Math.max(1,box.w)*NGX)));
      const iy=Math.max(0,Math.min(NGY-1,Math.floor(p[1]/Math.max(1,box.h)*NGY)));
      const iz=Math.max(0,Math.min(NGZ-1,Math.floor(p[2]/Math.max(1,box.d)*NGZ)));
      cellHit[(ix*NGY+iy)*NGZ+iz]=1;
    }
    let hit=0; for(let i=0;i<cellN;i++) hit+=cellHit[i];
    const cov=hit/cellN;
    clear.cov=+cov.toFixed(3);
    clear.fillMin=+fillMin.toFixed(3);
    // ШПИЛЬКИ КАНТОВ. Послабленный проход сварки (залом без лимита —
    // последний шанс соединить концы) может оставить на канте петлю
    // радиуса 15-30 мм: проволока так не гнётся, торцы стержней вылетают
    // из контура (скрин пользователя, №42424242: кант A R18 при повороте
    // 276°). Такой вариант чист по зазорам, но показывать его нельзя —
    // меряем минимальный оконный радиус дуги всех контуров на ГОТОВОЙ
    // геометрии (после провисов и сглаживаний) и бракуем вместе с
    // вырожденными
    let railMin=1e9;
    for(const rb of ribbons){
      const rails=[rb.railA, rb.railB];
      if(rb.dirUp) rails.push(rb.centers);
      for(const P of rails){
        if(!P || P.length<8) continue;
        for(let i=3;i+3<P.length;i++){
          let ang=0, arc=0;
          for(let j=i-2;j<=i+2;j++){
            const v1=V.sub(P[j],P[j-1]), v2=V.sub(P[j+1],P[j]);
            const l1=V.len(v1)||1, l2=V.len(v2)||1;
            ang+=Math.acos(Math.max(-1,Math.min(1,V.dot(v1,v2)/(l1*l2))));
          }
          if(ang<=0.6) continue;
          for(let j=i-2;j<=i+3;j++) arc+=V.len(V.sub(P[j],P[j-1]));
          railMin=Math.min(railMin, arc/ang);
        }
      }
    }
    clear.railMin=railMin>1e8? null : Math.round(railMin);
    // ПОКРЫТИЕ ЗДЕСЬ ТОЛЬКО ПОКАЗЫВАЕТСЯ, А ОТБРАКОВЫВАЕТСЯ В ВОРОТАХ
    // ЛЕСТНИЦЫ. Пересборка с другим зерном повторяет всю лестницу со
    // страховкой, и порог покрытия здесь давал 40-секундные сборки —
    // достаточно того, что лестница сама ищет вариант с покрытием выше порога
    const tries=state.reTry||0;
    if(!params.concept && (fillMin<0.80 || railMin<28) && tries<2){
      state.reTry=tries+1;
      state.autoSeed=false;
      state.seed=(state.seed*1664525+1013904223)>>>0;
      buildScene();
      state.reTry=0;
      return;
    }
    state.reTry=0;
  }
  updateSpec();
  camera.fitTo(box);
  needRedraw = true;
}

/* ============================================================
   Камера и проекция
   ============================================================ */
const camera = {
  // стартовый ракурс: композиция сразу в кадре, вид чуть сверху и сбоку
  yaw:-0.22, pitch:-0.15, dist:3400, target:[0,0,0], fov:40,
  home:{yaw:-0.22, pitch:-0.15},
  fitTo(box){
    // КАДР ВСЕГДА ПО ЦЕНТРУ КОМПОЗИЦИИ. Высота до потолка на кадрирование не
    // влияет: тросы могут уходить за верх кадра, но сама композиция стоит в
    // центре и в том же масштабе — иначе при большом подвесе она уезжала
    // вниз и мельчала
    this.target = [box.w/2, box.h/2, box.d/2];
    const diag = Math.hypot(box.w, box.h, box.d);
    this.dist = diag*1.20 + 300;
  },
  basis(){
    const cy=Math.cos(this.yaw), sy=Math.sin(this.yaw);
    const cp=Math.cos(this.pitch), sp=Math.sin(this.pitch);
    const fwd = [cp*cy, sp, cp*sy];
    const right = V.norm(V.cross(fwd,[0,1,0]));
    const up = V.cross(right,fwd);
    const eye = V.sub(this.target, V.mul(fwd,this.dist));
    return {eye,fwd,right,up};
  }
};

let cw=0, chgt=0, dpr=1;
function project(p, B, out){
  const d = V.sub(p, B.eye);
  const z = V.dot(d, B.fwd);
  if(z<10) return false;
  const f = (chgt/2)/Math.tan(camera.fov*Math.PI/360);
  out[0] = cw/2 + V.dot(d,B.right)*f/z;
  out[1] = chgt/2 - V.dot(d,B.up)*f/z;
  out[2] = z;
  out[3] = f/z; // масштаб мм→px на этой глубине
  return true;
}

/* ============================================================
   Отрисовка
   ============================================================ */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let needRedraw = true;

function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function shadeCss(rgb, k, a){
  return `rgba(${Math.min(255,rgb[0]*k)|0},${Math.min(255,rgb[1]*k)|0},${Math.min(255,rgb[2]*k)|0},${a})`;
}

const LIGHT = V.norm([0.35, 0.85, 0.40]);

/* РАСКЛАДКА ДВУХ ЦВЕТОВ ПО ТРУБКАМ (растяжка количеством). Каждой трубке —
   0 (основной цвет) или 1 (второй цвет). Доля второго цвета равна положению
   трубки по ходу ленты (0 в начале, 1 в конце), распределение — диффузией
   ошибки: детерминированное, без случайности, поэтому воспроизводится и в
   монтажной карте. Итог по всей ленте — примерно 50/50 */
function gradMask(rb){
  const n=rb.rods.length, nSt=Math.max(1, rb.centers.length-1);
  const mask=new Uint8Array(n);
  // ТРИ ЦВЕТА РАВНЫМИ ДОЛЯМИ (примерно по трети партии): выбранный (0),
  // СРЕДНИЙ между ними (1) и второй (2). Профиль — перекрывающиеся рампы:
  // первая треть хода — чистый цвет 1, дальше ПОЛОСА ПЕРЕМЕШИВАНИЯ шириной
  // 24% хода (цвет 1 плавно уступает среднему), треть среднего, снова
  // полоса, последняя треть — цвет 2. Жёсткого стыка нет: в полосах цвета
  // перемешиваются ПЛОТНОСТЬЮ, и в каждой точке соседствуют только близкие
  // цвета. Перемешивание — последовательностью золотого сечения
  // h(i)=frac(0.5+i·φ): апериодична, доля цвета в любом окне равна
  // профилю с точностью до 1-2 трубок. Раскладка детерминирована — та же
  // уходит в монтажную карту
  // ТРИ ЦВЕТА РОВНО ПОРОВНУ: центры полос перемешивания на 1/3 и 2/3
  // хода — каждый цвет получает треть партии (замер: 379/380/379)
  const PHI=0.6180339887498949, W=0.24, XC=1/3;
  const a0=XC-W/2, a1=XC+W/2, b0=(1-XC)-W/2, b1=(1-XC)+W/2;
  // МНОГООТРЕЗОЧНАЯ КОМПОЗИЦИЯ: растяжка идёт ОТ КРАЯ ДО КРАЯ ВСЕЙ
  // композиции, а не каждого отрезка (замечание пользователя: два отрезка
  // давали «красный-жёлтый-красный-жёлтый»). Доля цвета — по положению
  // трубки вдоль доминирующей оси габарита, шкала общая для всех
  // отрезков: цвет на стыке сходится сам собой
  let posT=null;
  if(scene && scene.ribbons && scene.ribbons.length>1
     && scene.ribbons.indexOf(rb)>=0){
    const ax=(scene.box.w>=scene.box.d)?0:2;
    let mn=1e9, mx=-1e9;
    for(const rb2 of scene.ribbons) for(const r2 of rb2.rods){
      const v=(r2.a[ax]+r2.b[ax])/2;
      if(v<mn) mn=v; if(v>mx) mx=v;
    }
    const span=Math.max(1, mx-mn);
    posT=(r2)=>((r2.a[ax]+r2.b[ax])/2-mn)/span;
  }
  let h=0.5;
  for(let i=0;i<n;i++){
    const tt=posT? posT(rb.rods[i]) : (rb.rods[i].st||0)/nSt;
    h+=PHI; if(h>=1) h-=1;
    const p1=(tt<=a0)?1:(tt>=a1)?0:(a1-tt)/W;
    const p3=(tt<=b0)?0:(tt>=b1)?1:(tt-b0)/W;
    mask[i]=(h<p1)?0:(h<p1+(1-p1-p3))?1:2;
  }
  return mask;
}
// средний цвет двух выбранных (в RGB) — им красится середина растяжки
function gradMid(c1, c2){
  return [0,1,2].map(k=>Math.round((c1[k]+c2[k])/2));
}
function rgbHexStr(c){
  return "#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v)))
                     .toString(16).padStart(2,"0")).join("").toUpperCase();
}

function draw(){
  const B = camera.basis();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // СВЕТЛЫЙ ШОУРУМ: белая галерея вместо тёмного зала — композиции
  // продаются и в светлые интерьеры; переключается галочкой, влияет
  // только на подачу (в номер варианта и ссылки не входит)
  const LB = !!state.lightBg;
  // фон-виньетка
  const g = ctx.createRadialGradient(cw/2,chgt*0.42,chgt*0.1, cw/2,chgt/2,chgt*0.95);
  if(LB){ g.addColorStop(0,"#f7f7f8"); g.addColorStop(1,"#dfdfe4"); }
  else  { g.addColorStop(0,"#17171c"); g.addColorStop(1,"#0a0a0c"); }
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,chgt);
  if(!scene) return;

  const glass = hexRgb(state.color.c);
  // ГРАДИЕНТ ЦВЕТА — РАСТЯЖКА КОЛИЧЕСТВОМ ТРУБОК. Трубка красится ЦЕЛИКОМ
  // в один из ДВУХ цветов (промежуточных оттенков в производстве нет):
  // партия делится ~50/50, а переход достигается перемешиванием — в начале
  // ленты все трубки цвета 1, к концу все цвета 2, между ними доля второго
  // цвета растёт с ходом ленты. Раскладка детерминированная (диффузия
  // ошибки), та же самая попадает в монтажную карту
  const gradB = (ui.gradOn && ui.gradOn.checked) ? hexRgb(ralOf(ui.gradC.value).c) : null;
  // средний цвет прищёлкивается к БЛИЖАЙШЕМУ ЦВЕТУ КАТАЛОГА: красить можно
  // только цветами RAL, произвольный усреднённый оттенок производству недоступен
  const gradM = gradB ? hexRgb(nearestRal(gradMid(glass, gradB)).c) : null;
  const isClear = state.color.id==="clear";
  const prims = [];
  const p1=[0,0,0,0], p2=[0,0,0,0];

  // габаритный бокс (при наборе размеров — сразу из полей, до пересборки)
  const boxV = state.boxPreview || scene.box;
  if(ui.showBox.checked){
    const {w,h,d} = boxV;
    const cor = [[0,0,0],[w,0,0],[w,0,d],[0,0,d],[0,h,0],[w,h,0],[w,h,d],[0,h,d]];
    const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    const hasEnv=!!scene.env;
    // при выбранной форме габарита бокс остаётся еле заметным (габарит
    // виден), а сама форма рисуется тем же пунктиром
    ctx.strokeStyle = LB ? (hasEnv ? "rgba(90,90,110,.18)" : "rgba(90,90,110,.45)")
                       : (hasEnv ? "rgba(120,120,140,.13)" : "rgba(120,120,140,.35)");
    ctx.lineWidth=1; ctx.setLineDash([5,6]);
    for(const [a,b] of edges){
      if(project(cor[a],B,p1) && project(cor[b],B,p2)){
        ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
      }
    }
    if(hasEnv){
      // ФОРМА ГАБАРИТА — ПУНКТИРНЫЙ ОЧЕРК (силуэт + верхнее и нижнее
      // сечения). Форма задана профилем радиуса вдоль своей оси, поэтому
      // силуэт строится по высоте: для эллиптического сечения берётся точка
      // касания эллипса к направлению взгляда, для прямоугольного — углы.
      // Сетка параллелей и меридианов только зашумляет кадр
      ctx.strokeStyle=LB ? "rgba(110,105,130,.55)" : "rgba(150,145,170,.45)";
      const E=scene.env, eax=E.ax, e1i=(eax+1)%3, e2i=(eax+2)%3;
      const ec=E.c, eRax=E.Rax, ea0=E.R[e1i], eb0=E.R[e2i];
      const kOf=(h)=>Math.max(0.07, E.prof(h));
      const pAt=(h,d1,d2)=>{
        const q=[0,0,0];
        q[eax]=ec[eax]+(h-0.5)*2*eRax; q[e1i]=ec[e1i]+d1; q[e2i]=ec[e2i]+d2;
        return q;
      };
      const poly=(arr)=>{
        for(let j2=0;j2+1<arr.length;j2++){
          if(project(arr[j2],B,p1) && project(arr[j2+1],B,p2)){
            ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
          }
        }
      };
      const ringAt=(h)=>{
        const k=kOf(h), a=ea0*k, b=eb0*k, out=[];
        if(E.rect){
          out.push(pAt(h,a,b), pAt(h,a,-b), pAt(h,-a,-b), pAt(h,-a,b), pAt(h,a,b));
        } else {
          const N2=48;
          for(let j2=0;j2<=N2;j2++){
            const t2=Math.PI*2*j2/N2;
            out.push(pAt(h, a*Math.cos(t2), b*Math.sin(t2)));
          }
        }
        return out;
      };
      // ОЧЕРК ФОРМЫ — выпуклая оболочка проекции её сечений. Так очерк
      // верен при любом ракурсе: когда ось формы смотрит в камеру, силуэт
      // даёт «экватор», когда поперёк — профиль. Отдельные силуэтные кривые
      // в первом случае схлопывались, и «шар» в кубе выглядел двумя точками
      {
        const pts2=[];
        for(let jh=0; jh<=24; jh++){
          for(const q of ringAt(jh/24)){
            if(project(q,B,p1)) pts2.push([p1[0],p1[1]]);
          }
        }
        if(pts2.length>2){
          pts2.sort((a2,b2)=>a2[0]-b2[0]||a2[1]-b2[1]);
          const cr=(o,a2,b2)=>(a2[0]-o[0])*(b2[1]-o[1])-(a2[1]-o[1])*(b2[0]-o[0]);
          const lo=[], up=[];
          for(const q of pts2){
            while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop();
            lo.push(q);
          }
          for(let k4=pts2.length-1;k4>=0;k4--){
            const q=pts2[k4];
            while(up.length>=2 && cr(up[up.length-2],up[up.length-1],q)<=0) up.pop();
            up.push(q);
          }
          const hull=lo.concat(up.slice(1));
          ctx.beginPath();
          ctx.moveTo(hull[0][0], hull[0][1]);
          for(let k4=1;k4<hull.length;k4++) ctx.lineTo(hull[k4][0], hull[k4][1]);
          ctx.closePath(); ctx.stroke();
        }
      }
      // верхнее и нижнее сечения — форма читается в объёме
      poly(ringAt(0)); poly(ringAt(1));
    }
    ctx.setLineDash([]);
    // подписи размеров
    ctx.fillStyle=LB ? "rgba(90,80,50,.85)" : "rgba(200,190,160,.8)"; ctx.font="12px system-ui";
    const lbl = (a,b,txt)=>{
      const m=[(cor[a][0]+cor[b][0])/2,(cor[a][1]+cor[b][1])/2,(cor[a][2]+cor[b][2])/2];
      if(project(m,B,p1)) ctx.fillText(txt, p1[0]+6, p1[1]-4);
    };
    lbl(0,1, `${boxV.w} мм`);
    lbl(1,2, `${boxV.d} мм`);
    lbl(1,5, `${boxV.h} мм`);
  }

  { // ПОТОЛОК: пунктирный контур на высоте подвеса — видно, куда идут тросы
    const cH=Math.max(0, +ui.dimC.value||0);
    if(cH>0 && ui.cables.checked){
      const {w,d}=boxV, y=boxV.h+cH;
      const K=[[0,y,0],[w,y,0],[w,y,d],[0,y,d]];
      ctx.strokeStyle=LB ? "rgba(100,100,115,.40)" : "rgba(150,150,165,.30)"; ctx.lineWidth=1; ctx.setLineDash([6,7]);
      ctx.beginPath();
      let ok=true;
      for(let i=0;i<4;i++){
        const a=[0,0,0], b2=[0,0,0];
        if(!project(K[i],B,a) || !project(K[(i+1)%4],B,b2)){ ok=false; break; }
        ctx.moveTo(a[0],a[1]); ctx.lineTo(b2[0],b2[1]);
      }
      if(ok) ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  // АНИМАЦИЯ СБОРКИ: композиция строится станция за станцией, как на
  // объекте — лента растёт от начала к концу, ленты монтируются по очереди.
  // Слайдер «Сборка» задаёт долю построенного; на 100% фильтра нет
  const asmT=(state.asm===undefined)?1:state.asm;
  let asmPos=asmT*scene.ribbons.reduce((q,rb)=>q+rb.centers.length,0);
  for(const rb of scene.ribbons){
    const lim=(asmT>=1)?Infinity:Math.max(0, Math.round(asmPos));
    asmPos-=rb.centers.length;
    // тросы (появляются, когда построена станция их якоря)
    for(const c of rb.cabs){
      if(c.st!==undefined && c.st>=lim) continue;
      if(project(c.from,B,p1) && project(c.to,B,p2)){
        prims.push({z:(p1[2]+p2[2])/2+200, kind:0,
          x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1]});
      }
    }
    // стержни (альфа своя у каждого конца растяжки: прозрачный ↔
    // непрозрачный интерполируются той же раскладкой, что и цвет)
    // прозрачное стекло стало прозрачнее (замечание пользователя):
    // 0.72 вместо 0.88 — сквозь ленту читаются задние витки
    const alpha1=state.opaque1 ? 1 : (isClear ? 0.40 : 0.72);
    const alpha2=state.opaque2 ? 1 : 0.72;
    const alphaM=(alpha1+alpha2)/2;
    let rIdx=-1;
    for(const r of rb.rods){
      rIdx++;
      if(r.st>=lim) continue;
      if(!project(r.a,B,p1) || !project(r.b,B,p2)) continue;
      const nd = Math.abs(V.dot(r.n, LIGHT));
      const zz = (p1[2]+p2[2])/2;
      let colR=null, al=alpha1;
      if(gradB){
        if(!rb.__gradMask) rb.__gradMask=gradMask(rb);
        const gm=rb.__gradMask[rIdx];
        colR=gm===2 ? gradB : (gm===1 ? gradM : null);   // null = основной
        al=gm===2 ? alpha2 : (gm===1 ? alphaM : alpha1);
      }
      prims.push({z:zz, kind:1,
        x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],
        wpx:Math.max(1.1, ROD_D*p1[3]),
        shade:0.40+0.60*nd, col:colR, al});
    }
    // контуры каркаса: два канта + центральный (у двурядной)
    // СМЕЩЕНИЕ ПО ГЛУБИНЕ ДЛЯ КАРКАСА И ДИОДОВ. Сортировка идёт по СЕРЕДИНЕ
    // стержня, а стержень длиной в полширины ленты своей серединой может
    // оказаться ближе к камере, чем проволока у его торца, — и закрашивал
    // каркас и диоды при приближении. Смещаем каркас и диоды к зрителю на
    // долю длины стержня: своя лента их больше не перекрывает, а участки
    // ленты, которые реально ближе, — перекрывают
    const wBias=Math.max(4, rb.halfW*0.35);
    const lBias=Math.max(8, rb.halfW*0.60);
    const railSets = [[rb.railA,1],[rb.railB,1]];
    if(rb.rows===2) railSets.push([rb.centers,0.8]);
    for(const rs of railSets){
      const rail=rs[0], wk=rs[1];
      const iMax=Math.min(rail.length, lim+1);
      for(let i=1;i<iMax;i++){
        if(!project(rail[i-1],B,p1) || !project(rail[i],B,p2)) continue;
        prims.push({z:(p1[2]+p2[2])/2-wBias, kind:2,
          x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],
          wpx:Math.max(0.8, WIRE_D*wk*p1[3])});
      }
    }
    // LED — светящиеся шарики Ø4 на проволоке каркаса, в общей глубинной
    // сортировке: сквозь непрозрачные стержни диоды не просвечивают
    let ledIdx=-1;
    for(const l of rb.leds){
      ledIdx++;
      if(rb.ledSt && rb.ledSt[ledIdx]>=lim) continue;
      if(!project(l,B,p1)) continue;
      prims.push({z:p1[2]-lBias, kind:3,
        x1:p1[0], y1:p1[1], rCore:Math.max(1.4, 2*p1[3])});
    }
  }

  prims.sort((a,b)=>b.z-a.z);

  // хром — серый металл, не белый: прежние 198-212 после осветления канта
  // (x1.15) уходили в белизну
  const gold = state.frameRal ? hexRgb(state.frameRal.c)
             : (ui.frame.value==="chrome" ? [150,156,164] : [201,162,39]);
  for(const pr of prims){
    if(pr.kind===0){ // подвес
      ctx.strokeStyle=LB ? "rgba(110,110,120,.55)" : "rgba(150,150,160,.45)"; ctx.lineWidth=Math.max(0.6, 1);
      ctx.beginPath(); ctx.moveTo(pr.x1,pr.y1); ctx.lineTo(pr.x2,pr.y2); ctx.stroke();
    } else if(pr.kind===1){ // стержень
      ctx.lineCap="round";
      ctx.strokeStyle = shadeCss(pr.col||glass, pr.shade,
        pr.al!==undefined ? pr.al : (isClear?0.40:0.72));
      ctx.lineWidth = pr.wpx;
      ctx.beginPath(); ctx.moveTo(pr.x1,pr.y1); ctx.lineTo(pr.x2,pr.y2); ctx.stroke();
      // блик
      ctx.strokeStyle = `rgba(255,255,255,${0.10+0.28*pr.shade})`;
      ctx.lineWidth = Math.max(0.5, pr.wpx*0.24);
      ctx.beginPath(); ctx.moveTo(pr.x1,pr.y1); ctx.lineTo(pr.x2,pr.y2); ctx.stroke();
    } else if(pr.kind===2){ // золотой кант
      ctx.lineCap="round";
      ctx.strokeStyle = shadeCss(gold, 1.15, 0.95);
      ctx.lineWidth = pr.wpx;
      ctx.beginPath(); ctx.moveTo(pr.x1,pr.y1); ctx.lineTo(pr.x2,pr.y2); ctx.stroke();
    } else { // диод Ø4 — тёплое свечение 3000 K
      if(LB){
        const R3=Math.max(4, pr.rCore*2.6);
        const g3=ctx.createRadialGradient(pr.x1,pr.y1,0,pr.x1,pr.y1,R3);
        g3.addColorStop(0,"rgba(255,170,70,.85)");
        g3.addColorStop(0.6,"rgba(255,160,60,.30)");
        g3.addColorStop(1,"rgba(255,150,50,0)");
        ctx.fillStyle=g3;
        ctx.beginPath(); ctx.arc(pr.x1,pr.y1,R3,0,7); ctx.fill();
        ctx.fillStyle="rgba(210,120,20,.95)";
        ctx.beginPath(); ctx.arc(pr.x1,pr.y1,Math.max(1,pr.rCore*0.8),0,7); ctx.fill();
        continue;
      }
      const R1=Math.max(6, pr.rCore*4.5), R2=Math.max(3, pr.rCore*1.9);
      const op=ctx.globalCompositeOperation;
      ctx.globalCompositeOperation="lighter";
      const g1=ctx.createRadialGradient(pr.x1,pr.y1,0,pr.x1,pr.y1,R1);
      g1.addColorStop(0,"rgba(255,168,86,.22)");
      g1.addColorStop(0.45,"rgba(255,150,66,.08)");
      g1.addColorStop(1,"rgba(255,140,56,0)");
      ctx.fillStyle=g1;
      ctx.beginPath(); ctx.arc(pr.x1,pr.y1,R1,0,7); ctx.fill();
      const g2=ctx.createRadialGradient(pr.x1,pr.y1,0,pr.x1,pr.y1,R2);
      g2.addColorStop(0,"rgba(255,214,160,.42)");
      g2.addColorStop(1,"rgba(255,186,116,0)");
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.arc(pr.x1,pr.y1,R2,0,7); ctx.fill();
      ctx.globalCompositeOperation=op;
      ctx.fillStyle="rgba(255,238,216,.95)";
      ctx.beginPath(); ctx.arc(pr.x1,pr.y1,pr.rCore,0,7); ctx.fill();
    }
  }
}

/* ============================================================
   Спецификация
   ============================================================ */
function updateSpec(){
  if(!scene) return;
  let totalLen=0, rods=0, glassMass=0, wire=0, leds=0, cabs=0, cabLen=0, cabSpan=0;
  const byLen = new Map();
  for(const rb of scene.ribbons){
    totalLen += rb.ribbonLen;
    rods += rb.rods.length;
    leds += rb.leds.length;
    cabs += rb.cabs.length;
    for(const cb of rb.cabs) cabLen += Math.abs(cb.from[1]-cb.to[1]);
    cabSpan = Math.max(cabSpan, rb.cabSpan||0);
    wire += rb.ribbonLen*(rb.rows===2?3:2); // контуры каркаса
    for(const r of rb.rods){
      // в спецификацию идёт НОМИНАЛЬНАЯ длина трубки (её и заказывают):
      // отрисованный торец на 1 мм не доходит до каркаса, чтобы каркас и
      // диоды были видны, но саму трубку это не укорачивает
      const ln=r.nom||r.len;
      byLen.set(ln, (byLen.get(ln)||0)+1);
      // трубка: сечение π·(R²−(R−t)²)
      glassMass += Math.PI*(ROD_R*ROD_R-(ROD_R-GLASS_WALL)*(ROD_R-GLASS_WALL))*ln*GLASS_DENSITY;
    }
  }
  const bb = (()=>{ // фактический габарит
    const min=[1e9,1e9,1e9],max=[-1e9,-1e9,-1e9];
    for(const rb of scene.ribbons){
      const b=geoBBox(rb);
      for(let k=0;k<3;k++){min[k]=Math.min(min[k],b.min[k]); max[k]=Math.max(max[k],b.max[k]);}
    }
    return [max[0]-min[0]+ROD_D, max[1]-min[1]+ROD_D, max[2]-min[2]+ROD_D];
  })();
  const minClear = measureClearance(scene.ribbons);
  const minRad = measureMinRadius(scene.ribbons);
  const railRad = measureRailRadius(scene.ribbons);
  const gaps = measureGaps(scene.ribbons);
  const airGap = minClear>=1e9 ? 25 : Math.max(0, Math.round(minClear - ROD_D));
  // разбивка метража по пробегам: фактическая осевая линия ленты
  // сегментируется по направлению хода вдоль оси пробегов (развороты —
  // смена знака с гистерезисом; дуги разворотов в пробег не входят)
  let runsBreak=null;
  if(scene.ribbons.length===1 && scene.ribbons[0].fillMode){
    const rb0=scene.ribbons[0];
    const C=rb0.centers;
    const ti=(rb0.fillAxis && rb0.fillAxis[0]===1) ? 1 : 0; // ось хода пробегов
    const segs=[];
    let s0=0, dir=0, acc=0, kRev=0;
    for(let k2=1;k2<C.length;k2++){
      const dd=C[k2][ti]-C[k2-1][ti];
      if(dir===0){ if(Math.abs(dd)>1e-6) dir=Math.sign(dd); continue; }
      if(Math.sign(dd)===dir || dd===0){ acc=0; continue; }
      if(acc===0) kRev=k2-1;
      acc+=Math.abs(dd);
      if(acc>70){ segs.push([s0,kRev]); s0=kRev; dir=-dir; acc=0; }
    }
    segs.push([s0, C.length-1]);
    const lens=[];
    for(const sg of segs){
      // дуги разворота (слабый ход вдоль оси) отсекаются с обоих концов
      let a2=sg[0], b2=sg[1];
      while(a2<b2 && Math.abs(C[a2+1][ti]-C[a2][ti])<9) a2++;
      while(b2>a2 && Math.abs(C[b2][ti]-C[b2-1][ti])<9) b2--;
      const L=(b2-a2)*rb0.stepEff/1000;
      if(L>=0.2) lens.push(L);
    }
    if(!lens.length) lens.push(rb0.ribbonLen/1000); // единый ход без разворотов
    const sum=lens.reduce((a2,b2)=>a2+b2,0);
    runsBreak={lens, turns:Math.max(0, rb0.ribbonLen/1000-sum)};
  }
  state.lastSpec = {totalLen, rods, glassMass, wire, leds, cabs, cabLen, cabSpan, byLen, bb, runsBreak,
                    airGap, minRad, railRad, gaps, clean: scene.clear.collisions===0};

  const m = (totalLen/1000);
  document.getElementById("spec").innerHTML = `
    <table>
      <tr class="hl"><td>Длина ленты</td><td>${m.toFixed(2)} пог. м</td></tr>
      <tr><td>Лент в композиции</td><td>${scene.ribbons.length} шт${
        scene.ribbons.length<scene.params.lanes ? " (запрошено "+scene.params.lanes+"; больше не помещается в габарит)" : ""}</td></tr>
      ${scene.ribbons.length>1?`<tr><td>Отрезки ленты</td><td>${
        scene.ribbons.map(rb=>(rb.ribbonLen/1000).toFixed(1)).join(" + ")} м</td></tr>`:""}
      <tr><td>${(ui.gradOn.checked ? (state.opaque1&&state.opaque2)
                  : state.opaque1)?"Непрозрачные стержни":"Стеклянные трубки"} Ø${ROD_D}</td><td>${rods} шт</td></tr>
      ${(()=>{
        // ЦВЕТА И КОЛИЧЕСТВА — ПРЯМО В РАСЧЁТЕ. Без градиента — один цвет
        // каталога на все трубки; с градиентом — три цвета RAL со штуками
        // прозрачность каждого цвета — прямо в строках раскладки
        // (замечание пользователя); у среднего при разных флагах — переход
        const t1=state.opaque1?"непрозрачные":"прозрачные";
        const t2=state.opaque2?"непрозрачные":"прозрачные";
        const tm=(state.opaque1===state.opaque2)? t1 : "полупрозрачные (переход)";
        if(!(ui.gradOn && ui.gradOn.checked))
          return `<tr><td>Цвет трубок</td><td>${state.color.name} — ${rods} шт, ${t1}</td></tr>`;
        const cnt=[0,0,0];
        for(const rb of scene.ribbons){
          const mk=rb.__gradMask||(rb.__gradMask=gradMask(rb));
          for(const v of mk) cnt[v]++;
        }
        const g2=ralOf(ui.gradC.value);
        const gm=nearestRal(gradMid(hexRgb(state.color.c), hexRgb(g2.c)));
        return `<tr><td>Цвет 1</td><td>${state.color.name} — ${cnt[0]} шт, ${t1}</td></tr>`
             + `<tr><td>Цвет 2 (средний)</td><td>${gm.name} — ${cnt[1]} шт, ${tm}</td></tr>`
             + `<tr><td>Цвет 3</td><td>${g2.name} — ${cnt[2]} шт, ${t2}</td></tr>`;
      })()}
      <tr><td>Ширина ленты</td><td>${scene.params.ribbonW} мм${
        scene.params.rows===2?` (2 ряда × ${scene.params.rodLen})`:""}</td></tr>
      <tr class="hl"><td>Масса композиции</td><td>${Math.ceil((glassMass+wire*WIRE_AREA*STEEL_DENSITY)/1000)} кг</td></tr>
      ${(()=>{
        // НАГРУЗКИ И НОРМЫ — язык проектировщика прямо в расчёте.
        // Нагрузка на трос считается при расстановке подвесов (масса
        // раздаётся ближайшим якорям); нормы высоты — проход 2100 мм от
        // пола, над столом 750 мм над столешницей 750 мм (итого 1500)
        if(!cabs) return "";
        let mx=0;
        for(const rb of scene.ribbons) for(const cb of rb.cabs)
          if(cb.load && cb.load>mx) mx=cb.load;
        const drop=scene.box.h+Math.max(0,+ui.dimC.value||0);
        const hp=(Math.ceil((drop+2100)/50)*50/1000).toFixed(2);
        const ht=(Math.ceil((drop+1500)/50)*50/1000).toFixed(2);
        return `<tr><td>Нагрузка на тросы</td><td>до ${mx<1?mx.toFixed(2):mx.toFixed(1)} кг на трос (${cabs} шт)${mx>10?" — крепление анкером с распором":""}</td></tr>`
             + `<tr><td>Высота помещения</td><td>проход под композицией — потолок от ${hp} м; над столом — от ${ht} м</td></tr>`;
      })()}
      ${leds?`<tr><td>Диоды на ленте</td><td>${leds} шт × ${LED_W} W — ${(leds*LED_W).toFixed(1)} Вт</td></tr>`:""}
      ${(()=>{
        // СВЕТ КАК ТОВАР: поток, мощность и понятная рекомендация площади.
        // Тёплый мини-диод 0.1 Вт даёт ~10 лм; для общего света жилой зоны
        // берётся норма 150 лк и коэффициент 0.6 на открытый светильник
        // (часть света уходит вверх и в стекло)
        if(!leds) return "";
        const lm=leds*10;
        const zone=lm*0.6/150;
        return `<tr><td>Световой поток</td><td>≈ ${lm>=1000?(lm/1000).toFixed(1)+" клм":lm+" лм"} (${leds} × 10 лм)</td></tr>`
             + `<tr><td>Освещение зоны</td><td>хватает для общего света ≈ ${zone.toFixed(1)} м² (150 лк)</td></tr>`;
      })()}
    </table>`;
  // НОМЕР ВАРИАНТА ВЫВОДИТСЯ РЯДОМ С ГАБАРИТОМ. Каждая композиция полностью
  // определяется этим номером: назвав его, можно вернуться к тому же варианту
  // или закрепить его по умолчанию — по картинке вариант не опознать
  // метраж из строки убран — он уже в мини-стикере слева внизу
  // (замечание пользователя: «дублируется информация»)
  document.getElementById("dims").textContent = scene.ring
    ? `кольцо Ø${scene.ring} × ${scene.box.h} мм · вариант №${state.seed}`
    : `${scene.box.w} × ${scene.box.d} × ${scene.box.h} мм · вариант №${state.seed}`;
  // МИНИ-СТИКЕР В СЦЕНЕ: главные числа всегда на виду, без прокрутки
  // к «Расчёту» — разговор с клиентом сразу предметный
  // состав стикера — по решению пользователя: длина, ширина, вес,
  // мощность — с расшифровкой в четыре строки
  const stEl=document.getElementById("stat");
  if(stEl) stEl.innerHTML =
    `<span>Длина ленты:</span> ${m.toFixed(2)} пог. м<br>`
    + `<span>Ширина ленты:</span> ${scene.params.ribbonW} мм<br>`
    + `<span>Вес:</span> ${Math.ceil((glassMass+wire*WIRE_AREA*STEEL_DENSITY)/1000)} кг`
    + (leds ? `<br><span>Мощность:</span> ${(leds*LED_W).toFixed(1)} Вт` : "");
}

/* ============================================================
   UI, события, экспорт
   ============================================================ */
const ui = {};
for(const id of ["dimW","dimD","dimH","dimC","ringD","form","plan","plast","rows","frame","rWidth","rodD","leds","cables","showBox","asm","gradOn","gradC"]){
  ui[id] = document.getElementById(id);
}
const DEFAULT_GLASS = GLASS_COLORS.find(c=>c.id==="RAL3003") || GLASS_COLORS[0];
/* КОМПОЗИЦИЯ ПО УМОЛЧАНИЮ ЗАФИКСИРОВАНА — своя для каждой рядности.
   При первом открытии и при переключении рядности (до первой ручной
   генерации) берётся закреплённое зерно: заказчик видит именно ту
   композицию, которая утверждена, а не случайную. Кнопка «Сгенерировать
   новый вариант» снимает закрепление и дальше идут случайные варианты. */
// закреплённые пользователем варианты: двухрядный №1550467706,
// однорядный №4194952124 (габарит по умолчанию 2400×900×800)
const SEED_PINNED = {1: 4194952124, 2: 1550467706};
const state = {seed: SEED_PINNED[2], color: DEFAULT_GLASS, lastSpec:null,
               autoSeed: true, frameRal: null, opaque1: false, opaque2: false};

// ВЫБОР ЦВЕТА — КНОПКОЙ. Вместо сетки свотчей в панели — кнопка
// «Выбрать цвет»: по клику открывается палитра со ВСЕМИ 198 цветами
// каталога Ralcolor_VG (с поиском по коду и названию). Вторая такая же
// кнопка — у градиента: ей выбирается второй цвет для микса.
// Произвольного цвета нет: красить можно только цветами каталога
function ralOf(id){ return GLASS_COLORS.find(g=>g.id===id) || GLASS_COLORS[0]; }
const setBtnColor=(dotId, nameId, g)=>{
  // КНОПКА ЗАЛИВАЕТСЯ ВЫБРАННЫМ ЦВЕТОМ (решение пользователя): цвет видно
  // самим полем, свотч-точка не нужна; текст — код RAL контрастом к фону
  const dot=document.getElementById(dotId);
  if(dot) dot.style.display="none";
  const nm=document.getElementById(nameId);
  nm.textContent=g.id;
  nm.title=g.name;
  const btn=nm.closest("button");
  if(btn){
    btn.style.background=g.c;
    const c=hexRgb(g.c), lum=0.299*c[0]+0.587*c[1]+0.114*c[2];
    btn.style.color=lum>150? "#17130a" : "#f4f0e6";
    btn.style.borderColor="rgba(255,255,255,.28)";
  }
};
const pick = (c)=>{
  state.color = c;
  setBtnColor("colorDot","colorName",c);
  needRedraw = true;
  if(state.lastSpec) updateSpec();
};
// всплывающая палитра каталога: заголовок, поиск, сетка 198 свотчей
function openRalPicker(title, curId, onPick, onClear, specials, opaqueOpt){
  const ov=document.createElement("div");
  ov.className="ralOverlay";
  const pop=document.createElement("div");
  pop.className="ralPop";
  const h=document.createElement("h3"); h.textContent=title;
  const find=document.createElement("input");
  find.className="ralFind"; find.placeholder="Поиск: код или название (например 3005 или винно)";
  const grid=document.createElement("div"); grid.className="ralGrid";
  const cur=document.createElement("div"); cur.className="ralCur";
  const curG=ralOf(curId);
  cur.textContent="Сейчас: "+curG.name;
  const rebuild=(q)=>{
    grid.innerHTML="";
    const qq=(q||"").trim().toLowerCase();
    for(const g of (specials||[])){
      if(qq && g.name.toLowerCase().indexOf(qq)<0) continue;
      const el=document.createElement("div");
      el.className="ralSw"+(g.id===curId?" sel":"");
      el.style.background=g.c;
      el.title=g.name;
      el.onclick=()=>{ document.body.removeChild(ov); onPick(g); };
      el.onmouseenter=()=>{ cur.textContent=g.name; };
      el.onmouseleave=()=>{ cur.textContent="Сейчас: "+curG.name; };
      grid.appendChild(el);
    }
    for(const g of GLASS_COLORS){
      if(qq && g.name.toLowerCase().indexOf(qq)<0) continue;
      const el=document.createElement("div");
      el.className="ralSw"+(g.id===curId?" sel":"");
      el.style.background=g.c;   // плоский цвет — как плашка в PDF-каталоге
      el.title=g.name;
      el.onclick=()=>{ document.body.removeChild(ov); onPick(g); };
      el.onmouseenter=()=>{ cur.textContent=g.name; };
      el.onmouseleave=()=>{ cur.textContent="Сейчас: "+curG.name; };
      grid.appendChild(el);
    }
  };
  find.oninput=()=>rebuild(find.value);
  ov.onclick=(e)=>{ if(e.target===ov) document.body.removeChild(ov); };
  document.addEventListener("keydown", function esc(e){
    if(e.key==="Escape" && ov.parentNode){ document.body.removeChild(ov); }
    if(!ov.parentNode) document.removeEventListener("keydown", esc);
  });
  if(opaqueOpt){
    // НЕПРОЗРАЧНОСТЬ — НЕЗАВИСИМО ДЛЯ КАЖДОГО ЦВЕТА (уточнение
    // пользователя: растяжка может идти от прозрачного до непрозрачного).
    // opaqueOpt — имя флага в state: opaque1 у цвета трубок, opaque2 у
    // второго цвета градиента; прозрачность интерполируется по раскладке
    const row=document.createElement("label");
    row.style.cssText="display:flex;gap:8px;align-items:center;margin:0 0 8px;"
      +"font-size:13px;color:var(--txt);cursor:pointer";
    const cb=document.createElement("input");
    cb.type="checkbox"; cb.checked=!!state[opaqueOpt];
    cb.onchange=()=>{
      state[opaqueOpt]=cb.checked;
      needRedraw=true;
      if(state.lastSpec) updateSpec();
    };
    const tx=document.createElement("span");
    tx.textContent="Непрозрачные";
    row.appendChild(cb); row.appendChild(tx);
    pop.appendChild(row);
  }
  if(onClear){
    const off=document.createElement("button");
    off.className="btn2"; off.type="button";
    off.textContent="Без градиента";
    off.style.marginBottom="8px";
    off.onclick=()=>{ document.body.removeChild(ov); onClear(); };
    pop.appendChild(off);
  }
  pop.insertBefore(h, pop.firstChild);
  pop.appendChild(find); pop.appendChild(grid); pop.appendChild(cur);
  ov.appendChild(pop); document.body.appendChild(ov);
  rebuild("");
  find.focus();
}
document.getElementById("colorBtn").onclick=()=>

// ГРАДИЕНТ БЕЗ ГАЛОЧКИ (решение пользователя): кнопка по умолчанию

/* ФОРМА ГАБАРИТА ЗАВИСИТ ОТ ПЛАСТИКИ. Для «микса» форма одна — «Шар»:
   плавный поток ленты читается в шаре, а в фигурных силуэтах (пирамида,
   ромб) навивка плашмя их не держит. Для «на ребро» доступны цилиндр, ромб
   и силуэты в плане — спираль вписывается в них витками.
   КОНУС И ПОЛУСФЕРА ИЗ СПИСКА УБРАНЫ: конус спираль отрабатывала только
   страховочным проходом (замер: 1500×1500×2000 — 8.68 пог. м при заполнении
   63/76/69%), а полусфера, вписанная в габарит, отличается от цилиндра
   только нижней четвертью высоты (на середине высоты радиус меньше всего
   на 13%) — на витках это не читается. */
// СИЛУЭТЫ В ПЛАНЕ ЖИВУТ В ОБЩЕМ СПИСКЕ ФОРМ. Каждый силуэт — отдельный пункт
// «Формы»: спуск идёт цилиндром, а витки несутся по выбранному контуру
// (вид сверху). Скрытый select#plan остаётся носителем значения силуэта
// «НА РЕБРО» — ФОРМЫ НАЧИНАЯ С ЦИЛИНДРА, БЕЗ КАПЛИ, БАРАБАНА И ПЕСОЧНЫХ
// ЧАСОВ. Параллелепипед и шар витки на ребре не держат; капля, барабан и
// песочные часы отклонены по результату — их силуэт спираль не отрабатывает
const EDGE_OFF={box:1, sphere:1, drop:1, barrel:1, waist:1, pyr:1};
for(const key in PLAN_SHAPES){
  const o=document.createElement("option");
  o.value=key; o.textContent=PLAN_SHAPES[key].label;
  ui.plan.appendChild(o);
  if(key==="circle") continue;
  const of=document.createElement("option");
  of.value="plan_"+key; of.textContent="В плане: "+PLAN_SHAPES[key].label;
  ui.form.appendChild(of);
}
ui.plan.value="circle";

// КОНЦЕПТ-ФОРМЫ — в конец списка (Форма-11 … Форма-19), чтобы номера
// существующих форм не сдвигались
for(const ck of CONCEPT_FORMS){
  const oc=document.createElement("option");
  oc.value="c_"+ck; oc.textContent=ck;
  ui.form.appendChild(oc);
}

// НАЗВАНИЯ ФОРМ — НОМЕРАМИ: «Форма-1», «Форма-2» … по порядку списка.
// Описательные названия силуэтов («клякса», «серп») в подборе не помогают и
// спорят с эскизом, номер короче и однозначен. Нумеруются только формы,
// доступные в «на ребро» — скрытые в списке номеров не занимают
{
  let nF=0;
  for(const o of ui.form.options){
    if(o.value.indexOf("plan_")!==0 && o.value.indexOf("c_")!==0
       && EDGE_OFF[o.value]) continue;
    o.textContent="Форма-"+(++nF);
  }
}

/* ПЛИТКИ ВЫБОРА ПЛАСТИКИ И ФОРМ. Выпадающие списки «Микс/На ребро» и
   «Форма-N» ни о чём не говорят человеку со стороны — плитки с маленькими
   процедурными превью узнаются мгновенно. Превью плановых силуэтов
   рисуются ЧЕСТНО — из тех же функций контура PLAN_SHAPES, что строят
   геометрию; скрытые <select> остаются источником истины для всего кода */
function tilePrev(drawFn){
  const c=document.createElement("canvas");
  c.width=104; c.height=104; c.style.width="52px"; c.style.height="52px";
  const g=c.getContext("2d");
  g.strokeStyle="#cfa93e"; g.lineWidth=3.4; g.lineCap="round"; g.lineJoin="round";
  drawFn(g);
  return c;
}
function prevPlan(key){ return tilePrev(g=>{
  const F=(PLAN_SHAPES[key]||PLAN_SHAPES.circle).r;
  let mx=0; for(let i=0;i<240;i++) mx=Math.max(mx, F(i/240*Math.PI*2));
  g.beginPath();
  for(let i=0;i<=240;i++){
    const a=i/240*Math.PI*2, r=F(a)/mx*42;
    const x=52+r*Math.cos(a), y=52+r*Math.sin(a);
    if(i) g.lineTo(x,y); else g.moveTo(x,y);
  }
  g.stroke();
});}
function prevSpiral(){ return tilePrev(g=>{
  g.beginPath();
  for(let i=0;i<=300;i++){
    const t=i/300, a=t*Math.PI*2*3.1, r=6+t*38;
    const x=52+r*Math.cos(a), y=52+r*Math.sin(a);
    if(i) g.lineTo(x,y); else g.moveTo(x,y);
  }
  g.stroke();
});}
function prevRhomb(){ return tilePrev(g=>{
  g.beginPath(); g.moveTo(52,10); g.lineTo(88,52); g.lineTo(52,94);
  g.lineTo(16,52); g.closePath(); g.stroke();
});}
function prevCyl(){ return tilePrev(g=>{
  for(let k=0;k<4;k++){ g.beginPath(); g.ellipse(52,26+k*17,37,9,0,0,7); g.stroke(); }
});}
function prevVortex(){ return tilePrev(g=>{
  for(let k=0;k<4;k++){
    const y=22+k*18, rx=40-k*10, ry=Math.max(3.5, 9-k*1.6);
    g.beginPath(); g.ellipse(52,y,Math.max(6,rx),ry,0,0,7); g.stroke();
  }
});}
function prevRitm(){ return tilePrev(g=>{
  for(const y of [18,29,50,61,83,94]){
    g.beginPath(); g.ellipse(52,y,36,6.5,0,0,7); g.stroke();
  }
});}
function prevRings(){ return tilePrev(g=>{
  for(const q of [[0.55,38,17],[-0.55,32,14],[1.15,25,11]]){
    g.beginPath(); g.ellipse(52,52,q[1],q[2],q[0],0,7); g.stroke();
  }
});}
// схематичные изображения САМИХ КОМПОЗИЦИЙ (по скриншотам пользователя):
// «микс» — плывущая лента с перекатами, «на ребро» — конус колец-этажерка
function prevMix(){ return tilePrev(g=>{
  // как реальная генерация (образец пользователя): длинная лента плывёт
  // слева направо мягкими волнами, два переката — лента поворачивается
  // лицом/ребром, стержни поперёк
  const N=84, top=[], bot=[];
  for(let i=0;i<=N;i++){
    const t=i/N, x=3+t*98;
    const y=52+15*Math.sin(t*Math.PI*2*0.85+2.4)+5*Math.sin(t*Math.PI*4.2);
    // ширина: два переката (смены знака) по ходу ленты
    const w=12*Math.cos(t*Math.PI*2.1-0.35);
    top.push([x,y-w]); bot.push([x,y+w]);
  }
  g.lineWidth=2.0;
  g.beginPath(); top.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke();
  g.beginPath(); bot.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke();
  g.lineWidth=1.05;
  for(let i=2;i<N;i+=3){
    g.beginPath(); g.moveTo(top[i][0],top[i][1]); g.lineTo(bot[i][0],bot[i][1]); g.stroke();
  }
});}
function prevEdgeCone(){ return tilePrev(g=>{
  g.lineWidth=2.4;
  for(const q of [[44,22],[36,40],[28,58],[19,74],[11,88]]){
    const rx=q[0], y=q[1], ry=rx*0.36;
    g.beginPath(); g.ellipse(52,y,rx,ry,0,0,7); g.stroke();
    // нижняя кромка кольца — лента стоит на ребре
    g.beginPath(); g.ellipse(52,y+6,rx,ry,0, Math.PI*0.06, Math.PI*0.94); g.stroke();
  }
});}
function formPreview(v){
  if(v.indexOf("plan_")===0) return prevPlan(v.slice(5));
  if(v==="cyl") return prevCyl();
  if(v==="rhomb") return prevRhomb();
  if(v==="c_vortex") return prevVortex();
  if(v==="c_ritm") return prevRitm();
  if(v==="c_rings") return prevRings();
  return prevSpiral();
}
function renderPlastTiles(){
  const box=document.getElementById("plastTiles");
  if(!box) return;
  if(!box.childElementCount){
    const defs=[["mix","Волны · «микс»",prevMix],["edge","Спираль · «на ребро»",prevEdgeCone]];
    for(const df of defs){
      const t=document.createElement("div");
      t.className="tile"; t.dataset.val=df[0];
      t.appendChild(df[2]());
      const sp=document.createElement("span"); sp.textContent=df[1]; t.appendChild(sp);
      t.addEventListener("click", ()=>{
        if(ui.plast.value===t.dataset.val) return;
        ui.plast.value=t.dataset.val;
        ui.plast.dispatchEvent(new Event("change"));
      });
      box.appendChild(t);
    }
  }
  for(const t of box.children) t.classList.toggle("on", t.dataset.val===ui.plast.value);
}
function renderFormTiles(){
  const box=document.getElementById("formTiles");
  if(!box) return;
  const edge=(ui.plast.value==="edge");
  box.style.display = edge ? "" : "none";
  // кольцо — только для «микса»: спираль «на ребро» и так круглая
  const ringRow=document.getElementById("ringRow");
  if(ringRow) ringRow.style.display = edge ? "none" : "";
  if(!edge) return;
  const vis=[...ui.form.options].filter(o=>!o.hidden);
  const key=vis.map(o=>o.value+"|"+o.textContent).join(",");
  if(box.dataset.key!==key){
    box.dataset.key=key;
    box.innerHTML="";
    for(const o of vis){
      const t=document.createElement("div");
      t.className="tile"; t.dataset.val=o.value; t.title=o.textContent;
      t.appendChild(formPreview(o.value));
      const sp=document.createElement("span"); sp.textContent=o.textContent; t.appendChild(sp);
      t.addEventListener("click", ()=>{
        if(ui.form.value===t.dataset.val) return;
        ui.form.value=t.dataset.val;
        ui.form.dispatchEvent(new Event("change"));
      });
      box.appendChild(t);
    }
  }
  for(const t of box.children) t.classList.toggle("on", t.dataset.val===ui.form.value);
}

/* ПАРАМЕТРЫ ПО УМОЛЧАНИЮ ДЛЯ ПЛАСТИКИ И ФОРМЫ. У «на ребро» своя рабочая
   точка габарита: 1500×1500×1000 при 600 мм тросов — на ней спираль читается
   витками, а не столбом. У формы «Ромб» — вытянутый вверх габарит
   1500×1500×3000: ромб узнаётся только на высоте (силуэта «Ромб в плане»
   это не касается, у него габарит остаётся как был). Пресеты
   выставляются при ПЕРЕКЛЮЧЕНИИ пластики на «ребро» и при ВЫБОРЕ формы;
   набранные потом руками размеры не трогаются */
const EDGE_DEF = {form:"cyl", w:1500, d:1500, h:1000, c:600};
// рабочая точка «микса» — эталонный габарит: возврат на плитку «микс»
// ставит её обратно (замечание пользователя: после «на ребро» размеры
// оставались от спирали)
const MIX_DEF = {w:2400, d:900, h:800, c:600};
const FORM_DEF = {
  rhomb:      {w:1500, d:1500, h:3000, c:600},  // Форма-2 «Ромб»
  plan_star4: {w:1500, d:1500, h:1000, c:600},  // Форма-3 (звезда)
  plan_rhomb4:{w:1000, d:2000, h:1500, c:600},  // Форма-4 (ромб в плане)
  plan_bean:  {w:3000, d:2000, h:1500, c:600},  // Форма-5 (боб)
  plan_pear:  {w:3000, d:3000, h:1500, c:600},  // Форма-6 (груша)
  plan_arc:   {w:2000, d:2000, h:2000, c:600},  // Форма-7 (подкова)
  plan_blob:  {w:2000, d:2000, h:1000, c:600},  // Форма-8 (блоб)
  plan_wave:  {w:2000, d:2000, h:1500, c:600},  // Форма-9 (волна в плане)
  c_vortex:   {w:2000, d:2000, h:1500, c:600},  // вихрь
  c_ritm:     {w:2500, d:2500, h:2500, c:600},  // рваный ритм
  c_rings:    {w:4500, d:4500, h:2000, c:600},  // гироскоп
};
function setDims(p){
  if(p.w) ui.dimW.value=String(p.w);
  if(p.d) ui.dimD.value=String(p.d);
  if(p.h) ui.dimH.value=String(p.h);
  if(p.c!=null) ui.dimC.value=String(p.c);
}
function applyPreset(which){
  // переключение пластики или выбор формы снова показывает ЗАКРЕПЛЁННЫЙ
  // вариант этой пластики/формы, а не случайный, доставшийся от предыдущей
  state.autoSeed=true;
  if(which==="plast"){
    if(ui.plast.value==="edge"){ ui.form.value=EDGE_DEF.form; setDims(EDGE_DEF); }
    else setDims(MIX_DEF);
    return;
  }
  if(ui.plast.value!=="edge") return;      // в «миксе» форма одна, пресета нет
  const p=FORM_DEF[ui.form.value];
  if(p) setDims(p);
}

function syncForms(){
  const mixOnly=(ui.plast.value!=="edge");
  for(const o of ui.form.options){
    const keep = mixOnly ? (o.value==="sphere")
                         : (o.value.indexOf("plan_")===0
                            || o.value.indexOf("c_")===0
                            || !EDGE_OFF[o.value]);
    o.hidden=!keep; o.disabled=!keep;
  }
  if(mixOnly && ui.form.value!=="sphere") ui.form.value="sphere";
  if(!mixOnly && EDGE_OFF[ui.form.value]) ui.form.value="cyl";
  // выпадающая строка формы скрыта всегда: выбор идёт плитками с превью
  // (renderFormTiles), скрытый <select> остаётся источником истины
  const row=document.getElementById("formRow");
  if(row) row.style.display = "none";
  // силуэт в плане — только для «на ребро»: в «миксе» лента лежит плашмя и
  // плановый контур ей не задаётся

  // ОДНОРЯДНАЯ ЛЕНТА: СТЕРЖЕНЬ НЕ КОРОЧЕ 200 мм. У однорядной ширина ленты
  // равна длине стержня, и на 100–150 мм лента получается слишком узкой —
  // производство такую не делает
  const minRod=(+ui.rows.value===1) ? 200 : 100;
  for(const o of ui.rWidth.options){
    const keep=(+o.value>=minRod);
    o.hidden=!keep; o.disabled=!keep;
  }
  if(+ui.rWidth.value<minRod) ui.rWidth.value=String(minRod);
  renderPlastTiles(); renderFormTiles();
}
function refreshLabels(){ syncForms(); }

let rebuildTimer=null;
const rebuild = (msg)=>{
  refreshLabels();
  clearTimeout(rebuildTimer);
  const m=(typeof msg==="string") ? msg : null;
  rebuildTimer=setTimeout(()=>buildDeferred(m), 120);
};
// ПЛАШКА-ОБЪЯСНЕНИЕ. Молчаливые ограничения пугают: значение тихо
// меняется, и пользователь думает, что сломалось. Каждый кламп и
// автоматика говорят о себе плашкой на 4 секунды
let toastT=null;
function toast(msg){
  const t=document.getElementById("toast");
  if(!t) return;
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove("show"), 4000);
}
// ПРАВИЛА ПОЛЬЗОВАТЕЛЯ ПО ГАБАРИТАМ: у композиций «микс» высота не
// больше 3500 мм (вертикальная лента — всегда один отрезок, см. нарезку
// в buildScene). Минимальные габариты — меньше система не даёт ставить:
//   «микс»     — ширина 1500, глубина 600, высота 600;
//   «на ребро» — ширина 1000, глубина 1000, высота 600
const MIX_H_MAX=3500;
const dimMin=(id)=>{
  const edge=ui.plast.value==="edge";
  if(id==="dimW") return edge? 1000 : 1500;
  if(id==="dimD") return edge? 1000 : 600;
  return 600;
};
const clampDims=()=>{
  // при кольце ширина и глубина считаются от диаметра — поля выключены
  const ringOn=ui.ringD && +ui.ringD.value>0 && ui.plast.value!=="edge";
  ui.dimW.disabled=ringOn; ui.dimD.disabled=ringOn;
  ui.dimW.min=String(dimMin("dimW"));
  ui.dimD.min=String(dimMin("dimD"));
  if(ringOn){
    if(ui.plast.value!=="edge" && +ui.dimH.value>MIX_H_MAX)
      ui.dimH.value=String(MIX_H_MAX);
    if(+ui.dimH.value<600) ui.dimH.value="600";
    return;
  }
  for(const id of ["dimW","dimD","dimH"]){
    const mn=dimMin(id);
    if(+ui[id].value<mn){
      ui[id].value=String(mn);
      toast("Минимум для этой пластики — "+mn+" мм (правило производства)");
    }
  }
  if(ui.plast.value!=="edge" && +ui.dimH.value>MIX_H_MAX){
    ui.dimH.value=String(MIX_H_MAX);
    toast("Высота ограничена "+MIX_H_MAX+" мм — правило производства для лент «микс»");
  }
};
for(const id of ["dimW","dimD","dimH","form","plast","rows","rWidth","rodD","ringD"])
  ui[id].addEventListener("change", ()=>{
    if(id==="plast" || id==="form") applyPreset(id);
    clampDims();
    rebuild(id==="ringD" && +ui.ringD.value>0
      ? "Укладываем ленту по кольцу…" : "Генерация варианта композиции…");
  });
// ЖИВОЙ ГАБАРИТНЫЙ БОКС: пунктир меняет размер сразу при наборе цифр,
// не дожидаясь пересборки ленты — видно, что ввод принят (пересборка
// придёт по change, а до неё сцена показывает старую ленту в новом боксе)
for(const idD of ["dimW","dimD","dimH","dimC"])
  ui[idD].addEventListener("input", ()=>{
    if(!scene) return;
    state.boxPreview={w:Math.max(dimMin("dimW"), +ui.dimW.value||scene.box.w),
                      h:Math.max(dimMin("dimH"), +ui.dimH.value||scene.box.h),
                      d:Math.max(dimMin("dimD"), +ui.dimD.value||scene.box.d)};
    needRedraw=true;
  });
ui.frame.addEventListener("change", ()=>{needRedraw=true;});
// градиент цвета — чистая перерисовка, каркас не пересобирается
ui.gradOn.addEventListener("change", ()=>{needRedraw=true; if(state.lastSpec) updateSpec();});
ui.gradC.addEventListener("change", ()=>{needRedraw=true; if(state.lastSpec) updateSpec();});
// подпись индикатора — по операции: галочки диодов и подвесов не подбирают
// композицию заново, они доукомплектовывают уже готовый каркас
ui.dimC.addEventListener("change", ()=>rebuild("Пересчитываем длину тросов…"));
ui.leds.addEventListener("change", ()=>rebuild(

ui.cables.addEventListener("change", ()=>rebuild(

// СБОРКА: бегунок листает станции монтажа без пересборки геометрии
// (кнопка автопроигрывания убрана по решению пользователя — дублировала бегунок)
state.asm=1;
ui.asm.addEventListener("input", ()=>{

});
ui.showBox.addEventListener("change", ()=>{needRedraw=true;});
{
  // СВЕТЛЫЙ ШОУРУМ — круглой кнопкой в углу окна генерации (решение
  // пользователя): ☀ в тёмном зале включает белую галерею, ☾ — обратно

}

const regenClick = ()=>{
