/* ============================================================
   ЭКСПОРТ ГЕОМЕТРИИ: технологу — под монтажную схему, монтажникам — под
   сборку в реале. Три файла:
     • OBJ — 3D-модель композиции (каркас полилиниями, каждая трубка
       отдельной линией): открывается в Rhino / 3ds Max / Blender / SketchUp;
     • DXF (R12, 3D) — те же линии по слоям: WIRE_*, ROD_GLASS, LED,
       SUSPENSION, BBOX. По нему технолог делает монтажную схему в CAD;
     • монтажная карта CSV — таблица для монтажников: каждая трубка с
       координатами торцов и её положением по длине каркаса, точки диодов
       и подвесов.
   СИСТЕМА КООРДИНАТ ЭКСПОРТА: Z — ВВЕРХ (как принято в CAD и на стройке),
   начало — нижний угол габарита. X — ширина, Y — глубина, Z — высота.
   Внутри конфигуратора вверх смотрит Y, поэтому при экспорте оси
   переставляются: X=x, Y=z, Z=y. Все размеры в миллиметрах.
   ============================================================ */
const EXP = {
  // конфигуратор: [x=ширина, y=высота, z=глубина] → CAD: [x, y=глубина, z=высота]
  p: (q)=>[q[0], q[2], q[1]],
  f: (v)=>v.toFixed(1),
  name: (ext)=>`vargov-ribbon-${ui.dimW.value}x${ui.dimD.value}x${ui.dimH.value}-`
              +`${scene.params.plast==="edge"?"na-rebro":"mix"}.${ext}`,
  // BOM нужен только CSV (иначе Excel ломает кириллицу); в OBJ и DXF он
  // мешает парсерам
  save: (fname, text, mime)=>{
    const a=document.createElement("a");
    a.download=fname;
    const bom=/csv/.test(mime) ? "﻿" : "";
    a.href=URL.createObjectURL(new Blob([bom+text],{type:mime}));
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
  },
  // контуры каркаса ленты: у двурядной три (кант A, центральный, кант B),
  // у однорядной два канта
  wires: (rb)=>rb.rows===2
    ? [["WIRE_EDGE_A", rb.railA], ["WIRE_CENTER", rb.centers], ["WIRE_EDGE_B", rb.railB]]
    : [["WIRE_EDGE_A", rb.railA], ["WIRE_EDGE_B", rb.railB]],
};

document.getElementById("saveObj").onclick = ()=>{
  if(!scene) return;
  const L=[], V2=[]; let vi=1;
  L.push("# Vargov(R) Design - ленточная композиция из стеклянных стержней");
  L.push(`# габарит (Ш x Г x В), мм: ${ui.dimW.value} x ${ui.dimD.value} x ${ui.dimH.value}`);
  L.push(`# пластика: ${scene.params.plast==="edge"?"на ребро":"микс"}; `
        +`рядность: ${scene.params.rows}; лента ${scene.params.ribbonW} мм; `
        +`трубка Ø${ROD_D} x ${GLASS_WALL} мм`);
  L.push(`# длина ленты: ${(state.lastSpec.totalLen/1000).toFixed(2)} пог. м; `
        +`трубок: ${state.lastSpec.rods} шт`);
  L.push("# оси: X - ширина, Y - глубина, Z - высота (Z вверх), мм");
  const put=(q)=>{ const e=EXP.p(q); V2.push(`v ${EXP.f(e[0])} ${EXP.f(e[1])} ${EXP.f(e[2])}`); return vi++; };
  const groups=[];
  scene.ribbons.forEach((rb, ri)=>{
    // каркас: полилинии
    for(const [nm, arr] of EXP.wires(rb)){
      const idx=arr.map(put);
      groups.push([`R${ri+1}_${nm}`, ["l "+idx.join(" ")]]);
    }
    // стеклянные трубки: каждая отдельным отрезком
    const rodL=[];
    for(const r of rb.rods) rodL.push(`l ${put(r.b)} ${put(r.a)}`);
    groups.push([`R${ri+1}_ROD_GLASS`, rodL]);
    // диоды и подвесы — точками
    if(rb.leds && rb.leds.length)
      groups.push([`R${ri+1}_LED`, ["p "+rb.leds.map(put).join(" ")]]);
    if(rb.cabs && rb.cabs.length){
      const cl=[];
      for(const c of rb.cabs) cl.push(`l ${put(c.to)} ${put(c.from)}`);
      groups.push([`R${ri+1}_SUSPENSION`, cl]);
    }
  });
  const out=L.concat(V2);
  for(const [nm, lines] of groups){ out.push(`g ${nm}`); out.push(...lines); }
  EXP.save(EXP.name("obj"), out.join("\n")+"\n", "text/plain;charset=utf-8");
};

document.getElementById("saveDxf").onclick = ()=>{
  if(!scene) return;
  // DXF R12: минимальный валидный файл из отрезков по слоям — его читают
  // AutoCAD, Rhino, NanoCAD, LibreCAD, Fusion
  const o=[];
  const rec=(c,v)=>{ o.push(String(c)); o.push(String(v)); };
  const line=(layer,a,b)=>{
    const p1=EXP.p(a), p2=EXP.p(b);
    rec(0,"LINE"); rec(8,layer);
    rec(10,EXP.f(p1[0])); rec(20,EXP.f(p1[1])); rec(30,EXP.f(p1[2]));
    rec(11,EXP.f(p2[0])); rec(21,EXP.f(p2[1])); rec(31,EXP.f(p2[2]));
  };
  const pt=(layer,a)=>{
    const p1=EXP.p(a);
    rec(0,"POINT"); rec(8,layer);
    rec(10,EXP.f(p1[0])); rec(20,EXP.f(p1[1])); rec(30,EXP.f(p1[2]));
  };
  // заголовок: версия R12 и единицы — миллиметры
  rec(0,"SECTION"); rec(2,"HEADER");
  rec(9,"$ACADVER"); rec(1,"AC1009");
  rec(9,"$INSUNITS"); rec(70,4);
  rec(0,"ENDSEC");
  rec(0,"SECTION"); rec(2,"ENTITIES");
  scene.ribbons.forEach((rb, ri)=>{
    const pre=scene.ribbons.length>1 ? `R${ri+1}_` : "";
    for(const [nm, arr] of EXP.wires(rb))
      for(let i=1;i<arr.length;i++) line(pre+nm, arr[i-1], arr[i]);
    for(const r of rb.rods) line(pre+"ROD_GLASS", r.b, r.a);
    if(rb.leds) for(const l of rb.leds) pt(pre+"LED", l);
    if(rb.cabs) for(const c of rb.cabs) line(pre+"SUSPENSION", c.to, c.from);
  });
  { // габаритный бокс
    const {w,h,d}=scene.box;
    const K=[[0,0,0],[w,0,0],[w,0,d],[0,0,d],[0,h,0],[w,h,0],[w,h,d],[0,h,d]];
    for(const [a,b] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])
      line("BBOX", K[a], K[b]);
  }
  rec(0,"ENDSEC"); rec(0,"EOF");
  EXP.save(EXP.name("dxf"), o.join("\r\n")+"\r\n", "application/dxf");
};

document.getElementById("saveMont").onclick = ()=>{
  if(!scene) return;
  const s=state.lastSpec;
  const R=[];
  R.push(["Vargov(R) Design - МОНТАЖНАЯ КАРТА ленточной композиции"]);
  R.push([`Габарит (Ш x Г x В), мм`, `${ui.dimW.value} x ${ui.dimD.value} x ${ui.dimH.value}`]);
  R.push(["Пластика", scene.params.plast==="edge"?"на ребро":"микс"]);
  R.push(["Рядность", scene.params.rows===2?"2 ряда":"1 ряд"]);
  R.push(["Ширина ленты, мм", scene.params.ribbonW]);
  R.push([`Трубка`, `Ø${ROD_D} x ${GLASS_WALL} мм, длина ${[...s.byLen.keys()][0]} мм`]);
  R.push(["Длина ленты, пог. м", (s.totalLen/1000).toFixed(2)]);
  R.push(["Оси: X - ширина, Y - глубина, Z - высота (Z вверх); начало - нижний угол габарита; мм"]);
  R.push([]);
  scene.ribbons.forEach((rb, ri)=>{
    if(scene.ribbons.length>1) R.push([`ЛЕНТА ${ri+1}`]);
    // ход по центральному контуру: по нему монтажник размечает каркас
    const wire=rb.rows===2 ? rb.centers : rb.railA;
    R.push([]);
    R.push(["КАРКАС: разметка по контуру (шаг станции = шаг трубок)"]);
    R.push(["№ станции","ход по каркасу, мм","X","Y","Z","угол поворота к пред., град"]);
    let acc=0;
    for(let i=0;i<wire.length;i++){
      if(i>0) acc+=V.len(V.sub(wire[i], wire[i-1]));
      let ang="";
      if(i>0 && i<wire.length-1){
        const v1=V.sub(wire[i],wire[i-1]), v2=V.sub(wire[i+1],wire[i]);
        const l1=V.len(v1)||1, l2=V.len(v2)||1;
        ang=(Math.acos(Math.max(-1,Math.min(1,V.dot(v1,v2)/(l1*l2))))*180/Math.PI).toFixed(2);
      }
      const e=EXP.p(wire[i]);
      // каждая 10-я станция: карта остаётся читаемой на печати
      if(i%10===0 || i===wire.length-1)
        R.push([i+1, Math.round(acc), EXP.f(e[0]), EXP.f(e[1]), EXP.f(e[2]), ang]);
    }
    R.push([]);
    R.push(["СТЕКЛЯННЫЕ ТРУБКИ: торцы (b - у каркаса, a - наружный)"]);
    // при включённом градиенте у каждой трубки указан её цвет (1 или 2):
    // трубка красится целиком, растяжка — количеством трубок каждого цвета
    const gmk=ui.gradOn.checked ? (rb.__gradMask||(rb.__gradMask=gradMask(rb))) : null;
    const gHex=gmk ? [state.color.id,
                      nearestRal(gradMid(hexRgb(state.color.c),
                                         hexRgb(ralOf(ui.gradC.value).c))).id,
                      ralOf(ui.gradC.value).id] : null;
    R.push(["№ трубки","ряд","станция","длина, мм","Xb","Yb","Zb","Xa","Ya","Za"
            ].concat(gmk?["цвет"]:[]));
    rb.rods.forEach((r, k)=>{
      const b=EXP.p(r.b), a=EXP.p(r.a);
      R.push([k+1, r.u2>0 ? "верхний" : "нижний", r.st+1, r.len.toFixed(1),
              EXP.f(b[0]),EXP.f(b[1]),EXP.f(b[2]), EXP.f(a[0]),EXP.f(a[1]),EXP.f(a[2])
             ].concat(gmk?[gHex[gmk[k]]]:[]));
    });
    if(rb.leds && rb.leds.length){
      R.push([]);
      R.push([`ДИОДЫ НА ЛЕНТЕ ${LED_W} W / ${LED_V} V, шаг ${LED_PITCH} мм`]);
      R.push(["№","X","Y","Z"]);
      rb.leds.forEach((l,k)=>{ const e=EXP.p(l); R.push([k+1, EXP.f(e[0]),EXP.f(e[1]),EXP.f(e[2])]); });
    }
    if(rb.cabs && rb.cabs.length){
      R.push([]);
      R.push(["ТРОСЫ: точка крепления на ленте, длина троса до потолка габарита и нагрузка"]);
      R.push(["№","X","Y","Z","длина троса, мм","нагрузка, кг"]);
      rb.cabs.forEach((c,k)=>{
        const e=EXP.p(c.to);
        R.push([k+1, EXP.f(e[0]),EXP.f(e[1]),EXP.f(e[2]), Math.round(c.from[1]-c.to[1]),
                (c.load||0).toFixed(2)]);
      });
    }
  });
  EXP.save(EXP.name("csv").replace(".csv","-montage.csv"),
           R.map(r=>r.join(";")).join("\r\n"), "text/csv;charset=utf-8");
};

/* камера: события */
let drag=null;
cv.addEventListener("pointerdown", e=>{
  drag={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e=>{
  if(!drag) return;
  camera.yaw   += (e.clientX-drag.x)*0.006;
  camera.pitch += (e.clientY-drag.y)*0.005;
  camera.pitch = Math.max(-1.35, Math.min(1.35, camera.pitch));
  drag={x:e.clientX,y:e.clientY};
  needRedraw=true;
});
cv.addEventListener("pointerup", ()=>{drag=null;});
cv.addEventListener("wheel", e=>{
  e.preventDefault();
  camera.dist *= (e.deltaY>0?1.1:0.9);
  camera.dist = Math.max(400, Math.min(60000, camera.dist));
  needRedraw=true;
},{passive:false});
cv.addEventListener("dblclick", ()=>{
  camera.yaw=camera.home.yaw; camera.pitch=camera.home.pitch;
  camera.fitTo(scene.box);
  needRedraw=true;
});

function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  const r = cv.parentElement.getBoundingClientRect();
  cw = r.width; chgt = r.height;
  cv.width = Math.round(cw*dpr); cv.height = Math.round(chgt*dpr);
  needRedraw = true;
}
window.addEventListener("resize", resize);

let lastT = 0;
function loop(t){
  lastT = t;
  if(needRedraw){ draw(); needRedraw=false; }
  requestAnimationFrame(loop);
}

/* Первый кадр рисуется СРАЗУ, генерация запускается после него: иначе
   страница висит белым (или спиннером в iframe) все секунды подбора */
function drawSplash(msg){
  // сразу показываем габарит (и выбранную форму) — уже это отвечает на
  // вопрос «что строится», пока идёт подбор варианта
  const box={w:+ui.dimW.value||2400, h:+ui.dimH.value||800, d:+ui.dimD.value||900};
  const rodLen=ROD_LENGTHS.indexOf(+ui.rWidth.value)>=0 ? +ui.rWidth.value : 300;
  const rw=rodLen*(+ui.rows.value===2?2:1);
  let env=null;
  {
    const fo=formOf([Math.max(200,box.w-40), Math.max(200,box.h-40), Math.max(200,box.d-40)],
                    rw, ui.form.value);
    env=null; void fo;   // пунктир формы не рисуется и на заглушке
  }
  scene={box, ribbons:[], params:{form:ui.form.value, ribbonW:rw, rows:+ui.rows.value, lanes:1},
         clear:{collisions:0}, env};
  camera.fitTo(box);
  draw();
  if(msg){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=state.lightBg ? "rgba(90,80,50,.9)"
                 : "rgba(214,201,166,.9)"; ctx.font="15px system-ui";
    ctx.textAlign="center";
    ctx.fillText(msg, cw/2, chgt-38);
    ctx.textAlign="left";
  }
}
/* сборка после отрисовки кадра с подписью — интерфейс отвечает сразу.
   Первая сборка обязана уйти ЗА событие load: иначе браузер (и обёртка
   iframe) держит индикатор загрузки все секунды подбора варианта */
/* ИНДИКАТОР ГЕНЕРАЦИИ ГОВОРИТ, ЧТО ИМЕННО ИДЁТ. Генерация варианта композиции
   и «добавляем диоды на контур» — разные операции, и подпись обязана
   соответствовать нажатой галочке */
function buildDeferred(msg){
  drawSplash("");
  const busy=document.getElementById("busy");
  const txt=document.getElementById("busyTxt");
  if(txt) txt.textContent=msg||"Генерация варианта композиции…";
  if(busy) busy.classList.add("on");
  const run=()=>{
    try { buildScene(); }
    finally { if(busy) busy.classList.remove("on"); }
    needRedraw=true;
  };
  if(document.readyState!=="complete")
    window.addEventListener("load", ()=>setTimeout(run, 30), {once:true});
  else requestAnimationFrame(()=>setTimeout(run, 0));
}
/* ============================================================
   ИЗБРАННОЕ И ССЫЛКА НА ВАРИАНТ. Номер варианта воспроизводим, поэтому
   композиция целиком описывается компактным набором параметров:
   избранное хранится в localStorage браузера, «Ссылка на вариант» несёт
   те же параметры в hash — по ней открывается ровно тот вариант,
   который утвердили (менеджер отправляет ссылку клиенту)
   ============================================================ */
function variantState(){
  return {v:state.seed>>>0, w:+ui.dimW.value, d:+ui.dimD.value,
          h:+ui.dimH.value, c:+ui.dimC.value, pl:ui.plast.value,
          f:ui.form.value, r:+ui.rows.value, rw:+ui.rWidth.value,
          rd:+ui.rodD.value, fr:ui.frame.value,
          frc:state.frameRal?state.frameRal.id:"", col:state.color.id,
          op:state.opaque1?1:0, op2:state.opaque2?1:0,
          g:ui.gradOn.checked?1:0, gc:ui.gradC.value,
          rg:ui.ringD? +ui.ringD.value : 0};
}
function applyVariant(o){
  if(o.pl) ui.plast.value=o.pl;
  syncForms();
  if(o.f) ui.form.value=o.f;
  if(o.w) ui.dimW.value=String(o.w);
  if(o.d) ui.dimD.value=String(o.d);
  if(o.h) ui.dimH.value=String(o.h);
  if(o.c!=null && o.c!=="") ui.dimC.value=String(o.c);
  if(o.r) ui.rows.value=String(o.r);
  if(o.rw) ui.rWidth.value=String(o.rw);
  if(o.rd) ui.rodD.value=String(o.rd);
  if(o.fr) ui.frame.value=o.fr;
  // старые ссылки без поля rg — прямая лента
  if(ui.ringD) ui.ringD.value=String(+o.rg||0);
  if(o.col){ state.color=ralOf(o.col);
             setBtnColor("colorDot","colorName",state.color); }
  ui.gradOn.checked=!!+(o.g||0);
  if(o.gc) ui.gradC.value=o.gc;
  if(typeof updateGradBtn==="function") updateGradBtn();
  state.frameRal=(o.frc && o.frc!=="") ? ralOf(o.frc) : null;
  if(typeof updateFrameBtn==="function") updateFrameBtn();
  state.opaque1=!!+(o.op||0);
  state.opaque2=!!+(o.op2!==undefined ? o.op2 : (o.op||0));
  // поле sg старых ссылок игнорируется: провис теперь всегда включён
  state.autoSeed=false;
  state.seed=(+o.v||state.seed)>>>0;
  refreshLabels();
}
const FAV_KEY="vargovFavs";
const favLoad=()=>{ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||"[]"); }
                    catch(e){ return []; } };
const favStore=(a2)=>{ try{ localStorage.setItem(FAV_KEY, JSON.stringify(a2)); }
                       catch(e){} };
function favRender(){
  const list=favLoad();
  document.getElementById("favBox").hidden=!list.length;
  document.getElementById("favList").innerHTML=list.map((f,i)=>
    `<div class="favRow">`
    +(f.t?`<img src="${f.t}" alt="" data-fav-open="${i}" style="cursor:pointer" title="открыть">`:"")
    +`<span class="favTxt">№${f.o.v} · `
    +`${f.o.w}×${f.o.d}×${f.o.h} · ${f.m} пог. м</span>`
    +`<button class="btn3" data-fav-open="${i}">открыть</button>`
    +`<button class="btn3" data-fav-del="${i}" title="удалить">✕</button></div>`).join("");
}
document.getElementById("favList").addEventListener("click",(e)=>{
  const o=e.target.getAttribute("data-fav-open"),
        d=e.target.getAttribute("data-fav-del");
  const list=favLoad();
  if(o!=null && list[+o]){ applyVariant(list[+o].o);
                           rebuild("Открываем избранный вариант…"); }
  if(d!=null){ list.splice(+d,1); favStore(list); favRender(); }
});
// МИНИАТЮРА ИЗБРАННОГО — снимок текущего кадра: центральная область канваса
// 3:2 ужимается в 174×116 JPEG (~4 КБ) — список избранного становится
// узнаваемым с одного взгляда, а 30 записей занимают ~120 КБ localStorage
function favThumb(){
  try{
    const H=Math.round(cv.height*0.86), W=Math.min(cv.width, Math.round(H*1.5));
    const sx=Math.round((cv.width-W)/2), sy=Math.round((cv.height-H)/2);
    const t=document.createElement("canvas");
    t.width=174; t.height=116;
    t.getContext("2d").drawImage(cv, sx, sy, W, H, 0, 0, t.width, t.height);
    return t.toDataURL("image/jpeg", 0.55);
  }catch(e){ return null; }
}
document.getElementById("favAdd").onclick=()=>{
  if(!scene) return;
  const list=favLoad(), o=variantState();
  if(!list.some(f=>JSON.stringify(f.o)===JSON.stringify(o)))
    list.unshift({o, m:state.lastSpec?(state.lastSpec.totalLen/1000).toFixed(1):"?",
                  t:favThumb()});
  favStore(list.slice(0,30)); favRender();
};
document.getElementById("favLink").onclick=()=>{
  const o=variantState(), ps=new URLSearchParams();
  for(const k in o) ps.set(k, o[k]);
  const url=location.href.split("#")[0]+"#"+ps.toString();
  const b=document.getElementById("favLink");
  const ok=()=>{ const t=b.textContent; b.textContent="Скопировано ✓";
                 setTimeout(()=>{ b.textContent=t; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(ok, ()=>prompt("Ссылка на вариант:", url));
  else prompt("Ссылка на вариант:", url);
};
favRender();
// ОБМЕН ВАРИАНТАМИ — ТОЛЬКО ССЫЛКОЙ (решение пользователя): кнопка
// «Ссылка на вариант» несёт состояние целиком, открытие — просто переход
// по ссылке (hash разбирается ниже). Окно ввода номера по клику убрано:
// номер без габаритов и настроек вариант не воспроизводит и путал бы
// (номер остаётся идентификатором в документах и спецификациях)
// открытие по ссылке: параметры варианта в hash применяются до первой сборки
(function(){
  try{
    if(!location.hash || location.hash.length<3) return;
    const ps=new URLSearchParams(location.hash.slice(1));
    if(!ps.get("v")) return;
    const o={}; for(const kv of ps) o[kv[0]]=kv[1];
    applyVariant(o);
  }catch(e){}
})();

/* ============================================================
   ВЫКРОЙКА 1:1 — печатный шаблон каркаса. Центральный контур ленты
   (у однорядной — кант A) разворачивается в прямую полосу с разметкой:
   тики станций трубок, кружки диодов, стрелки тросов, минимальный радиус
   изгиба на участке. Полоса нарезана строками по 180 мм — печать на A4
   в масштабе 100% даёт шаблон истинного размера для стола мастера
   ============================================================ */
document.getElementById("savePat").onclick=()=>{
  if(!scene) return;
  const SEG=180, ROWH=26;
  let html=`<!doctype html><html><head><meta charset="utf-8">`
    +`<title>Выкройка №${state.seed}</title><style>`
    +`@page{size:A4;margin:10mm}`
    +`body{font:10px/1.3 Arial,sans-serif;color:#000;margin:0}`
    +`h2{font-size:13px;margin:6px 0 4px}`
    +`p.note{color:#444;margin:0 0 8px;font-size:9.5px}`
    +`svg{display:block}.row{page-break-inside:avoid}`
    +`</style></head><body>`
    +`<h2>Vargov&reg;Design — выкройка каркаса 1:1 · вариант №${state.seed}`
    +` · габарит ${ui.dimW.value}×${ui.dimD.value}×${ui.dimH.value} мм</h2>`
    +`<p class="note">Печатать в масштабе 100% (не «вписать в страницу»).`
    +` Полоса — центральный контур каркаса, развёрнутый в прямую.`
    +` Тики — станции трубок (шаг ${ROD_STEP.toFixed(1)} мм), кружки — диоды`
    +` (шаг ${LED_PITCH} мм), ▼ — тросы подвеса, R — минимальный радиус`
    +` изгиба на участке (мм).</p>`;
  scene.ribbons.forEach((rb,ri)=>{
    const wirePts=rb.rows===2? rb.centers : rb.railA;
    const n=wirePts.length, step=rb.stepEff;
    const RR=new Array(n).fill(1e9);
    for(let i=1;i<n-1;i++){
      const v1=V.sub(wirePts[i],wirePts[i-1]), v2=V.sub(wirePts[i+1],wirePts[i]);
      const l1=V.len(v1)||1, l2=V.len(v2)||1;
      const a2=Math.acos(Math.max(-1,Math.min(1,V.dot(v1,v2)/(l1*l2))));
      if(a2>1e-6) RR[i]=(l1+l2)/2/a2;
    }
    const cabSet=new Set(rb.cabSt||[]);
    const total=n*step;
    html+=`<h2>Лента ${ri+1} из ${scene.ribbons.length} — `
      +`${(rb.ribbonLen/1000).toFixed(2)} пог. м</h2>`;
    for(let off=0; off<total; off+=SEG){
      const segLen=Math.min(SEG, total-off);
      let s=`<div class="row"><svg width="${(segLen+14).toFixed(1)}mm" `
        +`height="${ROWH}mm" viewBox="0 0 ${(segLen+14).toFixed(1)} ${ROWH}">`;
      s+=`<line x1="7" y1="14" x2="${(7+segLen).toFixed(1)}" y2="14" `
        +`stroke="#000" stroke-width="0.5"/>`;
      s+=`<text x="0.5" y="4.5" font-size="3">${Math.round(off)}–`
        +`${Math.round(off+segLen)} мм</text>`;
      for(let mk=Math.ceil(off/100)*100; mk<=off+segLen; mk+=100){
        const x=7+(mk-off);
        s+=`<line x1="${x}" y1="10.5" x2="${x}" y2="17.5" stroke="#000" `
          +`stroke-width="0.4"/>`
          +`<text x="${x}" y="9" font-size="3.2" text-anchor="middle">`
          +`${(mk/1000).toFixed(1)}</text>`;
      }
      const i0=Math.max(0, Math.floor(off/step)),
            i1=Math.min(n-1, Math.ceil((off+segLen)/step));
      let rmin=1e9;
      for(let i=i0;i<=i1;i++){
        const x=7+(i*step-off);
        if(x<7 || x>7+segLen) continue;
        s+=`<line x1="${x.toFixed(2)}" y1="12.5" x2="${x.toFixed(2)}" `
          +`y2="15.5" stroke="#666" stroke-width="0.25"/>`;
        if(cabSet.has(i))
          s+=`<text x="${x.toFixed(1)}" y="22.5" font-size="4.5" `
            +`text-anchor="middle">&#9660;</text>`;
        rmin=Math.min(rmin, RR[i]);
      }
      if(rb.leds && rb.leds.length)
        for(let mL=Math.ceil(off/LED_PITCH)*LED_PITCH; mL<=off+segLen; mL+=LED_PITCH){
          const x=7+(mL-off);
          s+=`<circle cx="${x}" cy="14" r="1.1" fill="none" stroke="#000" `
            +`stroke-width="0.35"/>`;
        }
      if(rmin<900)
        s+=`<text x="${(7+segLen-1).toFixed(1)}" y="5" font-size="3.4" `
          +`text-anchor="end">R ≈ ${Math.round(rmin)}</text>`;
      s+=`</svg></div>`;
      html+=s;
    }
  });
  html+=`</body></html>`;
  EXP.save(EXP.name("html").replace(".html","-vykroika.html"),
           html, "text/html;charset=utf-8");
};

resize();
syncForms();          // строка формы габарита прячется в «миксе» сразу
buildDeferred();
requestAnimationFrame(loop);

// отладочный хук для автотестов
window.__vargov = {
  bbox: ()=>{ if(!scene) return null;
    const s=state.lastSpec;
    const mM=[1e9,1e9,1e9], xM=[-1e9,-1e9,-1e9];
    for(const rb of scene.ribbons){
      const b=geoBBox(rb);
      for(let k=0;k<3;k++){ mM[k]=Math.min(mM[k],b.min[k]); xM[k]=Math.max(xM[k],b.max[k]); }
    }
    return {box:scene.box, actual:s.bb, rods:s.rods, lenM:s.totalLen/1000, mn:mM, mx:xM}; },
  spec: ()=>state.lastSpec,
  clearance: ()=>{ if(!scene) return null;
    return Object.assign({}, scene.clear, {
            minClear: measureClearance(scene.ribbons),
            minRadius: measureMinRadius(scene.ribbons),
            railRadius: measureRailRadius(scene.ribbons),
            gaps: measureGaps(scene.ribbons)}); },
  sceneInfo: ()=>scene.ribbons.map(rb=>({
    n: rb.centers.length,
    guideN: rb.guideC.length,
    fitScale: +(rb.fitScale||0).toFixed(3),
    cmin: rb.clampMin, cmax: rb.clampMax,
    bb: (()=>{const b=geoBBox(rb); return b.min.map((v,i)=>[Math.round(v),Math.round(b.max[i])]);})(),
  })),
  debugGaps: ()=>{
    const out=[];
    scene.ribbons.forEach((rb,ri)=>{
      const rowsArr=new Map();
      for(const r of rb.rods){
        const key=r.u2>0.1?"up":"dn";
        if(!rowsArr.has(key)) rowsArr.set(key,[]);
        rowsArr.get(key)[r.st]=r;
      }
      for(const [key,arr] of rowsArr){
        for(let i=0;i+1<arr.length;i++){
          const r1=arr[i], r2=arr[i+1];
          if(!r1||!r2) continue;
          for(let t=0;t<=4;t++){
            const u=t/4;
            const dx=(r1.b[0]+(r1.a[0]-r1.b[0])*u)-(r2.b[0]+(r2.a[0]-r2.b[0])*u);
            const dy=(r1.b[1]+(r1.a[1]-r1.b[1])*u)-(r2.b[1]+(r2.a[1]-r2.b[1])*u);
            const dz=(r1.b[2]+(r1.a[2]-r1.b[2])*u)-(r2.b[2]+(r2.a[2]-r2.b[2])*u);
            const g=Math.hypot(dx,dy,dz)-ROD_D;
            if(g<1 || g>10){
              const dC=V.len(V.sub(rb.centers[i+1],rb.centers[i]));
              out.push({ri, row:key, st:i, u, gap:+g.toFixed(2), dC:+dC.toFixed(2),
                        nSt:rb.centers.length,
                        lenA:+r1.len.toFixed(1), lenB:+r2.len.toFixed(1)});
            }
          }
        }
      }
    });
    out.sort((a,b)=>a.gap-b.gap);
    return {worst:out.slice(0,10), count:out.length};
  },
  set: (id,v)=>{ if(ui[id]) ui[id].value=v; refreshLabels(); buildScene(); },
  apply: (o)=>{ for(const k in o){ if(ui[k]) ui[k].value=o[k]; } refreshLabels(); buildScene(); },
  regen: ()=>{ state.autoSeed=false; state.seed=(state.seed*1664525+1013904223)>>>0; buildScene(); needRedraw=true; },
  raw: ()=>scene,
};
</script>
</body>
</html>
