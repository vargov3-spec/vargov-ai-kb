  const apply=(sc)=>{ for(const rb of ribbons){
    if(!rb.__csag) continue;
    const n=rb.centers.length;
    for(const r of rb.rods){
      const dy=Math.min(150, rb.__csag[Math.min(n-1,r.st)])*sc;
      if(dy>0.2) r.b[1]-=dy;
    }
    for(let i=0;i<n;i++) rb.centers[i][1]-=Math.min(150, rb.__csag[i])*sc;
  } };
  const viol=()=>{
    let v=0;
    forEachClosePair(ribbons, CLEAR_FAR, (A,B)=>{
      const near=A.ri===B.ri && Math.abs(A.r.st-B.r.st)<=NEAR_WIN;
      if(closestSegSeg(A.r.a,A.r.b,B.r.a,B.r.b)[0] <
         (near? CLEAR_NEAR : CLEAR_FAR)) v++;
    });
    return v;
  };
  for(const sc of [1, 0.5, 0.25]){
    apply(sc);
    if(viol()===0) return sc;
    restore();
  }
  return 0;
}

/* ОБОРАЧИВАНИЕ ЛЕНТЫ В КОЛЬЦО. Прямая заготовка длиной πD оборачивается
   вокруг вертикальной оси: x → угол по фактическому спану заготовки
   (плюс один шаг станций, чтобы конец не налезал на начало — стык
   замыкается тем же примыканием, что и между отрезками), z → радиус.
   Провисы вертикальны (y не трогаем), стержни остаются хордами — при
   шаге станций ~12 мм на радиусе 1000+ искажения меньше миллиметра.
   Возвращает число нарушений зазоров после оборачивания (внутренняя
   сторона кольца сжимает гребёнку — сжатие ограничено глубиной D/5) */
function wrapRing(D){
  if(!scene || !scene.ribbons.length) return 0;
  const rr=scene.ribbons;
  let x0=1e9, x1=-1e9;
  for(const rb of rr) for(const p of rb.centers){
    x0=Math.min(x0, p[0]); x1=Math.max(x1, p[0]); }
  const stepM=rr[0].stepEff||11.6;
  const W=Math.max(1, x1-x0)+stepM;
  const dEff=Math.round(D/5), R=D/2;
  const zMid=(scene.box.d||dEff)/2;
  const C=R+dEff/2+60;
  // одна точка может числиться в нескольких списках (guideC делит объекты
  // с centers, якоря тросов — с верхами станций) — оборачиваем каждую
  // ровно один раз
  const seen=new Set();
  const tf=(p)=>{
    if(seen.has(p)) return;
    seen.add(p);
    const th=(p[0]-x0)/W*Math.PI*2;
    const rad=R+(p[2]-zMid);
    p[0]=C+rad*Math.sin(th);
    p[2]=C-rad*Math.cos(th);
  };
  for(const rb of rr){
    for(const arr of [rb.centers, rb.railA, rb.railB, rb.guideC])
      if(arr) for(const p of arr) tf(p);
    for(const r of rb.rods){ tf(r.a); tf(r.b); }
    if(rb.leds) for(const p of rb.leds) tf(p);
    if(rb.cabs) for(const c of rb.cabs){ tf(c.to); tf(c.from); }
    rb.__gradMask=null;
  }
  let vio=0;
  forEachClosePair(rr, CLEAR_FAR, (A,B)=>{
    const near=A.ri===B.ri && Math.abs(A.r.st-B.r.st)<=NEAR_WIN;
    if(closestSegSeg(A.r.a,A.r.b,B.r.a,B.r.b)[0] <
       (near? CLEAR_NEAR : CLEAR_FAR)) vio++;
  });
  const S=Math.round(2*C);
  scene.box={w:S, h:scene.box.h, d:S};
  scene.ring=D;
  camera.fitTo(scene.box);
  needRedraw=true;
  return vio;
}

/* РАЗДВИЖКА ГРЕБЁНКИ. У швов сварки слоёв станции местами разрежены
   вдвое-втрое против шага (замер 4400/6000: щели 23-35 мм при шаге 11.6)
   — в гребёнке стержней читается пропуск. Стержни крепятся к контурам
   свободной петлёй лески, поэтому могут скользить ВДОЛЬ ленты: станции
   окна ±7 переставляются равномерно по дуговой длине полилинии центров
   (края окна закреплены), канты, стержни и якоря тросов следуют дельтой
   своей станции. Пропуск 2х разбирается на ~14 шагов по ~1.07х.
   Приёмка окна: щель сжалась до <=1.5 шага, зазоры и бокс целы — иначе
   полный откат */
function spreadGaps(ribbons, box){
  const lim3=[box.w, box.h, box.d];
  let fixed=0;
  for(const rb of ribbons){
    const C=rb.centers, n=C.length;
    if(!C || n<10) continue;
    const step=rb.stepEff||11.6;
    const bySt={};
    for(const r of rb.rods)(bySt[r.st]=bySt[r.st]||[]).push(r);
    for(let i=1;i<n;i++){
      const d0=Math.hypot(C[i][0]-C[i-1][0],C[i][1]-C[i-1][1],C[i][2]-C[i-1][2]);
      if(d0<=step*1.7) continue;
      const W=7;
      const i0=Math.max(0,i-W), i1=Math.min(n-1,i+W-1);
      if(i1-i0<4) continue;
      const bakC=[], bakA=[], bakB=[], bakR=[], bakCab=[];
      for(let k=i0;k<=i1;k++){
        bakC.push(C[k].slice());
        bakA.push(rb.railA && rb.railA[k]? rb.railA[k].slice():null);
        bakB.push(rb.railB && rb.railB[k]? rb.railB[k].slice():null);
        for(const r of bySt[k]||[]) bakR.push({r, a:r.a.slice(), b:r.b.slice()});
      }
      if(rb.cabs) for(const c of rb.cabs)
        if(c.st>i0 && c.st<i1) bakCab.push({c, to:c.to.slice(), from:c.from.slice()});
      // дуговая параметризация старой полилинии окна
      const s=[0];
      for(let k=i0+1;k<=i1;k++)
        s.push(s[s.length-1]+Math.hypot(
          bakC[k-i0][0]-bakC[k-1-i0][0],
          bakC[k-i0][1]-bakC[k-1-i0][1],
          bakC[k-i0][2]-bakC[k-1-i0][2]));
      const L=s[s.length-1];
      const posAt=(t)=>{
        let k=1; while(k<s.length && s[k]<t) k++;
        if(k>=s.length) k=s.length-1;
        const u=(t-s[k-1])/Math.max(1e-6, s[k]-s[k-1]);
        const A=bakC[k-1], B2=bakC[k];
        return [A[0]+(B2[0]-A[0])*u, A[1]+(B2[1]-A[1])*u, A[2]+(B2[2]-A[2])*u];
      };
      const restore=()=>{
        let bi=0;
        for(let k=i0;k<=i1;k++){
          C[k][0]=bakC[bi][0]; C[k][1]=bakC[bi][1]; C[k][2]=bakC[bi][2];
          if(bakA[bi] && rb.railA[k]){ rb.railA[k][0]=bakA[bi][0];
            rb.railA[k][1]=bakA[bi][1]; rb.railA[k][2]=bakA[bi][2]; }
          if(bakB[bi] && rb.railB[k]){ rb.railB[k][0]=bakB[bi][0];
            rb.railB[k][1]=bakB[bi][1]; rb.railB[k][2]=bakB[bi][2]; }
          bi++;
        }
        for(const bk of bakR){
          bk.r.a[0]=bk.a[0]; bk.r.a[1]=bk.a[1]; bk.r.a[2]=bk.a[2];
          bk.r.b[0]=bk.b[0]; bk.r.b[1]=bk.b[1]; bk.r.b[2]=bk.b[2];
        }
        for(const bk of bakCab){
          bk.c.to[0]=bk.to[0]; bk.c.to[1]=bk.to[1]; bk.c.to[2]=bk.to[2];
          bk.c.from[0]=bk.from[0]; bk.c.from[1]=bk.from[1]; bk.c.from[2]=bk.from[2];
        }
      };
      // стержни у краёв щели часто уже стоят на минимальном капсульном
      // зазоре серединами (веер шва) — полное сжатие рушит ближний лимит.
      // Дельта пробуется в масштабе: сколько пускают зазоры, столько щель
      // и сжимается (0.55 даёт ~1.5 шага вместо 2)
      let done=false;
      for(const sc of [1, 0.55, 0.35]){
        const moved=[];
        for(let k=i0+1;k<i1;k++){
          const P=posAt(L*(k-i0)/(i1-i0));
          const dv=[(P[0]-bakC[k-i0][0])*sc, (P[1]-bakC[k-i0][1])*sc,
                    (P[2]-bakC[k-i0][2])*sc];
          if(Math.hypot(...dv)<0.3) continue;
          C[k][0]=bakC[k-i0][0]+dv[0]; C[k][1]=bakC[k-i0][1]+dv[1];
          C[k][2]=bakC[k-i0][2]+dv[2];
          for(const arr of [rb.railA, rb.railB])
            if(arr && arr[k]){ arr[k][0]+=dv[0]; arr[k][1]+=dv[1]; arr[k][2]+=dv[2]; }
          for(const r of bySt[k]||[]){
            for(const p of [r.a, r.b]){ p[0]+=dv[0]; p[1]+=dv[1]; p[2]+=dv[2]; }
            moved.push(r);
          }
          if(rb.cabs) for(const c of rb.cabs) if(c.st===k){
            c.to[0]+=dv[0]; c.to[1]+=dv[1]; c.to[2]+=dv[2];
            c.from[0]+=dv[0]; c.from[2]+=dv[2];   // потолочная точка — над якорем
          }
        }
        const d1=Math.hypot(C[i][0]-C[i-1][0],C[i][1]-C[i-1][1],C[i][2]-C[i-1][2]);
        let ok=d1<=d0-3;   // осмысленное улучшение (полный масштаб: <=1.1 шага)
        if(ok){
          chk:
          for(const r of moved){
            for(const p2 of [r.a, r.b]) for(let x=0;x<3;x++)
              if(p2[x]<-ROD_R-6 || p2[x]>lim3[x]+ROD_R+6){ ok=false; break chk; }
            for(const rb2 of ribbons) for(const q of rb2.rods){
              if(q===r) continue;
              if(Math.abs(q.a[0]-r.a[0])>420 && Math.abs(q.b[0]-r.b[0])>420) continue;
              const near=(rb2===rb) && Math.abs(q.st-r.st)<=NEAR_WIN;
              if(closestSegSeg(r.a,r.b,q.a,q.b)[0] <
                 (near? CLEAR_NEAR : CLEAR_FAR)){ ok=false; break chk; }
            }
          }
        }
        if(ok){ done=true; fixed++; break; }
        restore();
      }
      void done;
    }
  }
  return fixed;
}

/* СГЛАЖИВАНИЕ УГЛОВ КАНТОВ — острых углов на проволоке не бывает
   (правило пользователя: «это физически невозможно»). Сварка мостов и
   локальные правки оставляли на кантах углы 30-132°. Финальный проход:
   каждый угол круче 32° разглаживается лапласианом в окне ±3 станции
   (края окна закреплены), торцы стержней ряда следуют за кантом той же
   дельтой. Приёмка окна: угол уменьшился, капсульные зазоры и бокс
   соблюдены — иначе откат. Два прохода по сцене */
function smoothRails(ribbons, box){
  const lim3=[box.w, box.h, box.d];
  const angAt=(P,i)=>{
    if(i<1 || i+1>=P.length) return 0;
    const v1=[P[i][0]-P[i-1][0],P[i][1]-P[i-1][1],P[i][2]-P[i-1][2]];
    const v2=[P[i+1][0]-P[i][0],P[i+1][1]-P[i][1],P[i+1][2]-P[i][2]];
    const l1=Math.hypot(...v1), l2=Math.hypot(...v2);
    if(l1<3||l2<3) return 0;
    return Math.acos(Math.max(-1,Math.min(1,
      (v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2])/(l1*l2))))*180/Math.PI;
  };
  // радиус дуги в окне ±2 станции: сумма поворотов к длине дуги. Ловит
  // «шпильки», где каждый отдельный угол мал, а полный поворот крут:
  // проволока каркаса не гнётся круче нескольких сантиметров радиуса
  const arcAt=(P,i)=>{
    if(i<3 || i+3>=P.length) return [0,1e9];
    let ang=0, arc=0;
    for(let j=i-2;j<=i+2;j++)
      ang+=angAt(P,j)*Math.PI/180;
    for(let j=i-2;j<=i+3;j++)
      arc+=Math.hypot(P[j][0]-P[j-1][0],P[j][1]-P[j-1][1],P[j][2]-P[j-1][2]);
    return [ang, arc/Math.max(ang,1e-6)];
  };
  let fixed=0;
  for(let pass=0; pass<2; pass++)
  for(const rb of ribbons){
    const n=rb.centers.length, twoRow=!!rb.dirUp;
    const mapA={}, mapB={};
    for(const r of rb.rods){
      const st=Math.min(n-1,r.st);
      if(twoRow){ if(r.u2>0) mapA[st]=r; else mapB[st]=r; }
      else { mapA[st]=r; mapB[st]=r; }
    }
    // контуры: кант A (торцы a ряда A), кант B, центральный (крепления b
    // обоих рядов — только у двурядной)
    const contours=[
      {P:rb.railA, rods:(k)=>mapA[k]?[[mapA[k], twoRow?"a":"a"]]:[]},
      {P:rb.railB, rods:(k)=>mapB[k]?[[mapB[k], twoRow?"a":"b"]]:[]},
    ];
    if(twoRow) contours.push(
      {P:rb.centers, rods:(k)=>[mapA[k],mapB[k]].filter(Boolean).map(r=>[r,"b"])});
    for(const co of contours){
      const rail=co.P;
      if(!rail) continue;
      for(let i=1;i+1<rail.length;i++){
        const a0=angAt(rail,i);
        if(a0<=32) continue;
        const i0w=Math.max(1,i-3), i1w=Math.min(rail.length-2,i+3);
        const bakRail=[], bakRod=[];
        for(let k=i0w;k<=i1w;k++){
          bakRail.push(rail[k].slice());
          for(const [r] of co.rods(k)) bakRod.push({r, a:r.a.slice(), b:r.b.slice()});
        }
        for(let it=0; it<20; it++){
          for(let k=i0w+1;k<i1w;k++)
            for(let x=0;x<3;x++)
              rail[k][x]+=0.5*(rail[k-1][x]+rail[k+1][x]-2*rail[k][x]);
          if(angAt(rail,i)<26) break;
        }
        // торцы/крепления стержней следуют за контуром той же дельтой
        const moved=[];
        for(let k=i0w;k<=i1w;k++){
          const d0=bakRail[k-i0w];
          const dv=[rail[k][0]-d0[0], rail[k][1]-d0[1], rail[k][2]-d0[2]];
          if(Math.hypot(...dv)<0.3) continue;
          for(const [r, end] of co.rods(k)){
            const tip=r[end];
            tip[0]+=dv[0]; tip[1]+=dv[1]; tip[2]+=dv[2];
            moved.push(r);
          }
        }
        let ok=angAt(rail,i) < Math.max(26, a0-5);
        if(ok){
          chk:
          for(const r of moved){
            for(const p2 of [r.a, r.b]) for(let x=0;x<3;x++)
              if(p2[x]<-ROD_R-6 || p2[x]>lim3[x]+ROD_R+6){ ok=false; break chk; }
            for(const rb2 of ribbons) for(const q of rb2.rods){
              if(q===r) continue;
              if(Math.abs(q.a[0]-r.a[0])>420 && Math.abs(q.b[0]-r.b[0])>420) continue;
              const near=(rb2===rb) && Math.abs(q.st-r.st)<=NEAR_WIN;
              if(closestSegSeg(r.a,r.b,q.a,q.b)[0] <
                 (near? CLEAR_NEAR : CLEAR_FAR)){ ok=false; break chk; }
            }
          }
        }
        if(!ok){
          // стержни двигать нельзя — контур разглаживается сам по себе.
          // Отход канта от торцов ограничен люфтом петли лески: 8 мм,
          // больше — торцы заметно вылетают из контура (замечание
          // пользователя), тогда полный откат
          for(const bk of bakRod){ bk.r.a=bk.a; bk.r.b=bk.b; }
          let det=0;
          for(let k=i0w;k<=i1w;k++)
            det=Math.max(det, Math.hypot(
              rail[k][0]-bakRail[k-i0w][0],
              rail[k][1]-bakRail[k-i0w][1],
              rail[k][2]-bakRail[k-i0w][2]));
          let railOk=det<=8 && angAt(rail,i)<a0-5;
          if(railOk) for(let k=i0w;k<=i1w && railOk;k++)
            for(let x=0;x<3;x++)
              if(rail[k][x]<-ROD_R-6 || rail[k][x]>lim3[x]+ROD_R+6) railOk=false;
          if(!railOk){
            for(let k=i0w;k<=i1w;k++){ rail[k][0]=bakRail[k-i0w][0];
              rail[k][1]=bakRail[k-i0w][1]; rail[k][2]=bakRail[k-i0w][2]; }
          } else fixed++;
        } else fixed++;
      }
      // ЭТАП «ШПИЛЬКИ»: крутая дуга без единичного залома — полный поворот
      // в окне ±2 при радиусе меньше 48 мм. Лапласиан узкого окна тут
      // бессилен (полный поворот никуда не девается), поэтому окно шире —
      // ±8 станций: тот же поворот распределяется по большей длине дуги и
      // радиус растёт. Стержни следуют за контуром той же дельтой (леска),
      // приёмка — зазоры, бокс и растяжение стержня ≤10 мм; при отказе
      // дельта пробуется в масштабе 0.5 и 0.25
      for(let i=3;i+3<rail.length;i++){
        const [ang0, rad0]=arcAt(rail,i);
        if(ang0<0.7 || rad0>=48) continue;
        const W=8, i0w=Math.max(1,i-W), i1w=Math.min(rail.length-2,i+W);
        const bakRail=[], bakRod=[];
        for(let k=i0w;k<=i1w;k++){
          bakRail.push(rail[k].slice());
          for(const [r] of co.rods(k)) bakRod.push({r, a:r.a.slice(), b:r.b.slice()});
        }
        for(let it=0; it<40; it++){
          for(let k=i0w+1;k<i1w;k++)
            for(let x=0;x<3;x++)
              rail[k][x]+=0.5*(rail[k-1][x]+rail[k+1][x]-2*rail[k][x]);
          if(arcAt(rail,i)[1]>=56) break;
        }
        const tgtRail=[];
        for(let k=i0w;k<=i1w;k++) tgtRail.push(rail[k].slice());
        let applied=false;
        for(const sc of [1, 0.5, 0.25]){
          // контур в масштабе дельты, стержни следом
          for(const bk of bakRod){
            bk.r.a[0]=bk.a[0]; bk.r.a[1]=bk.a[1]; bk.r.a[2]=bk.a[2];
            bk.r.b[0]=bk.b[0]; bk.r.b[1]=bk.b[1]; bk.r.b[2]=bk.b[2];
          }
          const moved=[];
          for(let k=i0w;k<=i1w;k++){
            const b0=bakRail[k-i0w], t0=tgtRail[k-i0w];
            const dv=[(t0[0]-b0[0])*sc,(t0[1]-b0[1])*sc,(t0[2]-b0[2])*sc];
            rail[k][0]=b0[0]+dv[0]; rail[k][1]=b0[1]+dv[1]; rail[k][2]=b0[2]+dv[2];
            if(Math.hypot(...dv)<0.3) continue;
            for(const [r, end] of co.rods(k)){
              const tip=r[end];
              tip[0]+=dv[0]; tip[1]+=dv[1]; tip[2]+=dv[2];
              moved.push(r);
            }
          }
          const rad1=arcAt(rail,i)[1];
          let ok=rad1>=Math.min(52, rad0+8);
          if(ok){
            chk2:
            for(const r of moved){
              let bk0=null;
              for(const bk of bakRod) if(bk.r===r){ bk0=bk; break; }
              if(bk0){
                const L0=Math.hypot(r.a[0]-r.b[0],r.a[1]-r.b[1],r.a[2]-r.b[2]);
                const L1=Math.hypot(bk0.a[0]-bk0.b[0],bk0.a[1]-bk0.b[1],bk0.a[2]-bk0.b[2]);
                if(Math.abs(L0-L1)>10){ ok=false; break chk2; }
              }
              for(const p2 of [r.a, r.b]) for(let x=0;x<3;x++)
                if(p2[x]<-ROD_R-6 || p2[x]>lim3[x]+ROD_R+6){ ok=false; break chk2; }
              for(const rb2 of ribbons) for(const q of rb2.rods){
                if(q===r) continue;
                if(Math.abs(q.a[0]-r.a[0])>420 && Math.abs(q.b[0]-r.b[0])>420) continue;
                const near=(rb2===rb) && Math.abs(q.st-r.st)<=NEAR_WIN;
                if(closestSegSeg(r.a,r.b,q.a,q.b)[0] <
                   (near? CLEAR_NEAR : CLEAR_FAR)){ ok=false; break chk2; }
              }
            }
          }
          if(ok){ applied=true; fixed++; break; }
        }
        if(!applied){
          for(const bk of bakRod){ bk.r.a=bk.a; bk.r.b=bk.b; }
          for(let k=i0w;k<=i1w;k++){ rail[k][0]=bakRail[k-i0w][0];
            rail[k][1]=bakRail[k-i0w][1]; rail[k][2]=bakRail[k-i0w][2]; }
        }
      }
    }
  }
  return fixed;
}

function volCov(ribbons, box){
  const NGX=5, NGY=3, NGZ=3, cellN=NGX*NGY*NGZ;
  const cellHit=new Uint8Array(cellN);
  for(const rb of ribbons){
    const pts=rb.centers||rb.guideC; if(!pts) continue;
    for(const p of pts){
      const ix=Math.max(0,Math.min(NGX-1,Math.floor(p[0]/Math.max(1,box.w)*NGX)));
      const iy=Math.max(0,Math.min(NGY-1,Math.floor(p[1]/Math.max(1,box.h)*NGY)));
      const iz=Math.max(0,Math.min(NGZ-1,Math.floor(p[2]/Math.max(1,box.d)*NGZ)));
      cellHit[(ix*NGY+iy)*NGZ+iz]=1;
    }
  }
  let hit=0; for(let i=0;i<cellN;i++) hit+=cellHit[i];
  return hit/cellN;
}
function fillGate(ribbons, box, totLen){
  // правило производства: не меньше 2 пог. м на метр главного габарита,
  // а при заданном вручную метраже — не меньше 85% от заказанного
  if(box && totLen!==undefined){
    const need=1.9*Math.max(box.w, box.h, box.d);
    if(totLen < need) return false;
  }
  return fillGateGeom(ribbons);
}
function fillGateGeom(ribbons){
  for(const rb of ribbons){
    if(!rb.giMap || !rb.guideC || rb.guideC.length<8) continue;
    const cov=rb.giMap[rb.giMap.length-1]/Math.max(1, rb.guideC.length-2);
    if(cov<0.9) return false;                  // направляющая не доложена
    if(rb.covPre!==undefined && rb.covPre<0.9) return false;   // сорвался предмарш
    // сильная утяжка сама по себе не брак: вписывание идёт в две стороны и
    // может сначала сжать направляющую, а потом растянуть композицию до
    // граней габарита. Реальный критерий — заполнение габарита (ворота в
    // buildScene); здесь отсекается только явное схлопывание сетки строк
    if(rb.shrK!==undefined && rb.shrK<0.72) return false;
    // вылет предмарша сам по себе не брак: предмарш идёт без рулей, а
    // стены держит второй марш — бракуем только по факту (утяжка и обрыв)
    if((rb.escapes||0)>2 || (rb.escPre||0)>2) return false;    // цель прыгала
    if(rb.endReason && rb.endReason.indexOf('stall')===0) return false;
  }
  return true;
}

/* ============================================================
   Сцена: сборка композиции из нескольких лент + подвесы + LED
   ============================================================ */
let scene = null;

/* монотонное время: только для замеров времени сборки в консоли.
   ГЕОМЕТРИЯ ОТ ВРЕМЕНИ НЕ ЗАВИСИТ: раньше лестница, страховка и второй проход
   вписывания обрывались по бюджету, и один и тот же НОМЕР ВАРИАНТА давал на
   разных машинах разные композиции — на медленной бюджет срезал перебор
   раньше. Теперь все перечисленные переборы ограничены только числом
   попыток, и номер варианта воспроизводится всюду одинаково */
const perfNow = ()=> (window.performance && performance.now) ? performance.now() : Date.now();
const BUILD_BUDGET = 9000;
let buildDeadline = 0;
// МИНИМАЛЬНОЕ ПОКРЫТИЕ ОБЪЁМА для «микса» (доля клеток сетки 5×3×3, через
// которые прошла лента). Ниже этого порога вариант считается вырожденным:
// лента идёт одной прядью, объём пустой. Значение — по замеру (см. README)
const COV_MIN = 0.50;

function buildScene(){
  const tStart = perfNow();
  buildDeadline = tStart + BUILD_BUDGET;
  // КОЛЬЦО (по просьбе пользователя): лента идёт по кругу Ø2000-4000.
  // Заготовка строится ПРЯМОЙ лентой длиной πD со всей штатной механикой
  // — нарезка на отрезки, невидимые стыки, провисы, раздвижка, ворота
  // качества, — затем оборачивается вокруг вертикальной оси (wrapRing).
  // Стык начала и конца замыкает круг тем же примыканием, что и между
  // отрезками. Радиальная глубина кольца — пятая часть диаметра: глубже
  // внутренняя сторона кольца сжимала бы гребёнку сильнее допуска зазоров
  const ringD=(ui.ringD && ui.plast.value!=="edge") ? (+ui.ringD.value||0) : 0;
  if(ringD && !state.ringBuild){
    state.ringBuild=1;
    const sw=ui.dimW.value, sd=ui.dimD.value;
    ui.dimW.value=String(Math.round(Math.PI*ringD));
    ui.dimD.value=String(Math.round(ringD/5));
    try{
      // оборачивание сжимает зазоры на внутренней стороне кольца — при
      // нарушениях полного скана вариант пересобирается с другим зерном
      for(let tr=0;;tr++){
        buildScene();
        const vio=wrapRing(ringD);
        if(vio===0 || tr>=2) break;
        state.autoSeed=false;
        state.seed=(state.seed*1664525+1013904223)>>>0;
      }
    } finally {
      ui.dimW.value=sw; ui.dimD.value=sd; state.ringBuild=0;
    }
    updateSpec();
    return;
  }
  const box = {
    w:+ui.dimW.value || 2400,
    h:+ui.dimH.value || 800,
    d:+ui.dimD.value || 900,
  };
  // одна лента, одна форма («Поток (винт)») и насыщенность 1× —
  // выбора в интерфейсе нет
  // ДЛИННАЯ ЛЕНТА РАЗБИВАЕТСЯ НА ОТРЕЗКИ ~5 ПОГ. М (решение пользователя:
  // это упрощает и генерацию, и монтаж на месте). Оценивается метраж по
  // правилу производства (2.05 пог. м на метр длины с поправкой на ширину);
  // если он больше ~6.5 м, композиция собирается из 2-4 лент-отрезков,
  // каждая в своём отсеке по длине. Одной лентой вытянутый габарит и не
  // строился: марш обрывался на трети длины (замер 4400×900×800 — все
  // попытки nofit, показывалась страховочная змейка 5.2 пог. м)
  // число отрезков — из ЧЕСТНОЙ оценки правила метража (та же формула, что
  // в генераторе, с учётом ширины ленты): грубая оценка без рядности давала
  // три отрезка по 3.9 м там, где должно быть два по ~5.8 (замечание
  // пользователя на 4400×900×800 двухрядной)
  const dimsSrt=[+ui.dimW.value||2400, +ui.dimH.value||800, +ui.dimD.value||900]
                .sort((q,z)=>z-q);
  const wRuleEst=1+0.55*Math.max(-0.35,(dimsSrt[1]-700)/700);
  const rwEst=(+ui.rWidth.value||150)*(+ui.rows.value===2?2:1);
  const wKMEst=Math.max(0.5, Math.min(1.8, 300/rwEst));
  const targetEst=Math.max(2.05*dimsSrt[0]*wRuleEst,
                           2.163*dimsSrt[0]*wKMEst);   // мм ленты по правилу
  // нарезка — для боксов, где марш одной лентой рвётся или тесен:
  // (1) ВЫТЯНУТЫХ ПО ШИРИНЕ (>3 м): отсеки режутся по оси X, число — по
  //     длине бокса (отсек ~2.2 м, как эталонный), а не по метражу;
  // (2) ГЛУБОКИХ (глубина ≥1000, не вертикальных): винт одной пряди на
  //     сильно вытянутом сечении глобально тесен — все попытки либо с
  //     касаниями 355-667, либо однопрядные с покрытием 0.42 (жалоба
  //     пользователя «не приемлемо» на 2400×1200×800). Отсеки режутся
  //     ПО ГЛУБИНЕ на слои стандартных пропорций (слой 550-650 мм).
  // Эталонный 2400×900×800 не нарезается. ПРАВИЛО ПОЛЬЗОВАТЕЛЯ:
  // вертикальная композиция «микс» — всегда один отрезок
  const dimWv=+ui.dimW.value||2400, dimDv=+ui.dimD.value||900,
        dimHv=+ui.dimH.value||800;
  let lanes=1, sliceAxis=0;
  if(ui.plast.value!=="edge"){
    if(dimWv>3000 && dimWv>=dimsSrt[0] && targetEst>6500){
      lanes=Math.max(2, Math.min(4, Math.round(dimWv/2200)));
      sliceAxis=0;
    } else if(dimDv>=1000 && dimHv<Math.max(dimWv,dimDv)){
      lanes=Math.max(2, Math.min(3, Math.round(dimDv/580)));
      sliceAxis=2;
    }
  }
  // ЗАКРЕПЛЁННАЯ КОМПОЗИЦИЯ ПО УМОЛЧАНИЮ: своё зерно на каждую рядность
  // «микса» и своё — на каждую форму «на ребро» (ключ «edge_<форма>»).
  // Закрепление действует, пока не нажата кнопка генерации: после неё идут
  // случайные варианты, а переключение пластики или формы снова показывает
  // закреплённый вариант
  if(state.autoSeed){
    const sp=SEED_PINNED[(ui.plast.value==="edge")
                         ? ("edge_"+ui.form.value)
                         : (+ui.rows.value===1?1:2)];
    if(sp!==undefined) state.seed=sp;
  }
  const rodLen = ROD_LENGTHS.indexOf(+ui.rWidth.value)>=0 ? +ui.rWidth.value : 300;
  setRodD(+ui.rodD.value===8 ? 8 : 10);   // диаметр трубки → шаг и допуски
  const params = {
    style: "chaos", // единственный стиль: хаотичное заполнение объёма
    box,
    // пластика фиксирована: выверенные значения, при которых композиция
    // живая (волны, скрутка, складка) и всегда проходима маршем
    ampl: 0.62,
    twistAmt: 0.46,
    // складка наклоняет ряды, а наклон рядов ограничивает радиус изгиба
    // как OP_SLACK/(полширина·sin α): у широкой ленты та же складка душит
    // изгиб вдвое сильнее, поэтому амплитуда складки обратна полуширине
    // складка = независимое положение центрального контура. 0.22 — по
    // замеру лучший компромисс: центр отходит от середины кантов на
    // 19–60 мм, и при этом композиция строится с первой-второй попытки
    // СКЛАДКА (независимое положение центрального контура) — только для
    // «микса»: там лента лежит плашмя и середина физически провисает.
    // В пластике «на ребро» контуры вертикальны, и наклон рядов читался
    // волной по кантам — этого быть не должно
    foldK: (+ui.rows.value===2 && ui.plast.value!=="edge" ? 0.60 : 0),
    // ШИРИНА ЛЕНТЫ = длина стержня × число рядов. В двурядной ленте два
    // ряда стержней по 300 мм дают ленту 600 мм; центральная проволока —
    // граница между рядами, ряды независимы друг от друга
    rodLen,
    ribbonW: rodLen*(+ui.rows.value===2 ? 2 : 1),
    rows: +ui.rows.value,
    // ФОРМА: либо силуэт габарита (цилиндр, пирамида, ромб), либо
    // силуэт В ПЛАНЕ («plan_имя») — тогда спуск цилиндрический, а витки
    // несутся по выбранному контуру сверху
    form: (ui.form.value.indexOf("plan_")===0 ? "cyl"
           : ui.form.value.indexOf("c_")===0 ? "cyl"
           : (FORMS[ui.form.value] ? ui.form.value : "box")),
    // КОНЦЕПТ-ФОРМА («c_имя»): особый вид генерации «на ребро» — см.
    // conceptGuide. Силуэт габарита у них цилиндр (у «волны-лежака» — сам
    // габарит), а геометрию строит собственный генератор
    concept: (ui.form.value.indexOf("c_")===0 ? ui.form.value.slice(2) : null),
    plan: (ui.form.value.indexOf("plan_")===0
           && PLAN_SHAPES[ui.form.value.slice(5)] ? ui.form.value.slice(5) : "circle"),   // форма габарита
    plast: (ui.plast.value==="edge" ? "edge" : "mix"),      // пластика ленты
    lengthK: 1.0,
    lanes,
  };
  // Каждая лента живёт в своём «слое» габарита (слои разделены зазором),
  // поэтому пересечь другую ленту она не может по построению.
  // Спирали слоятся по высоте, остальные стили — по глубине.
  // Внутри ленты самопересечения разводит релаксация; при неудаче —
  // новый вариант, дальше постепенно снижаем насыщенность.
  // сколько заходов винта влезает в габарит: жилы разнесены по ОСИ
  // винта на шаг_витка/lanes, поэтому решает не сечение, а длина —
  // на каждую жилу нужен свой участок хода шириной «лента + воздух»
  // лестница всегда строит ОДНУ ленту: длинные габариты нарезает на
  // отсеки отдельный путь ниже (две-три ленты по всему объёму дрались за
  // место — 2700-4700 касаний и 107 с; двухпрядная лестница с плетением
  // на глубоком боксе замерена ещё хуже: 1886-3156 касаний, до 225 с)
  const lanesFit=1;
  let ribbons=null, clear=null, best=null, bestClean=null;
  const targetLen=params.lengthK*2100;
  window.__ladder=[];
  // КОНЦЕПТ-ФОРМЫ СОБИРАЮТСЯ НАПРЯМУЮ, БЕЗ ЛЕСТНИЦЫ. Их геометрия
  // детерминирована (кольца, каскад, ДНК...): правило метража и ворота
  // заполнения не применяются — силуэт и есть замысел. При касаниях —
  // до пяти попыток со снижением плотности, касания в итоге не показываются
  let conceptBuilt=false;
  if(params.plast==="edge" && params.concept && CONCEPT_DIRECT[params.concept]){
    // у «гироскопа» число колец растёт с диаметром композиции:
    // по кольцу на каждые ~500 мм радиуса, от 3 до 9
    const nL=(params.concept==="rings")
      ? Math.max(3, Math.min(9, Math.floor((Math.min(box.w,box.d)/2-25)/500)+1))
      : (CONCEPT_LANES[params.concept]||1);
    let bestC=null;
    for(let cs=0; cs<5; cs++){
      const pC=Object.assign({}, params, {lanes:nL, densK:Math.pow(0.87,cs)});
      const rr=[]; let okC=true;
      for(let i=0;i<nL;i++){
        const rb=buildRibbon(pC, (state.seed+cs*7717)>>>0, i);
        rb.clampMin=[0,0,0]; rb.clampMax=[box.w,box.h,box.d];
        if(!rb.fillMode) marchRibbon(rb);
        if(!rb.fitScale){ okC=false; break; }
        rr.push(rb);
      }
      if(!okC){ window.__ladder.push(['c'+cs,'nofit']); continue; }
      const clC=resolveCollisions(rr, box);
      window.__ladder.push(['c'+cs, clC.collisions, clC.self, 0]);
      if(!bestC || clC.collisions<bestC.cl.collisions) bestC={rr, cl:clC};
      if(clC.collisions===0) break;
    }
    if(bestC){
      bestC.cl.attempt=0; bestC.cl.lanes=nL;
      bestClean={ribbons:bestC.rr, clear:bestC.cl,
                 len:bestC.rr.reduce((a2,rb)=>a2+rb.ribbonLen,0),
                 gate:true, fill:1, cov:1};
      best=bestClean; conceptBuilt=true;
    }
  }
  // ДЛИННЫЙ «МИКС» СОБИРАЕТСЯ ИЗ ОТСЕКОВ. Одной лентой вытянутый габарит
  // не строится: марш обрывается на трети длины, вписыватель не ужимает
  // волны по высоте (замер 4400×900×800: все попытки nofit, показывалась
  // страховочная змейка 5.2 пог. м на 4.4 м габарита). Габарит нарезается
  // по длине на 2-3 отсека, в каждом строится своя лента обычным способом
  // (правило метража отсека суммарно даёт правило целого), затем ленты
  // сдвигаются на свои места; стык проверяет разводка касаний
  let directBuilt=conceptBuilt;
  if(!directBuilt && params.plast!=="edge" && lanes>1 && !state.subBuild){
    // КАЖДЫЙ ОТРЕЗОК СТРОИТСЯ ПОЛНОЦЕННОЙ ШТАТНОЙ СБОРКОЙ (рекурсивный
    // вызов buildScene на виртуальном габарите отсека): самодельный
    // мини-перебор внутри отсека давал либо касания, либо недозаполнение.
    // Штатная лестница на габарите отсека (~2 м) отработана всеми замерами
    // стык 36 мм (санитарно хватает 25): зазор 120 читался провалом между
    // отрезками. Отсек обязан заполнить свой бокс по длине не меньше чем на
    // 92% — иначе перебираем зерно (до трёх), недобор тоже читался провалом
    // ОСЬ НАРЕЗКИ: широкие боксы режутся по X, глубокие — по Z (слоями
    // стандартных пропорций); механика отсеков и мостов осе-независимая
    const AX=sliceAxis;
    const uiDim=AX===0? ui.dimW : ui.dimD;
    const nL=lanes, sliceW=(AX===0? box.w : box.d)/nL, seamGap=36;
    const keepW=uiDim.value, seed0=state.seed, keepAuto=state.autoSeed;
    const rrAll=[]; let okAll=true;
    state.subBuild=true;
    for(let i=0;i<nL && okAll;i++){
      let bestSl=null;
      for(let tr=0; tr<3 && !(bestSl && bestSl.ok); tr++){
        uiDim.value=String(Math.round(sliceW-seamGap));
        state.autoSeed=false;
        state.seed=(seed0+i*104729+tr*7717)>>>0;
        buildScene();
        if(!scene || !scene.ribbons.length || scene.clear.collisions>0) continue;
        let x0=1e9, x1=-1e9;
        for(const rb of scene.ribbons){
          const b2=geoBBox(rb);
          x0=Math.min(x0,b2.min[AX]); x1=Math.max(x1,b2.max[AX]);
        }
        const fillX=(x1-x0+ROD_D)/(sliceW-seamGap);
        { // вылет отсека за его виртуальный бокс (диагностика)
          let oS=[0,0,0];
          const limS=[box.w, box.h, box.d];
          limS[AX]=Math.round(sliceW-seamGap);
          for(const rb of scene.ribbons) for(const r of rb.rods)
            for(const p of [r.a,r.b]) for(let x=0;x<3;x++)
              oS[x]=Math.max(oS[x], p[x]-limS[x], -p[x]);
          window.__ladder.push(['sbox'+i+'.'+tr].concat(oS.map(v=>Math.round(v))));
        }
        const okSl=fillX>=0.92;
        if(!bestSl || (okSl && !bestSl.ok) || (okSl===bestSl.ok && fillX>bestSl.fillX))
          bestSl={ribbons:scene.ribbons, fillX, ok:okSl};
        window.__ladder.push(['slice'+i+'.'+tr, 'fillX',
                              Math.round(fillX*100)]);
      }
      if(!bestSl){ okAll=false; break; }
      const dx=i*sliceW+seamGap/2;
      for(const rb of bestSl.ribbons){
        for(const r of rb.rods){ r.a[AX]+=dx; r.b[AX]+=dx; }
        for(const arr of [rb.centers, rb.railA, rb.railB, rb.guideC])
          if(arr) for(const p2 of arr) p2[AX]+=dx;
        rb.clampMin=[0,0,0]; rb.clampMax=[box.w, box.h, box.d];
        rrAll.push(rb);
      }
    }
    state.subBuild=false;
    uiDim.value=keepW;
    state.seed=seed0; state.autoSeed=keepAuto;
    // СТЫК НЕВИДИМ: КОМПОЗИЦИЯ ЧИТАЕТСЯ ОДНОЙ ДЛИННОЙ ЛЕНТОЙ. Ближние концы
    // соседних отрезков ПРОДОЛЖАЮТСЯ гладкими мостами (кубика Эрмита) до
    // общей точки на границе отсеков (монтажный зазор 30 мм); оба моста
    // приходят к стыку по ходу оси X, поэтому лента читается сквозной.
    // МОСТ — ГОТОВЫЕ СТАНЦИИ ПРОДОЛЖЕНИЕМ ЛЕНТЫ, БЕЗ ПЕРЕМАРША. Два
    // отвергнутых подхода (оба меряны на 4400×900×800): деформация готового
    // хвоста протаскивала витки сквозь плотную укладку (583-657 самокасаний,
    // откат всегда); мост в направляющей с перемаршем всей ленты смещал
    // уложенные витки — то касания, то вылет за бокс до +191 мм («лента
    // выходит за контур»), ни один кандидат не проходил. Готовые станции
    // не трогают ленту вовсе: проверяются только стержни самого моста
    if(okAll && rrAll.length===nL && rrAll.length>1){
      // выход фактических стержней за грани бокса (макс по осям, мм)
      const ovr=()=>{
        let o=[0,0,0];
        const lim=[box.w,box.h,box.d];
        for(const rb of rrAll) for(const r of rb.rods) for(const p of [r.a,r.b])
          for(let x=0;x<3;x++)
            o[x]=Math.max(o[x], p[x]-lim[x], -p[x]);
        return o.map(v=>Math.round(v));
      };
      window.__ladder.push(['jbox0'].concat(ovr()));
      const alignTo=(v,ref)=>V.dot(v,ref)<0? [-v[0],-v[1],-v[2]] : v.slice();
      // построить станции моста от конца ленты (head=с головы) до точки
      // стыка PS МАРШЕМ по отдельной короткой направляющей: разбег по
      // готовым станциям конца (марш на своём же следе устойчив) + кубика
      // Эрмита до стыка. Вся физика — веер стержней на кривой, твист,
      // радиус, стены бокса — соблюдается маршем ПО ПОСТРОЕНИЮ. Стержни
      // жёстко поперёк хода не годятся: уже при развороте ~0.3°/станцию
      // торцы соседей сходятся ближе лимита (замер: 10.6 мм при 10.9);
      // а мост в общей направляющей с перемаршем ВСЕЙ ленты смещал уже
      // уложенные витки (касания либо вылет за бокс до +191 мм).
      // uSeam — направление сквозного хода ленты через стык (линия между
      // концами), dTgt/uTgt/nTgt — общая ориентация стержней на стыке
      const marchBridge=(rb, head, PS, uSeam, sc0, sc1, dTgt, uTgt, nTgt)=>{
        const C=rb.centers, n0=C.length, step=rb.stepEff, twoRow=!!rb.dirUp;
        const i0=head?0:n0-1;
        const P0=C[i0],
              T0=head? V.norm(V.sub(C[0],C[1])) : V.norm(V.sub(C[n0-1],C[n0-2]));
        const dist=V.len(V.sub(PS,P0));
        if(dist<40) return {empty:true};
        const s1=Math.sign(V.dot(uSeam, V.sub(PS,P0)))||1;
        const m0=V.mul(T0, dist*sc0), m1=V.mul(uSeam, dist*sc1*s1);
        // марш стартует ПРЯМО из конца ленты: начальная рама целиком
        // задаётся первой точкой направляющей, guideD[0] (= ориентация
        // концевого стержня) и касательной к Эрмиту (= ход конца). Разбег
        // по готовым станциям вредил: pure pursuit срезал угол сквозь
        // концевой завиток, и трек проходил в 1-5 мм от концевых стержней
        const G=[], GD=[], GU=twoRow?[]:null, GN=twoRow?[]:null;
        const dE=rb.dirs[i0], uE=twoRow?rb.dirUp[i0]:null, nE=twoRow?rb.dirDn[i0]:null;
        const dT=alignTo(dTgt,dE), uT=twoRow?alignTo(uTgt,uE):null,
              nT2=twoRow?alignTo(nTgt,nE):null;
        const lerpN=(a,b,t)=>V.norm([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t,
                                     a[2]+(b[2]-a[2])*t]);
        const NP=Math.max(24, Math.round(dist/7));
        for(let k=0;k<=NP;k++){
          const t=k/NP, t2=t*t, t3=t2*t;
          const h00=2*t3-3*t2+1, h10=t3-2*t2+t, h01=-2*t3+3*t2, h11=t3-t2;
          G.push([0,1,2].map(x=>h00*P0[x]+h10*m0[x]+h01*PS[x]+h11*m1[x]));
          GD.push(lerpN(dE,dT,t));
          if(twoRow){ GU.push(lerpN(uE,uT,t)); GN.push(lerpN(nE,nT2,t)); }
        }
        // продление направляющей ЗА точку стыка: pure pursuit срезает конец
        // направляющей, и без запаса мост останавливался за ~100-200 мм до
        // стыка (замер: зазор концов 225 мм вместо 30; с запасом 60 мм —
        // ещё 139). Лишние станции потом отрезаются по ближайшей к PS
        const uEnd=V.norm(m1);
        for(let k=1;k<=12;k++){
          G.push([0,1,2].map(x=>PS[x]+uEnd[x]*k*12));
          GD.push(GD[GD.length-1].slice());
          if(twoRow){ GU.push(GU[GU.length-1].slice());
                      GN.push(GN[GN.length-1].slice()); }
        }
        // кламп моста — с отступом 12 мм от граней: мягкий руль марша
        // перелетал грань на 10-25 мм, и кандидаты стыка резались проверкой
        // бокса (замер на глубокой нарезке 2400×1000×800 — все 'box')
        const rbB={guideC:G, guideD:GD, guideUp:GU, guideDn:GN, rows:rb.rows,
                   halfW:rb.halfW, stepEff:step, foldK:rb.foldK||0,
                   foldMax:rb.foldMax||0, clampMin:[12,12,12],
                   clampMax:[box.w-12, box.h-12, box.d-12]};
        marchRibbon(rbB);
        // примыкание: первая станция моста — по фактическому капсульному
        // зазору с концевыми стержнями ленты (впритык торцы сходились на
        // грани ближнего лимита: замер 10.5-10.8 мм при 10.9)
        const endRods=rb.rods.filter(r=>head? r.st<=7 : r.st>=n0-8);
        let cut=1;
        while(cut<rbB.centers.length){
          if(V.len(V.sub(rbB.centers[cut],P0))>=step*0.95){
            let clear=true;
            for(const r of rbB.rods){
              if(r.st!==cut) continue;
              for(const q of endRods){
                const [d2]=closestSegSeg(r.a,r.b,q.a,q.b);
                if(d2<CLEAR_NEAR+0.3){ clear=false; break; }
              }
              if(!clear) break;
            }
            if(clear) break;
          }
          cut++;
        }
        // хвост НЕ обрезается здесь: два моста обрезаются СОВМЕСТНО в
        // точке, где их станции сходятся на монтажный зазор ~30 мм
        // (обрезка каждого по ближайшей к PS оставляла зазор 107-139 мм:
        // марш промахивается мимо PS вбок, и ближайшие станции далеко)
        if(rbB.centers.length-cut<2) return {empty:true};
        const sl=(A2)=>A2.slice(cut);
        return {pts:sl(rbB.centers), dirsB:sl(rbB.dirs),
                upB:twoRow?sl(rbB.dirUp):[], dnB:twoRow?sl(rbB.dirDn):[],
                rodsB:rbB.rods.filter(r=>r.st>=cut)
                              .map(r=>({...r, st:r.st-cut})),
                railAB:sl(rbB.railA), railBB:sl(rbB.railB), twoRow};
      };
      // вклейка заготовки: все массивы пересобираются НОВЫМИ (старые объекты
      // не мутируются — откат просто возвращает прежние ссылки)
      const weld=(rb, head, br)=>{
        const bak={centers:rb.centers, dirs:rb.dirs, dirUp:rb.dirUp,
                   dirDn:rb.dirDn, rods:rb.rods, railA:rb.railA,
                   railB:rb.railB, uTop:rb.uTop, uBot:rb.uBot,
                   guideC:rb.guideC, guideD:rb.guideD, guideUp:rb.guideUp,
                   guideDn:rb.guideDn, giMap:rb.giMap, ribbonLen:rb.ribbonLen};
        if(br.empty) return {bak, rods:[]};
        const ns=br.pts.length, g0=rb.guideC.length;
        const rev=(A2)=>A2.slice().reverse();
        const cat=(old,add)=>head? rev(add).concat(old) : old.concat(add);
        rb.centers=cat(rb.centers, br.pts.map(p=>p.slice()));
        rb.dirs=cat(rb.dirs, br.dirsB);
        if(br.twoRow){ rb.dirUp=cat(rb.dirUp, br.upB); rb.dirDn=cat(rb.dirDn, br.dnB); }
        rb.railA=cat(rb.railA, br.railAB);
        rb.railB=cat(rb.railB, br.railBB);
        rb.guideC=cat(rb.guideC, br.pts.map(p=>p.slice()));
        rb.guideD=cat(rb.guideD, br.dirsB.map(v=>v.slice()));
        if(rb.guideUp) rb.guideUp=cat(rb.guideUp, br.upB.map(v=>v.slice()));
        if(rb.guideDn) rb.guideDn=cat(rb.guideDn, br.dnB.map(v=>v.slice()));
        const pad=Array.from({length:ns});
        rb.uTop=cat(rb.uTop, pad.map(()=>rb.halfW));
        rb.uBot=cat(rb.uBot, pad.map(()=>-rb.halfW));
        let welded;
        if(head){
          // станции моста встают в начало: нумерация в них — от стыка к
          // телу; гид-индексы старых станций сдвигаются на длину моста
          welded=br.rodsB.map(r=>({...r, st:ns-1-r.st}));
          rb.rods=welded.concat(rb.rods.map(r=>({...r, st:r.st+ns})));
          rb.giMap=pad.map((_,k)=>k).concat(rb.giMap.map(g=>g+ns));
        } else {
          const n0=bak.centers.length;
          welded=br.rodsB.map(r=>({...r, st:n0+r.st}));
          rb.rods=rb.rods.concat(welded);
          rb.giMap=rb.giMap.concat(pad.map((_,k)=>g0+k));
        }
        rb.ribbonLen=rb.centers.length*rb.stepEff;
        return {bak, rods:welded};
      };
      const unweld=(rb,bak)=>{ Object.assign(rb, bak); };
      // подрезка конца ленты на nT станций: конец отрезка закручен, и его
      // касательная часто смотрит ПРОТИВ хода к соседнему отрезку — мост
      // от самого торца выходил круче технологического радиуса (замер:
      // 21-28° на станцию при лимите 9.6°, все кандидаты резались).
      // Рядом с торцом всегда есть станция с попутной касательной;
      // подрезка ≤24 станций (~280 мм из 5-7 м отрезка) незаметна
      const trim=(rb, head, nT)=>{
        const bak={centers:rb.centers, dirs:rb.dirs, dirUp:rb.dirUp,
                   dirDn:rb.dirDn, rods:rb.rods, railA:rb.railA,
                   railB:rb.railB, uTop:rb.uTop, uBot:rb.uBot,
                   guideC:rb.guideC, guideD:rb.guideD, guideUp:rb.guideUp,
                   guideDn:rb.guideDn, giMap:rb.giMap, ribbonLen:rb.ribbonLen};
        const n0=rb.centers.length;
        const sl=(A2)=>head? A2.slice(nT) : A2.slice(0, A2.length-nT);
        rb.centers=sl(rb.centers); rb.dirs=sl(rb.dirs);
        if(rb.dirUp){ rb.dirUp=sl(rb.dirUp); rb.dirDn=sl(rb.dirDn); }
        rb.railA=sl(rb.railA); rb.railB=sl(rb.railB);
        rb.uTop=sl(rb.uTop); rb.uBot=sl(rb.uBot);
        rb.rods=head? rb.rods.filter(r=>r.st>=nT).map(r=>({...r, st:r.st-nT}))
                    : rb.rods.filter(r=>r.st<n0-nT);
        rb.giMap=sl(rb.giMap);
        rb.ribbonLen=rb.centers.length*rb.stepEff;
        return bak;
      };
      // проверка НОВЫХ стержней: против всей сцены (правило зазоров
      // разводки: соседям по ленте — ближний лимит, дальним — полный)
      // и против граней бокса
      // ЗАЛОМ НА СТЫКЕ. Сварка может пройти капсульные лимиты, но сложить
      // осевую под 45-75° на одной станции (шаг 11.6 мм → радиус ~10 мм,
      // проволока так не гнётся, и веер стержней раскрывается прорехой по
      // торцам — замер 1500×1500×1000: заломы 46-74° и прорехи 29-31 мм
      // на станциях сварки). Максимальный угол между соседними шагами
      // осевой в окне стыка — критерий приёмки кандидата
      const kinkOf=(rb, head, span)=>{
        const C=rb.centers, n=C.length;
        if(n<3) return 0;
        const i0=head? 1 : Math.max(1, n-1-span);
        const i1=head? Math.min(n-2, span) : n-2;
        let mx=0;
        for(let i=i0;i<=i1;i++){
          const v1=V.sub(C[i],C[i-1]), v2=V.sub(C[i+1],C[i]);
          const l1=V.len(v1)||1, l2=V.len(v2)||1;
          const dt=V.dot(v1,v2)/(l1*l2);
          const a=Math.acos(Math.max(-1,Math.min(1,dt)));
          if(a>mx) mx=a;
        }
        return mx*180/Math.PI;
      };
      // ВЕЕР ТОРЦОВ У СТЫКА. Серия плавных поворотов по 20-25° на станцию
      // по отдельности проходит лимит залома, но суммарно раскрывает
      // наружные торцы соседних стержней на 50-80 мм — «пропуск» в
      // гребёнке (замер 6000×900×800: веер 82.8 мм на станции 419).
      // Меряем прямо расстояние наружных торцов соседних стержней ряда
      const tipFanOf=(rb, head, span)=>{
        const n=rb.centers.length;
        const lo=head? 0 : Math.max(0, n-1-span);
        const hi=head? Math.min(n-1, span) : n-1;
        let mx=0;
        for(const sgn of [1,-1]){
          const row=rb.rods.filter(r=>r.st>=lo && r.st<=hi
                                      && (sgn>0? r.u2>0 : r.u2<=0))
                           .sort((q,z)=>q.st-z.st);
          for(let i=1;i<row.length;i++){
            if(row[i].st-row[i-1].st>3) continue;
            const d=Math.hypot(row[i].a[0]-row[i-1].a[0],
                               row[i].a[1]-row[i-1].a[1],
                               row[i].a[2]-row[i-1].a[2]);
            if(d>mx) mx=d;
          }
        }
        return mx;
      };
      // ШПИЛЬКА КАНТА У СТЫКА. Центры могут сойтись плавно (залом ≤30°,
      // радиус 75+), а кант при скачке ориентации стержней на шве
      // заворачивает петлёй радиуса 15-30 мм — проволока так не гнётся,
      // на виде это острый поворот, и торцы стержней вылетают из контура
      // (замер 4400×900×800 №42424242: кант A R18 при центре R76).
      // Критерий — минимальный оконный радиус дуги кантов в окне стыка:
      // сумма поворотов в окне ±2 станции к длине дуги
      const railRadOf=(rb, head, span)=>{
        let mn=1e9;
        const rails=[rb.railA, rb.railB];
        if(rb.dirUp) rails.push(rb.centers);
        for(const P of rails){
          if(!P) continue;
          const n=P.length; if(n<8) continue;
          const i0=head? 3 : Math.max(3, n-4-span);
          const i1=head? Math.min(n-4, span) : n-4;
          for(let i=i0;i<=i1;i++){
            let ang=0, arc=0;
            for(let j=i-2;j<=i+2;j++){
              const v1=V.sub(P[j],P[j-1]), v2=V.sub(P[j+1],P[j]);
              const l1=V.len(v1)||1, l2=V.len(v2)||1;
              ang+=Math.acos(Math.max(-1,Math.min(1,V.dot(v1,v2)/(l1*l2))));
            }
            for(let j=i-2;j<=i+3;j++) arc+=V.len(V.sub(P[j],P[j-1]));
            if(ang>0.6) mn=Math.min(mn, arc/ang);
          }
        }
        return mn;
      };
      const rodsOk=(newRods, rbSelf)=>{
        const lim=[box.w,box.h,box.d];
        // допуск вылета торца моста за грань: радиус трубки + 6 мм (руль
        // марша мягкий; вылет меньше диаметра трубки на виде не читается)
        for(const r of newRods) for(const p of [r.a,r.b])
          for(let x=0;x<3;x++)
            if(p[x]<-ROD_R-6 || p[x]>lim[x]+ROD_R+6) return 'box';
        for(const r of newRods){
          for(const rb of rrAll){
            for(const q of rb.rods){
              if(q===r) continue;
              const near = rb===rbSelf && Math.abs(q.st-r.st)<=NEAR_WIN;
              const limD = near ? CLEAR_NEAR : CLEAR_FAR;
              const [d]=closestSegSeg(r.a,r.b,q.a,q.b);
              if(d<limD) return (near?'n':'f')+Math.round(d)+'@'+r.st+'/'+q.st+
                                (rb===rbSelf?'s':'x');
            }
          }
        }
        return '';
      };
      // каждый стык сводится отдельно: до четырёх точек встречи — середина
      // между концами, высокая дуга над витками (мост летит по свободному
      // верху бокса), уровень конца A, уровень конца B
      for(let j=0;j<rrAll.length-1;j++){
        const A=rrAll[j], B=rrAll[j+1];
        // у каждого отрезка берём конец, ближний к границе отсеков
        const aHead=(A.centers[0][AX] > A.centers[A.centers.length-1][AX]);
        const bHead=(B.centers[0][AX] < B.centers[B.centers.length-1][AX]);
        // выбор пары подрезок концов — по сонаправленности касательных
        // с линией между концами (мост тем прямее, чем лучше согласованы)
        const endInfo=(rb, head, nT)=>{
          const C=rb.centers, n=C.length;
          const i0=head? nT : n-1-nT, i1=head? nT+1 : n-2-nT;
          return {P:C[i0], T:V.norm(V.sub(C[i0],C[i1])), D:rb.dirs[i0]};
        };
        // глубокие подрезки (до 44 станций ~510 мм) нужны концам, севшим
        // на грань бокса: рядом с ними мост не построить, надо отойти
        const NTs=[0,4,8,12,16,20,24,30,37,44];
        const pairs=[];
        for(const ta of NTs) for(const tb of NTs){
          const ea=endInfo(A,aHead,ta), eb=endInfo(B,bHead,tb);
          const u=V.norm(V.sub(eb.P,ea.P));
          // штраф за ход стыка ВДОЛЬ осей концевых стержней: мост,
          // уходящий вдоль своего же стержня (188 мм у однорядки),
          // скользит в паре мм от него по всей длине (замер: ближние
          // касания 2-5 мм на каждом кандидате) — линия стыка должна
          // идти поперёк стержней
          pairs.push({ta, tb,
            score:V.dot(ea.T,u)-V.dot(eb.T,u)
                  -0.9*(Math.abs(V.dot(ea.D,u))+Math.abs(V.dot(eb.D,u)))
                  -(ta+tb)*0.004});
        }
        pairs.sort((q,z)=>z.score-q.score);
        let done=false;
        // два прохода: сначала стык обязан быть ПЛАВНЫМ (залом ≤ 30°),
        // не нашлось ни одного кандидата — послабление до старого
        // поведения (кривой стык всё же лучше зияющего разрыва)
        for(const kLim of [30, 999]){
        for(const pr of pairs.slice(0,14)){
          const bakTA=pr.ta? trim(A,aHead,pr.ta) : null;
          const bakTB=pr.tb? trim(B,bHead,pr.tb) : null;
          const pa=(aHead? A.centers[0] : A.centers[A.centers.length-1]).slice();
          const pb=(bHead? B.centers[0] : B.centers[B.centers.length-1]).slice();
          // сквозной ход через стык — вдоль линии между концами
          const uLn=V.norm(V.sub(pb,pa));
          // общая ориентация стержней на стыке — среднее ориентаций
          // концов, выправленное поперёк сквозного хода
          const eIdx=(rb,h)=>h?0:rb.dirs.length-1;
          const mid=(v1,v2)=>orthoTo(V.norm(V.add(v1, alignTo(v2,v1))), uLn);
          const dS=mid(A.dirs[eIdx(A,aHead)], B.dirs[eIdx(B,bHead)]);
          const uS=A.dirUp? mid(A.dirUp[eIdx(A,aHead)], B.dirUp[eIdx(B,bHead)]) : null;
          const nS=A.dirDn? mid(A.dirDn[eIdx(A,aHead)], B.dirDn[eIdx(B,bHead)]) : null;
          // кандидаты точки встречи: середина линии, приподнятая дуга,
          // широкая петля, длинный разбег вдоль собственного хода (уводит
          // трек от концевого стержня прежде чем повернуть к стыку).
          // Точка встречи ОТТЯГИВАЕТСЯ ОТ СТЕН на 80 мм: у концов, сидящих
          // на грани бокса, мост перелетал грань мягким рулём марша и все
          // кандидаты резались проверкой бокса (замер 2400×1000×800)
          const limM=[box.w,box.h,box.d];
          const inb=(P)=>P.map((v,x)=>Math.min(limM[x]-80, Math.max(80, v)));
          const M0=inb([0,1,2].map(x=>(pa[x]+pb[x])/2));
          const Mup=inb([M0[0], Math.min(box.h-70, M0[1]+120), M0[2]]);
          const cand=[[M0,0.45,0.65],[Mup,0.45,0.65],[M0,0.9,0.9],
                      [M0,1.3,0.6]];
          for(let ci=0;ci<cand.length && !done;ci++){
            const [M,sc0,sc1]=cand[ci];
            const PSa=[0,1,2].map(x=>M[x]-uLn[x]*15);
            const PSb=[0,1,2].map(x=>M[x]+uLn[x]*15);
            const brA=marchBridge(A, aHead, PSa, uLn, sc0, sc1, dS, uS, nS);
            const brB=marchBridge(B, bHead, PSb, uLn, sc0, sc1, dS, uS, nS);
            if(!brA || !brB){
              window.__ladder.push(['join'+j+'.'+pr.ta+'-'+pr.tb+'.'+ci, -1,
                Math.round(pr.score*100)]);
              continue;
            }
            // совместная обрезка хвостов: пара станций двух мостов, где
            // КАПСУЛЬНОЕ расстояние их стержней ~30 мм (резать по центрам
            // нельзя: торцы стержней до 188 мм сходятся раньше центров, и
            // дальний лимит валил все близкие пары — принимались только
            // конфигурации с зазором 120-227 мм, стык читался)
            const cutTo=(br,k)=>{
              const c=(A2)=>A2.slice(0,k+1);
              br.pts=c(br.pts); br.dirsB=c(br.dirsB);
              if(br.twoRow){ br.upB=c(br.upB); br.dnB=c(br.dnB); }
              br.railAB=c(br.railAB); br.railBB=c(br.railBB);
              br.rodsB=br.rodsB.filter(r=>r.st<=k);
            };
            const tipRods=(rb,h)=>{
              const n=rb.centers.length;
              return rb.rods.filter(r=>h? r.st===0 : r.st===n-1);
            };
            const bySt=(br)=>{ const m2=[];
              for(const r of br.rodsB)(m2[r.st]=m2[r.st]||[]).push(r);
              return m2; };
            const stA=brA.empty? null : bySt(brA);
            const stB=brB.empty? null : bySt(brB);
            const tipA=brA.empty? tipRods(A,aHead) : null;
            const tipB=brB.empty? tipRods(B,bHead) : null;
            const PA=brA.empty? [pa] : brA.pts;
            const PB=brB.empty? [pb] : brB.pts;
            // носики должны остановиться НАВСТРЕЧУ друг другу: без нахлёста
            // вдоль линии стыка (иначе канты перекрещивались «клювом»),
            // с малым боковым уводом и ходом обоих вдоль линии. Пары
            // обрезок сортируются по этой оценке и пробуются НАСКВОЗЬ
            // (сварка + полная проверка): лучшая по оценке пара часто
            // висит на волоске лимитов, а рабочая — следующая за ней
            const tipPairs=[];
            const iHi=brA.empty?0:brA.pts.length-1;
            const jHi=brB.empty?0:brB.pts.length-1;
            for(let i2=brA.empty?0:1;i2<=iHi;i2++){
              const RA=brA.empty? tipA : stA[i2];
              if(!RA || !RA.length) continue;
              const tA2=(!brA.empty && i2>0)?
                V.norm(V.sub(brA.pts[i2], brA.pts[Math.max(0,i2-1)])) : uLn;
              for(let j2=brB.empty?0:1;j2<=jHi;j2++){
                const RB=brB.empty? tipB : stB[j2];
                if(!RB || !RB.length) continue;
                const vx=V.sub(PB[j2], PA[i2]);
                const proj=V.dot(vx, uLn);
                if(proj<18) continue;   // нахлёст либо разворот носиков
                const lat=V.len(V.sub(vx, V.mul(uLn, proj)));
                let dm=1e9;
                for(const r of RA) for(const q of RB)
                  dm=Math.min(dm, closestSegSeg(r.a,r.b,q.a,q.b)[0]);
                if(dm<23) continue;     // торцы ближе дальнего лимита
                const tB2=(!brB.empty && j2>0)?
                  V.norm(V.sub(brB.pts[j2], brB.pts[Math.max(0,j2-1)])) : uLn;
                tipPairs.push({i2, j2,
                  s:Math.abs(dm-30)+0.7*lat
                    +25*(1-Math.abs(V.dot(tA2,uLn)))
                    +25*(1-Math.abs(V.dot(tB2,uLn)))});
              }
            }
            tipPairs.sort((q,z)=>q.s-z.s);
            for(const tp of tipPairs.slice(0,8)){
              const brA2={...brA}, brB2={...brB};
              if(!brA2.empty) cutTo(brA2, tp.i2);
              if(!brB2.empty) cutTo(brB2, tp.j2);
              const wA=weld(A, aHead, brA2), wB=weld(B, bHead, brB2);
              let whyB=rodsOk(wA.rods, A) || rodsOk(wB.rods, B);
              if(!whyB){
                const spA=(brA2.empty?2:brA2.pts.length)+8;
                const spB=(brB2.empty?2:brB2.pts.length)+8;
                const kk=Math.max(kinkOf(A,aHead,spA), kinkOf(B,bHead,spB));
                if(kk>kLim) whyB='kink'+Math.round(kk);
                // строгий проход требует и сомкнутой гребёнки: веер торцов
                // у стыка не шире физического веера предельного изгиба
                if(!whyB && kLim<100){
                  const fan=Math.max(tipFanOf(A,aHead,spA), tipFanOf(B,bHead,spB));
                  if(fan>36) whyB='fan'+Math.round(fan);
                  // ...и кантов без шпилек: радиус дуги проволоки ≥ 32 мм
                  if(!whyB){
                    const rr=Math.min(railRadOf(A,aHead,spA), railRadOf(B,bHead,spB));
                    if(rr<32) whyB='rail'+Math.round(rr);
                  }
                }
              }
              done=!whyB;
              window.__ladder.push(['join'+j+'.'+pr.ta+'-'+pr.tb+'.'+ci+
                '.'+tp.i2+'/'+tp.j2, done?0:1, whyB||''].concat(ovr()));
              if(done) break;
              unweld(A,wA.bak); unweld(B,wB.bak);
            }
          }
          if(done) break;
          if(bakTB) unweld(B,bakTB);
          if(bakTA) unweld(A,bakTA);
        }
        if(done) break;
        }
        if(!done) window.__ladder.push(['join'+j+'.fail',-1,0,0,0,0]);
      }
      // ЗАПОЛНЕНИЕ РАСТЯНУТЫХ ПРИМЫКАНИЙ. При вклейке моста марш выбрасывал
      // 1-2 станции у конца ленты (их торцы сходились с концевым стержнем
      // на 0.1-0.4 мм ближе лимита), и в ленте оставались прорехи 23-35 мм
      // при шаге 11.6 (вопрос пользователя «потеря трубочек?»). Пропущенные
      // станции вставляются обратно с равным чуть увеличенным шагом
      // (~12.5 мм): запас по центрам покупает зазор торцов. Каждая вставка
      // проверяется строгим правилом зазоров против всей сцены и бокса —
      // не прошла, прореха остаётся (это редкость)
      // до трёх проходов: микро-разводка вставки сдвигает станции и может
      // растянуть СОСЕДНИЙ интервал, по которому проход уже прошёл
      for(let pass=0; pass<3; pass++){
      let insAny=false;
      for(const rb of rrAll){
        const IN=WIRE_D/2+ROD_AIR, halfW=rb.halfW, twoRow=!!rb.dirUp;
        for(let i=1;i<rb.centers.length;i++){
          const A2=rb.centers[i-1], B2=rb.centers[i];
          const gap=V.len(V.sub(B2,A2));
          if(gap<=rb.stepEff*1.35) continue;
          const nIns0=Math.min(3, Math.round(gap/rb.stepEff)-1);
          if(nIns0<1) continue;
          // если полный комплект вставок не влезает — пробуем меньше:
          // шаг выйдет шире штатного, но без зияющей прорехи
          let nIns=nIns0, inserted=false;
          for(; nIns>=1 && !inserted; nIns--){
          const T=V.norm(V.sub(B2,A2));
          const mix=(vA,vB,t)=>orthoTo(V.norm([vA[0]+(vB[0]-vA[0])*t,
            vA[1]+(vB[1]-vA[1])*t, vA[2]+(vB[2]-vA[2])*t]), T);
          const pts=[], dd=[], du2=[], dn2=[];
          for(let k=1;k<=nIns;k++){
            const t=k/(nIns+1);
            pts.push([0,1,2].map(x=>A2[x]+(B2[x]-A2[x])*t));
            dd.push(mix(rb.dirs[i-1],rb.dirs[i],t));
            if(twoRow){ du2.push(mix(rb.dirUp[i-1],rb.dirUp[i],t));
                        dn2.push(mix(rb.dirDn[i-1],rb.dirDn[i],t)); }
          }
          const stRods=(k)=>{
            const P=pts[k];
            if(twoRow){
              const u=du2[k], n2=dn2[k];
              return [
                {st:i+k, u1:IN, u2:halfW-IN, len:halfW-2*IN, nom:halfW,
                 a:[P[0]+u[0]*(halfW-IN),P[1]+u[1]*(halfW-IN),P[2]+u[2]*(halfW-IN)],
                 b:[P[0]+u[0]*IN,P[1]+u[1]*IN,P[2]+u[2]*IN], n:V.norm(V.cross(T,u))},
                {st:i+k, u1:-(halfW-IN), u2:-IN, len:halfW-2*IN, nom:halfW,
                 a:[P[0]+n2[0]*(halfW-IN),P[1]+n2[1]*(halfW-IN),P[2]+n2[2]*(halfW-IN)],
                 b:[P[0]+n2[0]*IN,P[1]+n2[1]*IN,P[2]+n2[2]*IN], n:V.norm(V.cross(T,n2))}];
            }
            const d=dd[k];
            return [{st:i+k, u1:-(halfW-IN), u2:halfW-IN,
              len:2*(halfW-IN), nom:2*halfW,
              a:[P[0]+d[0]*(halfW-IN),P[1]+d[1]*(halfW-IN),P[2]+d[2]*(halfW-IN)],
              b:[P[0]-d[0]*(halfW-IN),P[1]-d[1]*(halfW-IN),P[2]-d[2]*(halfW-IN)],
              n:V.norm(V.cross(T,d))}];
          };
          let rods=[];
          const rebuild=()=>{ rods=[];
            for(let k=0;k<nIns;k++) rods.push(...stRods(k)); };
          rebuild();
          // МИКРО-РАЗВОДКА ВСТАВКИ: станция сдвигается по направлению
          // раздвижки худшей пары. Вставка по хорде билась о соседей теми
          // же долями миллиметра, что не добрал марш (замер: 10.0 и 5 мм
          // при лимите 10.9) — пара миллиметров сдвига решает
          let okG=false;
          const lim3=[box.w,box.h,box.d];
          for(let it=0; it<14 && !okG; it++){
            let worst=null;
            rods.forEach((r,ri2)=>{
              const k=twoRow? (ri2>>1) : ri2;
              const scan=(q,lim)=>{
                const [d2,c1,c2]=closestSegSeg(r.a,r.b,q.a,q.b);
                if(d2>=lim) return;
                let nv=V.sub(c1,c2); const L=V.len(nv);
                nv=L>1e-6? V.mul(nv,1/L) : [0,1,0];
                const need=lim-d2+0.4;
                if(!worst || need>worst.need) worst={k,nv,need};
              };
              for(const rb2 of rrAll) for(const q of rb2.rods)
                scan(q, (rb2===rb && Math.abs(q.st-r.st)<=NEAR_WIN)
                        ? CLEAR_NEAR : CLEAR_FAR);
              rods.forEach((q,rj2)=>{
                if((twoRow?(rj2>>1):rj2)!==k) scan(q, CLEAR_NEAR); });
              for(const p of [r.a,r.b]) for(let x=0;x<3;x++){
                if(p[x]<-ROD_R){ const nv=[0,0,0]; nv[x]=1;
                  const need=-ROD_R-p[x]+1;
                  if(!worst||need>worst.need) worst={k,nv,need}; }
                else if(p[x]>lim3[x]+ROD_R){ const nv=[0,0,0]; nv[x]=-1;
                  const need=p[x]-lim3[x]-ROD_R+1;
                  if(!worst||need>worst.need) worst={k,nv,need}; }
              }
            });
            if(!worst){ okG=true; break; }
            // демпфирование против качелей: пара лечится, соседняя рвётся
            const kd=it<7? 1.0 : 0.6;
            for(let x=0;x<3;x++) pts[worst.k][x]+=worst.nv[x]*worst.need*kd;
            rebuild();
          }
          if(!okG) continue;
          // ЗАЛОМ ВСТАВКИ. Микро-разводка двигает станции по зазорам, не
          // глядя на кривизну — на глубокой нарезке она складывала осевую
          // до 46-88° на станции: «клюв» и раскрытый веер торцов (скрин
          // пользователя, 1500×1500×1000). Цепочка вокруг вставки обязана
          // остаться плавной (≤30° на станции), иначе пробуем меньше
          // вставок или оставляем прореху — растянутый шаг незаметнее клюва
          {
            const chain=[];
            for(let q2=Math.max(0,i-2); q2<i; q2++) chain.push(rb.centers[q2]);
            for(const p2 of pts) chain.push(p2);
            for(let q2=i; q2<Math.min(rb.centers.length, i+2); q2++)
              chain.push(rb.centers[q2]);
            let mxA=0;
            for(let q2=1; q2+1<chain.length; q2++){
              const vA2=V.sub(chain[q2],chain[q2-1]), vB2=V.sub(chain[q2+1],chain[q2]);
              const lA2=V.len(vA2)||1, lB2=V.len(vB2)||1;
              const dt2=V.dot(vA2,vB2)/(lA2*lB2);
              mxA=Math.max(mxA, Math.acos(Math.max(-1,Math.min(1,dt2))));
            }
            if(mxA*180/Math.PI>30) continue;
          }
          const rlA=[], rlB=[];
          for(let k=0;k<nIns;k++){
            const P=pts[k];
            const u=twoRow? du2[k] : dd[k], n2=twoRow? dn2[k] : dd[k];
            rlA.push([P[0]+u[0]*halfW,P[1]+u[1]*halfW,P[2]+u[2]*halfW]);
            rlB.push(twoRow
              ? [P[0]+n2[0]*halfW,P[1]+n2[1]*halfW,P[2]+n2[2]*halfW]
              : [P[0]-n2[0]*halfW,P[1]-n2[1]*halfW,P[2]-n2[2]*halfW]);
          }
          rb.centers.splice(i,0,...pts);
          rb.dirs.splice(i,0,...dd);
          if(twoRow){ rb.dirUp.splice(i,0,...du2); rb.dirDn.splice(i,0,...dn2); }
          rb.railA.splice(i,0,...rlA); rb.railB.splice(i,0,...rlB);
          rb.uTop.splice(i,0,...pts.map(()=>halfW));
          rb.uBot.splice(i,0,...pts.map(()=>-halfW));
          rb.guideC.splice(i,0,...pts.map(p=>p.slice()));
          rb.guideD.splice(i,0,...dd.map(v=>v.slice()));
          if(rb.guideUp) rb.guideUp.splice(i,0,...du2.map(v=>v.slice()));
          if(rb.guideDn) rb.guideDn.splice(i,0,...dn2.map(v=>v.slice()));
          rb.giMap.splice(i,0,...pts.map(()=>rb.giMap[i-1]));
          rb.rods=rb.rods.map(r=>r.st>=i? {...r, st:r.st+nIns} : r).concat(rods);
          rb.ribbonLen=rb.centers.length*rb.stepEff;
          i+=nIns;
          inserted=true; insAny=true;
          }
          if(!inserted && pass===2)
            window.__ladder.push(['gapskip', Math.round(gap), 0, 0]);
        }
      }
      if(!insAny) break;
      }
    }
    if(okAll){
      // стык: отсеки разведены зазором 120 мм, проверка обычно чиста сразу
      const clS=resolveCollisions(rrAll, box);
      window.__ladder.push(['seam', clS.collisions, clS.self, 0]);
      if(clS.collisions===0){
        clS.attempt=0; clS.lanes=nL;
        bestClean={ribbons:rrAll, clear:clS,
                   len:rrAll.reduce((a2,rb)=>a2+rb.ribbonLen,0),
                   gate:true, fill:1, cov:1};
        best=bestClean; directBuilt=true;
      }
    }
  }
  outer:
  for(let effLanes=(directBuilt?0:lanesFit); effLanes>=1; effLanes--){
    // многожильные варианты считаются дорого (пар капсул кратно больше)
    // ЧИСЛО ПОПЫТОК — ДЕТЕРМИНИРОВАННЫЙ ПРЕДЕЛ ВРЕМЕНИ СБОРКИ. Раньше перебор
    // резался по бюджету времени, и номер варианта не воспроизводился на другой
    // машине. Теперь предел — само число попыток, поэтому оно уменьшено:
    // замер показывал 39.6 с на полной лестнице из 8 попыток
    // «НА РЕБРО» — ДВЕ ПОПЫТКИ, ДАЛЬШЕ СТРАХОВКА. У спирали на ребре касания
    // лечатся снижением ПЛОТНОСТИ ВИТКОВ, а этим занимается страховочный
    // проход, не лестница: замер на силуэте «звезда» 1500×1500×1500 (лента
    // 200 мм) показал пять попыток лестницы с касаниями подряд (166, 153,
    // 278, 415, 601) и чистый вариант только в страховке — 15 с на сборку
    const maxAtt = (params.plast==="edge") ? 2
                 : (effLanes>2 ? 3 : (effLanes>1 ? 4 : 5));
    for(let attempt=0; attempt<maxAtt; attempt++){
      // ЛЕСТНИЦА НЕ ОГРАНИЧЕНА ВРЕМЕНЕМ. Раньше она обрывалась по бюджету,
      // если что-то годное уже нашлось, — и один и тот же НОМЕР ВАРИАНТА
      // давал на разных машинах разные композиции: на медленной бюджет
      // срезал перебор раньше. Теперь перебор ограничен только числом
      // попыток (maxAtt), и номер варианта воспроизводится всюду одинаково
      // прогрессивное укрощение; с 6-й попытки — совсем спокойные
      // варианты: число лент важнее дикости формы
      const calm = attempt>=6;
      const a2 = calm ? attempt-6 : attempt;
      // заполняющая пластика: вместо «укрощения» (короче и спокойнее)
      // лестница РАЗРЯЖАЕТ сетку строк — размах и заполнение сохраняются
      const isFillP = (params.style==="chaos" || params.lengthK>=1.9);
      const p0 = isFillP
        ? Object.assign({}, params, {
            fillRelax: attempt*0.26,
            ampl: params.ampl*Math.pow(0.9, attempt),
            twistAmt: attempt>=3 ? 0 : params.twistAmt*Math.pow(0.8, attempt),
            // складка наклоняет ряды, а наклон рядов ограничивает радиус
            // изгиба (OP_SLACK/h): при радиусе витка ~180 мм допустим
            // наклон всего ~2°, поэтому лестница гасит складку раньше
            // размаха формы
            // складка = независимое положение центрального контура: гасить
            // её лестницей почти не нужно (её и так ограничивает зазор)
            foldK: params.foldK*Math.pow(0.85, attempt),
          })
        : Object.assign({}, params, {
            lengthK: calm ? params.lengthK*0.55*Math.pow(0.8, a2)
                          : params.lengthK*Math.pow(0.93, attempt),
            twistAmt: (calm || attempt>=4) ? 0 : params.twistAmt*Math.pow(0.75, attempt),
            ampl: params.ampl*(calm ? 0.5 : Math.pow(0.88, attempt)),
            foldK: calm ? 0 : (params.foldK!==undefined?params.foldK:0.12)*Math.pow(0.7, attempt),
          });
      ribbons = [];
      const baseSeed = (state.seed + attempt*104729 + effLanes*31)>>>0;
      for(let i=0;i<effLanes;i++){
        const p = Object.assign({}, p0, {lanes:effLanes});
        const rb = buildRibbon(p, baseSeed, i);
        rb.clampMin = [0,0,0];
        rb.clampMax = [box.w, box.h, box.d];
        // заполняющая лента уже промарширована и утянута внутри
        // buildRibbon — лишний проход только портит результат
        if(!rb.fillMode) marchRibbon(rb);
        ribbons.push(rb);
      }
      // направляющая не вписалась без сильного сжатия — другой вариант
      // (лестница сама укоротит и успокоит ленту)
      if(ribbons.some(rb=>!rb.fitScale)){
        clear = {collisions:1e6, minClear:0, near:0, self:0, cross:0, attempt, lanes:effLanes};
        window.__ladder.push([attempt, 'nofit']);
        if(!best || clear.collisions<best.clear.collisions) best={ribbons, clear};
        continue;
      }
      clear = resolveCollisions(ribbons, box);
      clear.attempt = attempt; clear.lanes = effLanes;
      // вылет за габарит после разведения лечится утяжкой сцены
      // (сжать направляющие по перебравшим осям + перемаршировать),
      // иначе годная пластика бракуется из-за пары сантиметров
      const shr=[1,1,1];
      for(let fx=0; fx<6; fx++){
        const mM2=[1e9,1e9,1e9], xM2=[-1e9,-1e9,-1e9];
        for(const rb of ribbons){
          const b3=geoBBox(rb);
          for(let k3=0;k3<3;k3++){ mM2[k3]=Math.min(mM2[k3],b3.min[k3]); xM2[k3]=Math.max(xM2[k3],b3.max[k3]); }
        }
        const lim3=[box.w,box.h,box.d];
        const ov3=[0,1,2].map(k3=>xM2[k3]-mM2[k3]+ROD_D-lim3[k3]);
        if(!ov3.some(v=>v>2)) break;
        const bc3=[0,1,2].map(k3=>(mM2[k3]+xM2[k3])/2);
        for(let k3=0;k3<3;k3++){
          if(ov3[k3]<=2) continue;
          const sc3=Math.max(effLanes>1?0.72:0.9,(lim3[k3]-ROD_D-10-fx*5)/Math.max(1,xM2[k3]-mM2[k3]));
          shr[k3]*=sc3*0.99;
          for(const rb of ribbons) for(const c of rb.guideC) c[k3]=bc3[k3]+(c[k3]-bc3[k3])*sc3*0.99;
        }
        for(const rb of ribbons) if(rb.formClamp) for(const c of rb.guideC) rb.formClamp(c);
        for(const rb of ribbons) marchRibbon(rb);
        clear = resolveCollisions(ribbons, box);
        clear.attempt = attempt; clear.lanes = effLanes;
      }
      // ДОВОДКА ДО ГАБАРИТА. После разведения витков композиция может не
      // доходить до граней габарита: растягиваем направляющие по недобравшим
      // осям и перемарширываем. Шаг мелкий (не больше 6% за проход) и
      // принимается только чистый, вписанный и доложенный результат —
      // иначе откат к предыдущему состоянию
      const sceneBB=()=>{
        const mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
        for(const rb of ribbons){
          const b=geoBBox(rb);
          for(let k3=0;k3<3;k3++){ mn[k3]=Math.min(mn[k3],b.min[k3]); mx[k3]=Math.max(mx[k3],b.max[k3]); }
        }
        return {mn, mx, ext:[0,1,2].map(k3=>mx[k3]-mn[k3]+ROD_D)};
      };
      const laidOk=()=>ribbons.every(rb=>!rb.giMap || !rb.guideC ||
        (rb.giMap[rb.giMap.length-1]/Math.max(1,rb.guideC.length-2)>=0.9 && (rb.escapes||0)<=2));
      if(clear.collisions===0) for(let gx=0; gx<3; gx++){
        const sb=sceneBB(), lim4=[box.w,box.h,box.d];
        const need4=[0,1,2].map(k3=>(lim4[k3]-6)/Math.max(1,sb.ext[k3]));
        if(!need4.some(v=>v>1.015)) break;
        const snap=ribbons.map(rb=>rb.guideC.map(c=>c.slice()));
        const bc4=[0,1,2].map(k3=>(sb.mn[k3]+sb.mx[k3])/2);
        for(let k3=0;k3<3;k3++){
          if(need4[k3]<=1.015) continue;
          const sc4=Math.min(1.06, need4[k3]);
          for(const rb of ribbons) for(const c of rb.guideC) c[k3]=bc4[k3]+(c[k3]-bc4[k3])*sc4;
        }
        for(const rb of ribbons) if(rb.formClamp) for(const c of rb.guideC) rb.formClamp(c);
        for(const rb of ribbons) marchRibbon(rb);
        const cl4=resolveCollisions(ribbons, box);
        const sb2=sceneBB();
        const fits4=[0,1,2].every(k3=>sb2.ext[k3]<=lim4[k3]+2);
        if(cl4.collisions===0 && fits4 && laidOk()){
          clear=cl4; clear.attempt=attempt; clear.lanes=effLanes;
        } else {
          ribbons.forEach((rb,ri)=>{ rb.guideC=snap[ri]; });
          for(const rb of ribbons) marchRibbon(rb);
          clear=resolveCollisions(ribbons, box);
          clear.attempt=attempt; clear.lanes=effLanes;
          break;
        }
      }
      let ovr=false;
      const mM=[1e9,1e9,1e9], xM=[-1e9,-1e9,-1e9];
      {
        for(const rb of ribbons){
          const b=geoBBox(rb);
          for(let k2=0;k2<3;k2++){ mM[k2]=Math.min(mM[k2],b.min[k2]); xM[k2]=Math.max(xM[k2],b.max[k2]); }
        }
        const lim2=[box.w,box.h,box.d];
        for(let k2=0;k2<3;k2++) if(xM[k2]-mM[k2]+ROD_D > lim2[k2]+2) ovr=true;
      }
      if(ovr) clear.collisions += 1000;
      window.__ladder.push([attempt, clear.collisions, clear.self, ovr?1:0]);
      if(!best || clear.collisions<best.clear.collisions) best={ribbons, clear};
      if(clear.collisions===0){
        const totLen=ribbons.reduce((a2,rb)=>a2+rb.ribbonLen,0);
        // ВОРОТА КАЧЕСТВА: марш иногда застревает (орбитальная ловушка на
        // вершине разворота) и лента обрывается на середине направляющей —
        // получается комок в трети габарита с метражом вдвое ниже правила
        // производства. Такой вариант чистый и вписанный, но показывать
        // его нельзя: лестница идёт дальше с другим зерном.
        // сильно утянутая сцена — та самая «вырожденная» генерация:
        // композиция сплющена в треть габарита. Это не брак геометрии,
        // но показывать её нельзя — ищем дальше
        // ФАКТИЧЕСКИЙ РАЗМЕР = ЗАДАННЫЙ ГАБАРИТ. Композиция обязана доходить
        // до граней габарита по всем трём осям: недобор — это не «спокойный
        // вариант», а невыполненное задание. Растяжка в buildRibbon тянет
        // ленту до граней, а здесь стоят ворота: если по какой-то оси лента
        // не дотянулась, лестница идёт дальше с другим зерном
        const fillBox=Math.min(...[0,1,2].map(k2=>
          (xM[k2]-mM[k2]+ROD_D)/[box.w,box.h,box.d][k2]));
        // порог заполнения габарита: 0.91 — компромисс между «дотянуться до
        // граней» и временем подбора (за воротами лестница перебирает
        // варианты, каждый — полная сборка). Среди чистых вариантов всё
        // равно выбирается тот, что заполняет больше
        // ПОКРЫТИЕ ОБЪЁМА В ВОРОТАХ. Лента, прошедшая одной прядью, габарит
        // заполняет, а объём — нет: такие варианты пользователь отбраковывал
        // («такого быть не должно»). Для «на ребро» проверка не действует:
        // спираль вписана в круглую форму, углы габарита пустые по построению
        const covA=volCov(ribbons, box);
        const covOk=(params.plast==="edge") || covA>=COV_MIN;
        // порог заполнения в воротах — 0.90: вариант обязан и доходить до
        // граней габарита, и покрывать объём. При 0.93 ворота почти не
        // проходились, и лестница отдавала либо плотный, но пустой по объёму
        // вариант, либо разошедшийся, но утянутый
        const gate=fillGate(ribbons, box, totLen) && Math.min(shr[0],shr[1],shr[2])>=0.86
                   && fillBox>=0.90 && covOk;
        // ВЫБОР ЛУЧШЕГО СРЕДИ ЧИСТЫХ. Вариант, прошедший ворота, всегда лучше
        // более длинного, но вырожденного. Среди прошедших ворота сравниваем по
        // заполнению габарита, потом по покрытию объёма, потом по метражу.
        // Среди НЕ прошедших ворота — наоборот, СНАЧАЛА ПО ПОКРЫТИЮ ОБЪЁМА:
        // замер показал, что иначе лестница отдаёт вариант с покрытием 0.47
        // вместо найденного тут же 0.60 из-за разницы в заполнении в 2-3%, а
        // именно такие «одной прядью» варианты и отбраковывались
        const cmp=(f1,c1,l1, f2,c2,l2)=>gate
          ? (f1>f2+0.01 || (Math.abs(f1-f2)<=0.01 &&
              (c1>c2+0.02 || (Math.abs(c1-c2)<=0.02 && l1>l2))))
          : ((f1>=0.85)!==(f2>=0.85) ? (f1>=0.85)     // сильно утянутые — в конец
             : (c1>c2+0.03 || (Math.abs(c1-c2)<=0.03 &&
                (f1>f2+0.01 || (Math.abs(f1-f2)<=0.01 && l1>l2)))));
        const better = !bestClean || (gate && !bestClean.gate) ||
          (gate===bestClean.gate && cmp(fillBox, covA, totLen,
                                        bestClean.fill, bestClean.cov||0, bestClean.len));
        if(better) bestClean={ribbons, clear, len:totLen, gate, fill:fillBox, cov:covA};
        window.__ladder.push([attempt, 'clean', gate?'fill-ok':'underfilled',
                              'cov'+covA.toFixed(2)]);
        if(gate) break outer;
      }
    }
  }
  let needRescue=true;
  if(bestClean){ ribbons=bestClean.ribbons; clear=bestClean.clear; needRescue=!bestClean.gate; }
  else { ribbons = best.ribbons; clear = best.clear; }
  // страховка: спокойный вариант вместо брака И вместо вырожденного
  // (чистого, но оборванного или сплющенного) варианта
  let bestRescue=null;
  if(!directBuilt && (clear.collisions>0 || needRescue)){
    rescue:
    for(let rl=lanes; rl>=1; rl--){
      for(let rs=0; rs<(rl>2?3:6); rs++){
        // каждая следующая попытка короче и спокойнее: короткая плавная
        // лента разводится всегда — касания не показываются никогда
        const pS = Object.assign({}, params, {
          twistAmt:0, ampl:params.ampl*0.45,
          lengthK: Math.max(0.35, params.lengthK*0.8*Math.pow(0.82, rs)),
          // и в страховочном варианте центральный контур независим
          foldK: params.foldK*0.7,
          // спираль «на ребро» разводится снижением плотности витков
          densK: Math.max(0.22, 0.85*Math.pow(0.82, rs)),
          // ручную добавку страховка не держит: главное — чистая композиция
          addLen: (params.addLen||0)*Math.max(0, 1-0.25*rs),
          // страховка НЕ ПОДМЕНЯЕТ ПЛАСТИКУ: для «на ребро» плоская волна —
          // это уже другая композиция, там спираль разводится плотностью
          style: (rs>=4 && params.plast!=="edge") ? "wave" : params.style});
        const rr = [];
        const rSeed = (state.seed + 900001 + rs*57 + rl*31)>>>0;
        for(let i=0;i<rl;i++){
          const pp = Object.assign({}, pS, {lanes:rl});
          const rb = buildRibbon(pp, rSeed, i);
          rb.clampMin = [0,0,0];
          rb.clampMax = [box.w, box.h, box.d];
          if(!rb.fillMode) marchRibbon(rb);
          rr.push(rb);
        }
        if(rr.some(rb=>!rb.fitScale)) continue;
        const cl2 = resolveCollisions(rr, box);
        let fits=true, fillR=1;
        {
          const mM=[1e9,1e9,1e9], xM=[-1e9,-1e9,-1e9];
          for(const rb of rr){
            const b=geoBBox(rb);
            for(let k2=0;k2<3;k2++){ mM[k2]=Math.min(mM[k2],b.min[k2]); xM[k2]=Math.max(xM[k2],b.max[k2]); }
          }
          const lim2=[box.w,box.h,box.d];
          for(let k2=0;k2<3;k2++){
            const ext2=xM[k2]-mM[k2]+ROD_D;
            if(ext2 > lim2[k2]+2) fits=false;
            fillR=Math.min(fillR, ext2/lim2[k2]);
          }
        }
        if(cl2.collisions===0 && fits && fillGate(rr, box, rr.reduce((a2,rb)=>a2+rb.ribbonLen,0))){
          cl2.attempt=99; cl2.lanes=rl;
          // страховка тоже обязана заполнять габарит: берём не первый годный
          // вариант, а лучший по заполнению — иначе спокойная короткая лента
          // повисает в середине габарита
          const covR=volCov(rr, box);
          const covOkR=(params.plast==="edge") || covR>=COV_MIN;
          if(!bestRescue || fillR>bestRescue.fill) bestRescue={rr, cl2, fill:fillR, cov:covR};
          if(fillR>=0.93 && covOkR){ ribbons=rr; clear=cl2; break rescue; }
        }
      }
    }
    // ни один страховочный вариант не дотянул до габарита — берём лучший
    // из них, но только если он ЗАМЕТНО ЛУЧШЕ найденного чистого ПО
    // ПОКРЫТИЮ ОБЪЁМА (+0.05) и не сильно хуже по заполнению. Раньше
    // страховка выигрывала одним заполнением: на глубоких боксах
    // (2400×1200×800 — жалоба «не приемлемо») чистый вариант лестницы с
    // покрытием 0.42 подменялся змейкой во весь габарит, но одной прядью —
    // тем самым вырожденным видом, который пользователь отбраковывал
    if(bestRescue && (clear.collisions>0 ||
       (needRescue && (bestRescue.cov||0) > ((bestClean&&bestClean.cov)||0)+0.05
        && bestRescue.fill > ((bestClean&&bestClean.fill)||0)-0.03))){
      ribbons=bestRescue.rr; clear=bestRescue.cl2;
    }
  }
  // ПОСЛЕДНИЙ РУБЕЖ: если лестница и страховка не дали чистого варианта,
  // строим заведомо разводимую спокойную дугу — композиций с касаниями
  // не бывает ни при каких настройках
  if(clear.collisions>0){
    let bestLast=null;
    window.__lastR=[];
    for(let k4=0;k4<8;k4++){
      // ПОСЛЕДНИЙ РУБЕЖ СОХРАНЯЕТ ПЛАСТИКУ. Плоская дуга стиля «wave» ломала
      // выбор «на ребро»: композиция выходила лежащей волной, а не спиралью
      // на ребре. Для «на ребро» остаёмся в своей пластике и просто снижаем
      // плотность, для «микса» — прежняя гарантированно разводимая дуга
      const pF = (params.plast==="edge")
