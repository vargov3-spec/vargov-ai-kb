<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vargov®Design — конфигуратор ленточных композиций (LC0217)</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#131318; --panel2:#1a1a21; --line:#2a2a33;
    --gold:#c9a227; --gold2:#e8c96a; --txt:#e8e6e1; --dim:#9b9890;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1{font-size:16px; font-weight:600; letter-spacing:.06em}
  header h1 b{color:var(--gold2); font-weight:700}
  header .sub{color:var(--dim); font-size:12px}
  #layout{flex:1; display:flex; min-height:0}
  #panel{
    width:334px; min-width:290px; overflow-y:auto; background:var(--panel);
    border-right:1px solid var(--line); padding:14px 14px 24px 16px;
    scrollbar-width:thin; scrollbar-gutter:stable;
  }
  #stage{flex:1; position:relative; min-width:0}
  /* индикатор генерации: вращение задано CSS-анимацией трансформа — она идёт
     на композиторе и продолжается, пока основной поток занят сборкой */
  #busy{
    position:absolute; left:50%; bottom:54px; transform:translateX(-50%);
    display:none; align-items:center; gap:10px; padding:9px 16px;
    background:rgba(16,16,20,.86); border:1px solid var(--line);
    border-radius:20px; color:var(--gold2); font-size:13px; pointer-events:none;
  }
  #busy.on{display:flex}
  #busy .spin{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(201,162,39,.25); border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* кнопка повторной генерации — по центру справа в окне композиции
     (по просьбе пользователя вместо круглой кнопки с подсказкой) */
  #regen2{
    position:absolute; right:22px; top:50%; transform:translateY(-50%);
    padding:12px 18px; border-radius:8px; border:1px solid var(--gold2);
    cursor:pointer; font-size:14px; letter-spacing:.02em;
    background:linear-gradient(180deg, #d8b356, #a9822a 70%, #8a6a20);
    color:#1a1408; box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  #regen2:hover{filter:brightness(1.12)}
  #regen2:active{transform:translateY(calc(-50% + 1px))}
  #lightBtn{
    position:absolute; left:14px; top:12px; width:42px; height:42px;
    border-radius:50%; border:1px solid var(--gold2); cursor:pointer;
    background:linear-gradient(180deg, #d8b356, #a9822a 70%, #8a6a20);
    color:#1a1408; font-size:19px;
    line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  #lightBtn:hover{filter:brightness(1.12)}
  #lightBtn:active{transform:translateY(1px)}
  #lightBtn.lit{box-shadow:0 4px 16px rgba(0,0,0,.25)}
  canvas{display:block; width:100%; height:100%; cursor:grab}
  canvas:active{cursor:grabbing}
  fieldset{border:1px solid var(--line); border-radius:8px; padding:10px 12px 12px; margin-bottom:14px}
  legend{padding:0 6px; color:var(--gold2); font-size:12px; letter-spacing:.08em; text-transform:uppercase}
  .row{display:flex; gap:8px; align-items:center; margin:7px 0}
  .row label{flex:1; color:var(--dim)}
  .row input[type=number]{
    width:86px; background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; font-size:13px;
  }
  .row input[type=range]{flex:1.2; accent-color:var(--gold)}
  .row select{
    flex:1.2; background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:5px 6px; font-size:13px;
  }
  .row .val{width:44px; flex:none; text-align:right; color:var(--txt); font-size:12px; font-variant-numeric:tabular-nums}
  .row input[type=checkbox]{accent-color:var(--gold)}
  .colorBtn{display:flex; align-items:center; justify-content:center; gap:8px;
    width:152px; min-width:152px; height:34px; overflow:hidden}
  .colorBtn span:last-child{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px}
  .colorBtn.off{border-style:dashed !important; background:transparent !important;
    color:var(--dim) !important; border-color:#3f3f49 !important}
  .swdot{width:16px; height:16px; min-width:16px; border-radius:3px;
         box-shadow:0 0 0 1px rgba(255,255,255,.22)}
  .ralOverlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
              display:flex; align-items:center; justify-content:center}
  .ralPop{background:#17171d; border:1px solid #34343e; border-radius:12px;
          padding:16px 16px 12px; width:min(560px, 92vw); max-height:82vh;
          display:flex; flex-direction:column; box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .ralPop h3{font:600 14px system-ui; color:#e8c46a; margin:0 0 10px}
  .ralFind{margin:0 0 10px; padding:7px 10px; background:#101014; color:#e8e6e1;
           border:1px solid #2a2a33; border-radius:8px; font-size:13px; width:100%}
  .ralGrid{display:grid; grid-template-columns:repeat(12, 1fr); gap:5px;
           overflow-y:auto; padding:2px 4px 8px}
  .ralSw{aspect-ratio:1; border-radius:3px; cursor:pointer; border:2px solid transparent}
  .ralSw:hover{transform:scale(1.18); border-color:#fff}
  .ralSw.sel{border-color:#e8c46a}
  .ralCur{font-size:12px; opacity:.75; margin-top:8px}
  .anyc{grid-column:1/-1; display:flex; align-items:center; gap:9px; cursor:pointer;
        margin-top:2px}
  .anyc input[type=color]{width:0; height:0; opacity:0; position:absolute; pointer-events:none}
  .anyc-cap{font-size:12px; opacity:.75}

  .sw.sel{border-color:var(--gold2)}
  .btn{
    display:block; width:100%; text-align:center; background:linear-gradient(180deg,#d9b13a,#a8841c);
    color:#17130a; font-weight:700; border:none; border-radius:8px; padding:10px;
    font-size:14px; cursor:pointer; margin:10px 0 6px; letter-spacing:.03em;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn2{
    display:inline-block; width:auto; flex:1; background:var(--panel2); color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:8px 6px; font-size:12.5px;
    cursor:pointer; text-align:center; text-decoration:none;
  }
  .btn2:hover{border-color:var(--gold)}
  input[type=range]{accent-color:var(--gold); width:120px; margin:0}
  /* без штатных стрелок-спиннеров у числовых полей (решение пользователя) */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  input[type=number]{-moz-appearance:textfield; appearance:textfield}
  .tiles{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0}
  .tile{flex:1 1 45%; border:1px solid #33333c; border-radius:9px; background:#141418;
    cursor:pointer; padding:8px 4px 6px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--txt); font-size:11.5px; user-select:none}
  .tile:hover{border-color:#55555f}
  .tile.on{border-color:var(--gold2); color:var(--gold2);
    box-shadow:inset 0 0 0 1px var(--gold2), 0 2px 10px rgba(0,0,0,.35)}
  .tiles.form .tile{flex:0 0 calc(25% - 6px); padding:6px 2px 5px; font-size:10.5px}
  .tile canvas{display:block}
  details.adv{margin:10px 0; border:1px solid #26262c; border-radius:10px; padding:7px 12px}
  details.adv summary{cursor:pointer; color:var(--dim); font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; outline:none}
  details.adv summary:hover{color:var(--gold2)}
  details.adv[open] summary{color:var(--gold2); margin-bottom:6px}
  #stat{position:absolute; left:14px; bottom:12px; color:var(--gold2); font-size:12.5px;
    pointer-events:none; font-variant-numeric:tabular-nums; line-height:1.55;
    text-shadow:0 1px 3px rgba(0,0,0,.45)}
  #stat span{opacity:.62}
  /* светлый шоурум: надписи поверх сцены — чёрным (решение пользователя) */
  #stage.light #dims{color:#1a1a1e; text-shadow:0 1px 3px rgba(255,255,255,.55)}
  #stage.light #stat{color:#1a1a1e; background:none;
    text-shadow:0 1px 3px rgba(255,255,255,.55)}
  #stat:empty{display:none}
  /* бегунок сборки — внизу окна генерации (перенесён из панели по
     решению пользователя) */
  #asmBar{position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    width:min(52%, 560px); display:flex; align-items:center; gap:12px; z-index:4}
  #asmBar span{color:var(--gold2); font-size:12.5px; opacity:.85;
    user-select:none; text-shadow:0 1px 3px rgba(0,0,0,.45)}
  #asmBar input[type=range]{flex:1; width:auto}
  #stage.light #asmBar span{color:#1a1a1e; text-shadow:0 1px 3px rgba(255,255,255,.55)}
  #toast{position:absolute; left:50%; top:14px; transform:translateX(-50%);
    max-width:70%; background:rgba(24,22,14,.92); border:1px solid var(--gold2);
    color:#e8d9a8; font-size:13px; padding:9px 14px; border-radius:8px;
    opacity:0; pointer-events:none; transition:opacity .3s}
  #toast.show{opacity:1}
  .btns{display:flex; gap:8px; flex-wrap:wrap}
  .btns .btn2{flex:1 1 44%}
  .favRow{display:flex; gap:6px; align-items:center; margin:4px 0; font-size:12px}
  .favRow img{width:58px; height:38px; object-fit:cover; border-radius:4px;
    border:1px solid #33333c; background:#101014; flex:none}
  .favRow .favTxt{flex:1; color:var(--txt)}
  .btn3{background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; font-size:11.5px; cursor:pointer}
  .btn3:hover{border-color:var(--gold)}
  #spec{font-size:13px}
  #spec table{width:100%; border-collapse:collapse}
  #spec td{padding:3px 0; vertical-align:top}
  #spec td:last-child{text-align:right; font-variant-numeric:tabular-nums; color:var(--txt)}
  #spec td:first-child{color:var(--dim)}
  #spec .hl td{color:var(--gold2); font-weight:600; font-size:14px}
  .note{color:var(--dim); font-size:11.5px; margin-top:8px; line-height:1.5}
  #dims{
    position:absolute; right:14px; top:12px; color:var(--gold2); font-size:13px;
    pointer-events:none; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  @media (max-width:760px){
    #layout{flex-direction:column}
    #panel{width:100%; max-height:46%; border-right:none; border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <h1><b>Vargov®Design</b> · Конфигуратор ленточных композиций</h1>
  <span class="sub">тип «лента из стеклянных стержней» — по мотивам LC0217 / LC0217-1</span>
</header>

<div id="layout">
  <div id="panel">
    <fieldset>
      <legend>Габариты композиции, мм</legend>
      <div class="row"><label for="dimW">Ширина (X)</label><input id="dimW" type="number" min="1500" max="20000" step="50" value="2400"></div>
      <div class="row"><label for="dimD">Глубина (Y)</label><input id="dimD" type="number" min="600" max="20000" step="50" value="900"></div>
      <div class="row"><label for="dimH">Высота (Z)</label><input id="dimH" type="number" min="600" max="20000" step="50" value="800"></div>
      <div class="row" id="ringRow"><label for="ringD" title="Лента идёт по кругу заданного диаметра (по нейтральной оси кольца); длина берётся от окружности, радиальная глубина — пятая часть диаметра">Кольцо</label>
        <select id="ringD">
          <option value="0" selected>— прямая лента —</option>
          <option value="2000">Ø2000 мм</option>
          <option value="3000">Ø3000 мм</option>
          <option value="4000">Ø4000 мм</option>
        </select></div>
      <div class="row"><label for="dimC">Высота до потолка<br><span style="font-size:11px;opacity:.6">длина тросов от верха композиции</span></label>
        <input id="dimC" type="number" min="0" max="10000" step="50" value="600"></div>
      <select id="plan" style="display:none"></select>
      <div class="row" id="formRow"><label for="form">Форма</label>
        <select id="form">
          <option value="box" selected>Параллелепипед</option>
          <option value="sphere">Шар</option>
          <option value="cyl">Цилиндр</option>
          <option value="pyr">Пирамида (вершиной вниз)</option>
          <option value="drop">Капля</option>
          <option value="barrel">Барабан</option>
          <option value="waist">Песочные часы</option>
          <option value="rhomb">Ромб</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Пластика ленты</legend>
      <div class="tiles" id="plastTiles"></div>
      <select id="plast" style="display:none">
        <option value="mix" selected>Микс</option>
        <option value="edge">На ребро</option>
      </select>
      <div class="tiles form" id="formTiles"></div>
    </fieldset>

    <fieldset>
      <legend>Стекло и свет</legend>
      <div class="row"><label>Цвет трубок</label>
        <button class="btn2 colorBtn" id="colorBtn" type="button">
          <span class="swdot" id="colorDot"></span><span id="colorName"></span></button></div>
      <input id="gradC" type="hidden" value="RAL1005">
      <div class="row"><label>Градиент</label>
        <button class="btn2 colorBtn" id="gradBtn" type="button">
          <span class="swdot" id="gradDot"></span><span id="gradName"></span></button></div>
      <div class="row"><label>Каркас</label>
        <button class="btn2 colorBtn" id="frameBtn" type="button">
          <span id="frameName"></span></button></div>
      <input id="gradOn" type="checkbox" hidden>
    </fieldset>

    <details class="adv" id="advBox">
      <summary>Подробно</summary>
      <div class="row"><label for="rows">Рядность</label>
        <select id="rows">
          <option value="1">1 ряд</option>
          <option value="2" selected>2 ряда</option>
        </select>
      </div>
      <select id="frame" style="display:none">
        <option value="gold" selected>Золото</option>
        <option value="chrome">Хром</option>
      </select>
      <div class="row"><label for="rWidth">Длина стержня</label>
        <select id="rWidth">
          <option value="100">100 мм</option>
          <option value="150" selected>150 мм</option>
          <option value="200">200 мм</option>
          <option value="250">250 мм</option>
          <option value="300">300 мм</option>
          <option value="350">350 мм</option>
        </select>
      </div>
      <div class="row"><label for="rodD">Диаметр стержня</label>
        <select id="rodD">
          <option value="8">Ø8 мм</option>
          <option value="10" selected>Ø10 мм</option>
        </select>
      </div>
      <div class="row"><label for="leds">Диоды на ленте</label><input id="leds" type="checkbox" checked></div>
      <div class="row"><label for="cables">Тросы</label><input id="cables" type="checkbox" checked></div>
      <div class="row"><label for="showBox">Габаритный бокс</label><input id="showBox" type="checkbox" checked></div>
    </details>

    <div class="btns">
      <button class="btn2" id="favAdd">⭐ В избранное</button>
      <button class="btn2" id="favLink">Ссылка на вариант</button>
    </div>
    <details class="adv" id="prodBox">
      <summary>Для производства</summary>
      <div class="btns">
        <button class="btn2" id="saveCsv">Спецификация CSV</button>
        <button class="btn2" id="saveObj">3D-модель OBJ</button>
        <button class="btn2" id="saveDxf">Чертёж DXF (3D)</button>
        <button class="btn2" id="saveMont">Монтажная карта CSV</button>
        <button class="btn2" id="savePat">Выкройка 1:1 (печать)</button>
      </div>
    </details>

    <fieldset style="margin-top:14px" id="favBox" hidden>
      <legend>Избранные композиции</legend>
      <div id="favList"></div>
    </fieldset>

    <details class="adv" id="specBox">
      <summary>Расчёт</summary>
      <div id="spec"></div>
    </details>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="dims"></div>
    <div id="busy"><span class="spin"></span><span id="busyTxt">Генерация варианта композиции…</span></div>
    <button id="regen2" title="Обновить композицию" aria-label="Обновить композицию">Обновить композицию</button>
    <button id="lightBtn" title="Светлый шоурум" aria-label="Светлый шоурум">☀</button>
    <div id="stat"></div>
    <div id="asmBar" title="Монтаж: композиция собирается станция за станцией, как на объекте">
      <span>Сборка</span><input id="asm" type="range" min="0" max="100" value="100">
    </div>
    <div id="toast"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Vargov®Design — генератор «ленточных» композиций (LC0217).
   Лента = гибкий каркас (проволока Ø5 мм по кантам + осевая
   LED-струна) с плотно уложенными поперёк стеклянными стержнями
   Ø15 мм, L 150–300 мм. Генератор вписывает извивающуюся ленту
   в заданные габариты W×D×H.
   Все размеры в мм. Y — вверх.
   ============================================================ */

// ДАННЫЕ ПРОИЗВОДСТВА: стеклянная трубка Ø8 или Ø10 со стенкой 1.5 мм,
// длина трубки (= ширина ленты) 100/150/200/250/300/350 мм,
// каркас — гибкая стальная проволока Ø3 мм,
// диоды 0.1 W / 3 V — по одному на каждые 100 мм каркаса.
let ROD_D = 10;          // диаметр стеклянной трубки (8 или 10)
let ROD_R = ROD_D/2;
let ROD_STEP = ROD_D+1.6;// шаг стержней вдоль ленты (зазор у оси ~1.6 мм)
const WIRE_D = 3;        // проволока каркаса
const WIRE_AREA = Math.PI*(WIRE_D/2)*(WIRE_D/2);
const ROD_LENGTHS = [100,150,200,250,300,350]; // допустимые длины трубки
const GAP_MIN = 1, GAP_MAX = 8;  // зазор между соседними стержнями, мм
// (правило производства: не меньше 1 мм и не больше 8 мм — на большем
// зазоре лента перестаёт читаться как плотное полотно)
const LED_PITCH = 100;   // шаг диодов по каркасу (0.1 W, 3 V каждый)
const LED_W = 0.1, LED_V = 3;
const CABLE_STEP = 650;  // примерный шаг подвесов
const GLASS_DENSITY = 2.5e-3;  // г/мм³ (стекло)
// ВОЗДУХ МЕЖДУ ТОРЦОМ ТРУБКИ И ПРОВОЛОКОЙ КАРКАСА: стержень не доходит до
// каркаса, поэтому каркас и диоды на нём видны насквозь, а рычаг правила
// зазора считается по фактической трубке (наклон рядов допустим больше)
const ROD_AIR = 6;
const GLASS_WALL = 1.5;        // стенка стеклянной трубки, мм
const STEEL_DENSITY = 7.85e-3; // г/мм³ (сталь, проволока каркаса)
/* диаметр трубки задаётся в UI: шаг стержней и допуски зазоров
   пересчитываются от него (зазор осей = диаметр + воздух) */
function setRodD(d){
  ROD_D = d; ROD_R = d/2; ROD_STEP = d+1.6;
  CLEAR_FAR = ROD_D + 11;              // 10 мм минимального сближения + запас
  // УТОЧНЕНИЕ ПРОИЗВОДСТВА: между трубками минимальный зазор 0.1 мм,
  // касание допустимо, пересечение — никогда. Прежний лимит (зазор ~1 мм)
  // ложно отбраковывал примыкания мостов стыка, не добравшие доли мм
  CLEAR_NEAR = ROD_D + 0.1;
  SKIP_NEAR = Math.max(2, Math.round(33/ROD_STEP));   // окна — в мм, не в станциях
  NEAR_WIN  = Math.max(SKIP_NEAR+2, Math.round(133/ROD_STEP));
}
// Минимальный радиус изгиба: правило Ø200 снято по решению
// производства. Остаётся физика вязки: шаг стержней и зазоры
// (веер) сами не дают согнуть ленту круче, чем позволяет стекло.

// ближайший цвет каталога к произвольному RGB — им подменяется средний
// цвет градиента: красить можно только цветами каталога
function nearestRal(rgb){
  let best=null, bd=1e9;
  for(const g of GLASS_COLORS){
    const c=hexRgb(g.c);
    const d=(c[0]-rgb[0])**2 + (c[1]-rgb[1])**2 + (c[2]-rgb[2])**2;
    if(d<bd){ bd=d; best=g; }
  }
  return best;
}

  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l];}
};

/* детерминированный ГПСЧ */
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* Catmull-Rom по массиву точек, t∈[0..1] по сегментам */
function catmullRom(pts, t){
  const n = pts.length-1;
  const f = Math.min(n-1e-9, Math.max(0, t*n));
  const i = Math.floor(f), u = f-i;
  const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[Math.min(n,i+1)], p3 = pts[Math.min(n,i+2)];
  const out = [0,0,0];
  for(let k=0;k<3;k++){
    out[k] = 0.5*((2*p1[k]) + (-p0[k]+p2[k])*u
           + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u*u
           + (-p0[k]+3*p1[k]-3*p2[k]+p3[k])*u*u*u);
  }
  return out;
}

/* ============================================================
   Генерация одной ленты.
   1. Контрольные точки осевой линии по выбранному стилю.
   2. Ресемплирование по длине дуги.
   3. Rotation-minimizing frame (метод двойного отражения)
      + управляемая закрутка.
   4. Стержни поперёк ленты, канты, LED, подвесы.
   ============================================================ */

/* ============================================================
   ФОРМЫ КОМПОЗИЦИИ (10 шт).
   Лента ВСЕГДА навивается вокруг осевой линии формы (spine): виток —
   изгиб вокруг стержней (физически самый лёгкий для каркаса), шаг
   витка держит зазор между витками, стержни идут вдоль осевой линии.
   Форма задаёт только то, КУДА идёт сама осевая линия, поэтому любая
   из форм проходима маршем и заполняет свой объём одинаково плотно.
   Сечение навивки — эллипс r1×r2 в рамке (ref ⊥ хода): r1 вдоль ref,
   r2 вдоль ход×ref. Размеры сечения и параметры формы подобраны так,
   чтобы соседние проходы осевой линии были разнесены не меньше чем на
   диаметр навивки + воздух — тогда форма не пересекает сама себя.
   ============================================================ */
function sectionLoop(th, A1, A2){
  const A=Math.max(A1,A2), B=Math.max(1,Math.min(A1,A2));
  const st=A-B;                       // полудлина прямого участка
  const P=4*st+2*Math.PI*B;           // периметр стадиона
  let s=(((th/(Math.PI*2))%1)+1)%1*P;
  let x,y;
  if(s<2*st){ x=-st+s; y=B; }
  else if((s-=2*st)<Math.PI*B){ const f=Math.PI/2-s/B; x=st+B*Math.cos(f); y=B*Math.sin(f); }
  else if((s-=Math.PI*B)<2*st){ x=st-s; y=-B; }
  else { const f=-Math.PI/2-(s-2*st)/B; x=-st+B*Math.cos(f); y=B*Math.sin(f); }
  return A1>=A2 ? [x,y] : [y,x];
}
function sectionPerim(A1, A2){
  const A=Math.max(A1,A2), B=Math.max(1,Math.min(A1,A2));
  return 4*(A-B)+2*Math.PI*B;
}

/* Минимальный радиус кривизны ОСЕВОЙ ЛИНИИ формы. Технологический
   предел изгиба ленты — R_FIT=80 мм, но по осевой линии одновременно
   идёт навивка, поэтому форме оставляем двойной запас. Именно из-за
   нарушения этого правила вытянутые кольца и зигзаги обрывали марш:
   у эллипса 1025×265 радиус на остром конце всего 68 мм. */
const SP_R = 170;
/* частота синусоидального меандра, при которой радиус на гребне ещё
   допустим: R = (период/2π)²/амплитуда ≥ SP_R */
function sineFMax(run, A){
  return run/(2*Math.PI*Math.sqrt(SP_R*Math.max(1,A)));
}
/* ОБОЛОЧКА УКЛАДКИ — габарит целиком: осевая линия навивки идёт вдоль
   самой длинной стороны, сечение навивки заполняет две другие.
   Полуоси сечения считаются от габарита с вычетом ширины ленты: лента
   может лечь поперёк навивки (перекат на ребро) и выступить за радиус
   витка на полширины — иначе композиция вылетает за бокс, её утягивает
   утяжка и она вырождается. */
/* ФОРМЫ ГАБАРИТА. Каждая форма — это ПРОФИЛЬ РАДИУСА вдоль своей оси:
   prof(h) при h от 0 (нижний/начальный конец оси) до 1 (верхний) даёт долю
   допустимого поперечного радиуса. Сечение либо эллипс (тела вращения),
   либо прямоугольник (rect: параллелепипед, пирамида, ромб).
   У шара ось — самая длинная сторона габарита (лента ложится вдоль неё),
   у остальных форм ось вертикальная: «вершиной вниз» имеет смысл только
   по вертикали. */
/* СИЛУЭТЫ В ПЛАНЕ (вид сверху) для пластики «на ребро» — по рисункам от руки.
   Каждый силуэт задан радиальной функцией r(θ) с максимумом 1: витки спирали
   несутся по этому контуру и вкладываются друг в друга, как на рисунке.
   Амплитуды подобраны так, чтобы изгиб «плашмя» оставался проходимым для
   каркаса (радиус кривизны в плане не уходит ниже технологического). */
const PLAN_SHAPES = {
  circle: {label:"Круг (по умолчанию)", r:()=>1},
  star4:  {label:"Звезда (4 луча)",     r:(a)=>(1+0.30*Math.cos(4*a))/1.30},
  rhomb4: {label:"Ромб в плане",        r:(a)=>0.72/(0.72*(Math.abs(Math.cos(a))**1.35+Math.abs(Math.sin(a))**1.35))},
  // БОБ С НОСИКОМ (по эскизу пользователя): круглый контур с плавным
  // заострённым выступом наружу с одной стороны; прежний «боб с выемкой»
  // отклонён. Хаос-модуляция контура сохранена (chaos)
  bean:   {label:"Боб с носиком", chaos:1, r:(a)=>{
            const d=Math.atan2(Math.sin(a), Math.cos(a));
            return (1+0.38*Math.exp(-(d/0.55)*(d/0.55)))/1.38;
          }},
  pear:   {label:"Капля в плане",       r:(a)=>(1+0.26*Math.cos(a))/1.26},
  // ПОДКОВА (по эскизу пользователя): круглый контур с плавным проёмом
  // внизу — радиус в нижнем секторе проваливается до 0.38, по бокам и
  // сверху контур круглый. Прежний «серп» (смещённый круг) отклонён
  arc:    {label:"Подкова",             r:(a)=>{
            const d=Math.atan2(Math.sin(a+Math.PI/2), Math.cos(a+Math.PI/2));
            return 1-0.62*Math.exp(-(d/0.60)*(d/0.60));
          }},
  blob:   {label:"Клякса (органика)",   r:(a)=>(1+0.13*Math.sin(3*a+0.7)+0.10*Math.sin(5*a+2.1))/1.23},
  wave:   {label:"Волна (змейка)",      r:(a)=>(1+0.40*Math.cos(2*a)+0.10*Math.cos(4*a))/1.50},
};

/* ═══ КОНЦЕПТ-ФОРМЫ (Форма-11 … Форма-19): особые виды генерации «на ребро».
   В отличие от спирали они геометрически детерминированы: правило метража и
   ворота заполнения к ним не применяются — их силуэт и есть замысел.
   Стержни везде вертикальны, кроме «Мёбиуса»: там ось стержня плавно
   поворачивается вдоль кольца на 180° (полуоборот ленты Мёбиуса).
   Радиальные зазоры заложены в построение: соседние витки и кольца разнесены
   минимум на диаметр трубки с воздухом, поэтому касаний нет по построению.
   «Вихрь» и «Рваный ритм» — не отдельные генераторы, а модификаторы обычной
   спирали (см. ветку «на ребро» в controlPoints). */
// «волна-лежак», «Мёбиус» и «корона» удалены по решению пользователя
const CONCEPT_DIRECT={rings:1,vortex:1,ritm:1};
const CONCEPT_LANES={rings:3};
const CONCEPT_FORMS=["vortex","ritm","rings"];
function conceptGuide(key, ctx){
  const {dims,rw,rng,lane}=ctx;
  const kx=ctx.kx, kz=ctx.kz, kmin=Math.min(kx,kz);
  const H=dims[1], cx=dims[0]/2, cz=dims[2]/2, ymid=H/2;
  const yPad=rw*0.55+12, yLo=yPad, yHi=H-yPad, H2=Math.max(rw, yHi-yLo);
  const dirE=rng()<0.5?-1:1, ph0=rng()*Math.PI*2;
  const dens=Math.max(0.4, Math.min(1, ctx.densK||1));
  let P=null, A=null;
  if(key==="vortex"){
    // ВИХРЬ: спираль-смерч. Раньше вихрь был модификатором обычной спирали
    // и на плотной укладке давил собственный крен, чтобы витки не касались,
    // — на габаритах вроде 2500×2500×2000 он выглядел как «рваный ритм»
    // (замечание пользователя). Теперь витки разведены РАДИАЛЬНО не меньше
    // диаметра трубки + 50 мм — по построению, поэтому крен свободен:
    // нарастает к низу до 12° и его направление вращается на 0.6 оборота
    // за спуск. Характер смерча читается на любом габарите
    const rTop=0.94, rIn=0.30;
    const kxg=kx-32, kzg=kz-32;      // отступ от стенок — от пристеночного руля
    const kmE=Math.min(kxg,kzg);
    // запас 45 мм сверху и снизу: волна крена кладёт дугу витка на границу
    // габарита, и марш, отруливая от пола, сжимал витки (замер: пары по
    // 15.6-20.9 мм у самого низа, y около 175)
    const yHiV=yHi-45, yLoV=yLo+45, H2V=Math.max(rw, yHiV-yLoV);
    // ВЫБОР КОНСТРУКЦИИ ПО ИНВАРИАНТУ НАКЛОНА. Витки разводит радиальный
    // шаг, но наклонная лента «на ребро» занимает по радиусу rw·sin(наклона
    // спуска на виток) — на узких/высоких габаритах проекция (замер
    // 800×800×2000: ~90 мм при шаге витков 55) съедает шаг целиком, и
    // радиальный смерч физически невозможен (замечание пользователя —
    // сотни касаний). Тогда строится ВЕРТИКАЛЬНЫЙ смерч: витки разведены
    // по высоте, конус мягче, крен — в пределах вертикального запаса
    let n=Math.max(4, Math.min(12,
      Math.floor(kmE*(rTop-rIn)/(ROD_D+50)*dens)));
    let radialOk=false;
    for(let n2=n; n2>=4; n2--){
      const rMid=(rTop+rIn)/2*kmE;
      const slope=(H2V/n2)/(2*Math.PI*rMid);
      const need=ROD_D+25+rw*Math.sin(Math.atan(slope)+15*Math.PI/180*0.65);
      if((rTop-rIn)*kmE/n2>=need){ n=n2; radialOk=true; break; }
    }
    if(radialOk){
      // ПРОФИЛЬ СМЕРЧА: радиус убывает по степени 1.35 — стенки крутые
      // сверху, к низу узкий хвост (при линейном профиле вихрь был
      // неотличим от «рваного ритма» — замечание пользователя). Радиальный
      // шаг у нижних витков при этом остаётся не меньше 45 мм
      const rhoAt=(t)=>rIn+(rTop-rIn)*Math.pow(1-t, 1.35);
      const ampAt=(t)=>Math.min(0.32*H2V,
        Math.tan(15*Math.PI/180)*rhoAt(t)*kmE)*(0.30+0.70*t);
      const aT=ampAt(0), aB=ampAt(1), Hs=Math.max(rw, H2V-aT-aB);
      // нырок к центру — за 0.9 витка и до 60 мм: короче и глубже марш
      // срезал хордой через соседний виток (пары 17-19 мм у низа)
      const uCw=0.9/n, rEnd=60/kmE;
      P=(t)=>{
        const th=ph0+dirE*Math.PI*2*n*t;
        const phT=ph0+dirE*Math.PI*2*0.6*t;
        const uC=Math.max(0,(t-(1-uCw))/uCw), wC=uC*uC*(3-2*uC);
        const rho=rhoAt(t)*(1-wC)+rEnd*wC;
        const y=yHiV-aT-Hs*t+ampAt(t)*(1-wC)*Math.cos(th-phT);
        return [cx+kxg*rho*Math.cos(th), y, cz+kzg*rho*Math.sin(th)];
      };
    } else {
      // ВЕРТИКАЛЬНЫЙ СМЕРЧ: шаг витков по высоте не меньше ширины ленты
      // + трубка + 40; крен — волной, ФАЗА МЕДЛЕННАЯ (0.6 оборота на весь
      // спуск): волны соседних витков почти синфазны и вертикальный зазор
      // между ними не сжимается. Конус мягкий (0.92→0.55), нырок прежний
      const pitch=rw+ROD_D+40;
      n=Math.max(3, Math.min(9, Math.floor(H2V/pitch)));
      const rT2=0.92, rB2=0.55;
      const amp=Math.max(0, 0.4*(H2V/n-rw-ROD_D-10));
      const Hs=Math.max(rw, H2V-2*amp);
      const uCw=0.9/n, rEnd=60/kmE;
      P=(t)=>{
        const th=ph0+dirE*Math.PI*2*n*t;
        const phT=ph0+dirE*Math.PI*2*0.6*t;
        const uC=Math.max(0,(t-(1-uCw))/uCw), wC=uC*uC*(3-2*uC);
        const rho=(rT2-(rT2-rB2)*t)*(1-wC)+rEnd*wC;
        const y=yHiV-amp-Hs*t+amp*(1-wC)*Math.cos(th-phT);
        return [cx+kxg*rho*Math.cos(th), y, cz+kzg*rho*Math.sin(th)];
      };
    }
  } else if(key==="ritm"){
    // РВАНЫЙ РИТМ: витки идут ПАРАМИ — пара сжата по высоте (0.45 шага,
    // виток заходит под соседний), затем воздух (1.35 шага). Раньше ритм
    // был модификатором обычной спирали и на плотной укладке отключался —
    // пары не читались (замечание пользователя). Теперь витки разведены
    // радиально не меньше диаметра трубки + 46 мм по построению, и пары
    // видны на любом габарите
    const rTop=0.94, rIn=0.30;
    const kxg=kx-32, kzg=kz-32;      // отступ от стенок — от пристеночного руля
    const kmE=Math.min(kxg,kzg);
    const Hef=H2-90;
    // ВЫБОР КОНСТРУКЦИИ ПО ИНВАРИАНТУ НАКЛОНА (как у вихря): наклонная
    // лента «на ребро» занимает по радиусу rw·sin(наклона); на узких
    // габаритах воздушный виток (крутой спуск 1.68 шага) проецируется на
    // ~112 мм при радиальном шаге витков 54 — сотни касаний (замечание
    // пользователя на 800×800×1500). Тогда пары разводятся ПО ВЫСОТЕ,
    // а радиальный шаг остаётся только ВНУТРИ пары
    let n=Math.max(4, Math.min(14,
      Math.floor(kmE*(rTop-rIn)/(ROD_D+46)*dens)));
    let radialOk=false;
    for(let n2=n; n2>=4; n2--){
      const tot2=Math.ceil(n2/2)*0.32+Math.floor(n2/2)*1.68;
      const rMid=(rTop+rIn)/2*kmE;
      const slope=(1.68/tot2*Hef)/(2*Math.PI*rMid);
      const need=ROD_D+25+rw*Math.sin(Math.atan(slope));
      if((rTop-rIn)*kmE/n2>=need){ n=n2; radialOk=true; break; }
    }
    if(radialOk){
      // контраст пар усилен: 0.32 шага в паре против 1.68 воздуха — иначе
      // пары читались слабо (замечание пользователя)
      const yPos=[0];
      for(let k=1;k<=n;k++) yPos.push(yPos[k-1]+((k%2===1)?0.32:1.68));
      const tot=yPos[n];
      const uCw=0.9/n, rEnd=60/kmE;
      P=(t)=>{
        const u=Math.min(n, Math.max(0, n*t));
        const i2=Math.min(n-1, Math.floor(u)), fr=u-i2, sm=fr*fr*(3-2*fr);
        const gY=(yPos[i2]+(yPos[i2+1]-yPos[i2])*sm)/tot;
        const th=ph0+dirE*Math.PI*2*u;
        const uC=Math.max(0,(t-(1-uCw))/uCw), wC=uC*uC*(3-2*uC);
        const rho=(rTop-(rTop-rIn)*t)*(1-wC)+rEnd*wC;
        return [cx+kxg*rho*Math.cos(th), yHi-45-Hef*gY, cz+kzg*rho*Math.sin(th)];
      };
    } else {
      // ВЕРТИКАЛЬНЫЙ РИТМ: витки разведены по высоте (как у вертикального
      // смерча — та конструкция замером чиста), а рваность задаёт
      // ПУЛЬСАЦИЯ скорости спуска: виток-к-витку вплотную, затем воздух.
      // Ступенчатый профиль пар (интерполяция по сегментам) не выживал
      // марш и разводку — направляющую корёжило (замеры: 141-967 касаний),
      // гладкая пульсация переживает обоих
      // минимум — ОДНА пара: два витка на 4 (со средним шагом меньше
      // ленты с воздухом) не помещаются и давали 63-157 касаний
      const pitch=rw+ROD_D+40;
      n=Math.max(2, Math.min(10, 2*Math.floor(Hef/(2*pitch))));
      // скорость спуска гуляет (1-q)…(1+q) — пары видны. Повторные
      // попытки обвязки (densK 0.87^cs) ОСЛАБЛЯЮТ пульс: на тесном
      // габарите слабее пары — чище укладка. Линеаризация нырка и
      // адаптивный q замерены хуже (73/0 → 63/76) — отклонены
      const q=0.72*(0.55+0.45*dens);
      const nP=n/2;
      const sPr=(t)=>t - q*Math.sin(2*Math.PI*nP*t)/(2*Math.PI*nP);
      // РАДИАЛЬНАЯ МОДУЛЯЦИЯ С ПЕРИОДОМ В ДВА ВИТКА: соседние витки всегда
      // в противофазе (сдвиг фазы ровно π), и в СЖАТОЙ фазе пульса — где
      // витки пары перекрываются по вертикали — они разведены радиально
      // на 2A=Ø+46 (фазы согласованы: |cos|=1 и у сжатия, и у модуляции).
      // В воздушной фазе модуляция нулевая, но там вертикальный шаг 1.72
      // среднего. Без модуляции пары пересекались (замечание пользователя
      // на 1000×1000×5000: витки прорезали друг друга)
      // при ОДНОЙ паре модуляция не нужна и вредна (замер: одиночная пара
      // на 800×800×1500 без неё чиста, с ней 180 касаний)
      const A=n>=4 ? (ROD_D+46)/2/kmE : 0;
      const uCw=0.9/n, rEnd=60/kmE;
      P=(t)=>{
        const th=ph0+dirE*Math.PI*2*n*t;
        const rho=0.92-A-0.20*t + A*Math.cos(2*Math.PI*nP*t);
        const uC=Math.max(0,(t-(1-uCw))/uCw), wC=uC*uC*(3-2*uC);
        const rho2=Math.max(rEnd, rho*(1-wC)+rEnd*wC);
        return [cx+kxg*rho2*Math.cos(th), yHi-45-Hef*sPr(t),
                cz+kzg*rho2*Math.sin(th)];
      };
    }
  } else if(key==="rings"){
    // ПЕРЕСЕКАЮЩИЕСЯ КОЛЬЦА (ГИРОСКОП): замкнутые кольца разного диаметра,
    // каждое в своей наклонённой плоскости (8–16° — наклон здесь и есть
    // форма). Стержни вертикальны: наклон — это ход высоты по кругу.
    // ЧИСЛО КОЛЕЦ РАСТЁТ С ДИАМЕТРОМ композиции (по кольцу на каждые
    // ~500 мм радиуса, от 3 до 9) — на большом габарите дисков больше.
    // Кольца концентрические: радиальный зазор — по построению, при
    // вертикальных стержнях пересечься не могут ни на какой высоте.
    // КОНТУР СОМКНУТ: зазор на стыке равен санитарной дистанции дальних
    // трубок (25 мм) — читается как обычный шаг между трубками, а не шов
    const nR=Math.max(3, Math.min(9, ctx.lanes||3));
    const l=lane%nR;
    const rIn=(nR>=6)?0.26:0.36;
    const rK=nR>1 ? 0.94-(0.94-rIn)*l/(nR-1) : 0.94;
    const tiltD=8+((l*3)%9);
    const phL=ph0+2.4*l;
    const hAmp=Math.min((H2-rw)/2*0.9,
                        Math.tan(tiltD*Math.PI/180)*rK*kmin);
    let off=[0.10,-0.06,0.02,-0.09,0.06,-0.02,0.08,-0.04,0][l%9]*H2;
    const offMax=Math.max(0, H2/2-hAmp-rw/2);
    off=Math.max(-offMax, Math.min(offMax, off));
    const span=Math.PI*2 - 25/Math.max(120, rK*kmin);
    P=(t)=>{
      const th=dirE*span*t+phL;
      return [cx+kx*rK*Math.cos(th), ymid+off+hAmp*Math.cos(th-phL), cz+kz*rK*Math.sin(th)];
    };
  }
  if(!P) return null;
  // выборка: шаг вдоль пути ~14 мм (по грубой оценке длины)
  let cl=0, prev=P(0);
  for(let i2=1;i2<=240;i2++){ const q=P(i2/240); cl+=Math.hypot(q[0]-prev[0],q[1]-prev[1],q[2]-prev[2]); prev=q; }
  const N=Math.max(160, Math.min(2800, Math.round(cl/14)));
  const pts=[], axisAt=[];
  for(let i2=0;i2<=N;i2++){
    const t=i2/N;
    pts.push(P(t));
    axisAt.push(A?A(t):[0,1,0]);
  }
  pts.__axisAt=axisAt;
  return pts;
}

const FORMS = {
  box:    {label:"Параллелепипед",           rect:true,  prof:null},
  sphere: {label:"Шар",                      rect:false, axLong:true,
           prof:h=>2*Math.sqrt(Math.max(0, h*(1-h)))},
  cyl:    {label:"Цилиндр",                  rect:false, prof:h=>1},
  pyr:    {label:"Пирамида (вершиной вниз)", rect:true,  prof:h=>Math.max(0.07, h)},
  drop:   {label:"Капля",                    rect:false,
           prof:h=>Math.max(0.07, Math.pow(Math.max(0,1-h), 0.6))},
  barrel: {label:"Барабан",                  rect:false,
           prof:h=>0.72+0.28*(1-Math.pow(2*h-1,2))},
  waist:  {label:"Песочные часы",            rect:false,
           prof:h=>0.42+0.58*Math.abs(2*h-1)},
  rhomb:  {label:"Ромб",                     rect:true,
           prof:h=>Math.max(0.07, 1-Math.abs(2*h-1))},
};

/* Форма, вписанная в габарит: ось, полуоси и предикат «внутри».
   Полуось вдоль оси уменьшена на полширины ленты — стержни лежат поперёк
   навивки и выступают за её концы. Для «Параллелепипеда» возвращает null:
   там форма — сам габарит и никаких ограничений не нужно. */
/* ПЛАВНОЕ ОГРАНИЧЕНИЕ («мягкий упор»). Жёсткое обрезание точки по стенке
   габарита (min/max) даёт на ленте мелкие зубцы: часть точек ложится ровно
   на стенку, часть остаётся снаружи, и край читается пилой. Каркас —
   гибкий металл, ломаться он не умеет, поэтому подход к стенке должен быть
   ПЛАВНЫМ: до 80% полуоси координата идёт как есть, дальше насыщается
   экспоненциально (функция и её производная непрерывны). */
function softLim(v, lim, knee){
  const k=(knee===undefined)?0.9:knee, tail=1-k;
  const a=Math.abs(v)/Math.max(1e-6, lim);
  if(a<=k) return v;
  return Math.sign(v)*lim*(1-tail*Math.exp(-(a-k)/tail));
}

function formOf(dims, rw, form){
  const F=FORMS[form]||FORMS.box;
  if(!F.prof) return null;
  const ax=F.axLong ? dims.indexOf(Math.max(...dims)) : 1;
  const u1=(ax+1)%3, u2=(ax+2)%3;
  // САМА ФОРМА вписана в габарит симметрично: полуоси одинаково уменьшены на
  // радиус трубки с воздухом. Раньше вдоль оси дополнительно вычиталась
  // полширины ленты (запас на выступ стержней) — и «шар» в кубе выходил
  // приплюснутым эллипсоидом. Запас на стержни нужен только ходу осевой
  // линии навивки (Rax), а не форме
  const R=[dims[0]/2-ROD_R-10, dims[1]/2-ROD_R-10, dims[2]/2-ROD_R-10];
  for(let k=0;k<3;k++) R[k]=Math.max(60, R[k]);
  const Rax=Math.max(rw*0.6, R[ax]-rw/2);       // ход осевой линии
  const R1=Math.max(90, R[u1]-ROD_R-5);         // полуоси сечения навивки
  const R2=Math.max(90, R[u2]-ROD_R-5);
  const c=[dims[0]/2, dims[1]/2, dims[2]/2];
  const prof=F.prof, rect=!!F.rect;
  // доля оси: 0 — «низ» (или начало) оси, 1 — «верх»
  const hAt=(v)=>Math.min(1, Math.max(0, 0.5+(v-c[ax])/(2*R[ax])));
  const kAt=(v)=>Math.max(0.07, prof(hAt(v)));
  const inside=(q)=>{
    if(Math.abs(q[ax]-c[ax])>R[ax]+1) return false;
    const k=kAt(q[ax]);
    const a=(q[u1]-c[u1])/(R[u1]*k), b=(q[u2]-c[u2])/(R[u2]*k);
    return rect ? (Math.abs(a)<=1 && Math.abs(b)<=1) : (a*a+b*b<=1);
  };
  // ПОДЖАТЬ ТОЧКУ ВНУТРЬ ФОРМЫ (на месте). Дыхание сечения, блуждание центра
  // и покоординатный масштаб могут вынести точку направляющей за силуэт —
  // проекция к оси формы возвращает её на контур с внутренним запасом
  // ell=true — поджимать по вписанному эллипсу даже у прямоугольных форм:
  // проекция на квадрат даёт углы, а на углах марш ломается
  const clampTo=(q, mg, inset, ell)=>{
    const m=(mg===undefined)?0.97:mg, ins=inset||0;
    q[ax]=Math.min(c[ax]+R[ax], Math.max(c[ax]-R[ax], q[ax]));
    // СВЕРХУ ФОРМЫ ВЫХОД ЗА КОНТУР ДОПУСКАЕТСЯ: у сужающихся форм верх — это
    // раскрытие композиции, там лента имеет право выйти за силуэт
    const hq=hAt(q[ax]);
    const k=kAt(q[ax])*m*(1+0.35*Math.max(0, (hq-0.70)/0.30));
    // отступ на выступ стержней: в повороте лента перекатывается на ребро и
    // её торцы выметают радиус — направляющая должна идти внутри контура
    const a=Math.max(60, R[u1]*k-ins), b=Math.max(60, R[u2]*k-ins);
    const s1=(q[u1]-c[u1])/a, s2=(q[u2]-c[u2])/b;
    const n=(rect&&!ell) ? Math.max(Math.abs(s1), Math.abs(s2)) : Math.hypot(s1,s2);
    // ПЛАВНЫЙ ВХОД В КОНТУР: жёсткая проекция (делить на n) сажает на контур
    // только вылетевшие точки, соседние остаются внутри — на ленте появляется
    // излом. Поджимаем плавно, начиная с 0.86 контура
    if(n>0.9){
      const k2=softLim(n, 1.0)/n;
      q[u1]=c[u1]+(q[u1]-c[u1])*k2; q[u2]=c[u2]+(q[u2]-c[u2])*k2;
    }
    return q;
  };
  return {form, ax, u1, u2, Rax, R1, R2, R, c, prof, rect, hAt, kAt, inside, clampTo};
}

function envelopeSpine(dims, rw, form){
  const M=200, P=[];
  const fo=formOf(dims, rw, form);
  // ось навивки: у формы — её собственная ось (у шара самая длинная сторона,
  // у остальных вертикаль), у параллелепипеда — самая длинная сторона
  const ax=fo ? fo.ax : dims.indexOf(Math.max(...dims));
  const u1=(ax+1)%3, u2=(ax+2)%3;
  // ПОЛУОСИ СЕЧЕНИЯ НАВИВКИ. Стержни в навивке лежат ВДОЛЬ осевой линии,
  // поэтому ширина ленты в плоскости сечения места не занимает: резерв —
  // радиус трубки с воздухом. Раньше вычиталась почти вся ширина ленты, и в
  // узком габарите (500×500) сечение падало ниже предела витка — лента
  // вырождалась в плоскую змейку вместо навивки
  const rBox=(dim)=>Math.max(90, (dim-2*(ROD_R+12))/2);
  // ход осевой линии — размер формы вдоль оси минус выступ ленты: стержни
  // лежат поперёк навивки и выступают за её концы на полширины
  const Rax=Math.max(rw*0.6, dims[ax]/2-rw/2-ROD_R-10);
  const run=fo ? Math.max(rw+60, 2*Rax*0.96)
               : Math.max(rw+60, dims[ax]-rw-60);
  const s0=(dims[ax]-run)/2;
  for(let i=0;i<=M;i++){
    const q=[dims[0]/2, dims[1]/2, dims[2]/2];
    q[ax]=s0+run*(i/M);
    P.push(q);
  }
  const ref=[0,0,0]; ref[u1]=1;
  return {P, ref, ax, Rax, r1:rBox(dims[u1]), r2:rBox(dims[u2])};
}

function controlPoints(style, rng, box, lane, lanes, ampl, lengthK){
  // box = {w,d,h} — рабочий бокс ленты (уже с отступами)
  // lengthK («насыщенность») управляет числом волн/витков → длиной ленты
  const pts = [];
  const {w,d,h} = box;
  const jitter = (s)=> (rng()*2-1)*s;
  const laneZ = lanes>1 ? (lane+0.5)/lanes : 0.5;

  // ЗАПОЛНЕНИЕ ОБЪЁМА — пластика по референсам LC0217/0279/0280/0326/
  // 0327/0419: ПЛОСКАЯ лента (стержни поперёк хода, лицо вверх) течёт
  // ПРЯДЯМИ на разных высотах, меандрируя по всей глубине; между
  // прядями — вертикальные ПЕРЕГИБЫ (лента складывается сама над собой,
  // как драпировка); по пути — открытые КОЛЬЦА (лента перекатывается на
  // ребро и описывает петлю в плане, как LC0326/0419); свободные концы
  // завёрнуты в СВИТКИ (LC0327). Повороты в плане лента проходит,
  // перекатываясь с лица на ребро — как шёлк на ветру.
  if(style==="chaos" || lengthK>=1.9){
    // ЗАПОЛНЕНИЕ ОБЪЁМА — НАВИВКА ВОКРУГ ОСЕВОЙ ЛИНИИ ФОРМЫ.
    // Лента идёт спиралью вдоль осевой линии выбранной формы: стержни
    // параллельны осевой линии, поэтому виток — чистый изгиб вокруг
    // стержней (физически самый лёгкий), а шаг витка = ширина ленты с
    // зазором, значит витки ложатся плотно и не задевают друг друга.
    // Сечение навивки — эллипс, заданный формой: объём заполняется
    // целиком, а лента нигде не идёт по прямой.
    // Так выглядят LC0326/LC0419 (винт) и LC0217 (пологий винт с волной).
    const rw=box.rw||300;
    const dens=Math.max(0, Math.min(1, (lengthK-0.6)/1.4));
    const relax=box.relax||0;
    const sK=box.secK||[1,1,1];      // покоординатный масштаб под габарит
    const dims=[w,h,d];
    const L=Math.max(...dims);
    // ПРАВИЛО МЕТРАЖА (жёсткое, для «микса»): на каждый метр длины формы —
    // метр ленты плюс метр на повороты, то есть 2 пог. м на метр главного
    // габарита, И ПРОПОРЦИОНАЛЬНО ШИРИНЕ формы: базовая ширина 700 мм даёт
    // 2 пог. м/м (форма 2000×700 → 4.1 пог. м), шире форма — больше метража
    const multM=(1.72+0.62*dens)*1.14;   // 1.14 — потери марша и вписывания
    const wKM=Math.max(0.5, Math.min(1.8, 300/rw));
    const dimsSm=[...dims].sort((a,b)=>b-a);
    const wRuleM=1+0.55*Math.max(-0.35, (dimsSm[1]-700)/700);
    const target=(Math.max(2.05*L*wRuleM, multM*L*wKM)+(box.addLen||0))
                 /Math.max(1,lanes);
    // осевая линия формы + сечение навивки
    const sp=envelopeSpine(dims, rw, box.form);
    const SP=sp.P, nsp=SP.length;
    const cumP=[0];
    for(let i=1;i<nsp;i++) cumP.push(cumP[i-1]+V.len(V.sub(SP[i],SP[i-1])));
    const S=Math.max(rw+60, cumP[nsp-1]);      // длина осевой линии
    let pj=0;
    const atSpine=(Lq)=>{                       // точка и касательная по длине
      while(pj<nsp-2 && cumP[pj+1]<Lq) pj++;
      while(pj>0 && cumP[pj]>Lq) pj--;
      const seg=cumP[pj+1]-cumP[pj]||1, u=(Lq-cumP[pj])/seg;
      const p=[0,0,0];
      for(let k=0;k<3;k++) p[k]=SP[pj][k]+(SP[pj+1][k]-SP[pj][k])*u;
      const i0=Math.max(0,pj-1), i1=Math.min(nsp-1,pj+2);
      let T=V.sub(SP[i1],SP[i0]);
      T = V.len(T)>1e-6 ? V.norm(T) : [1,0,0];
      return {p, T};
    };
    const a1=sp.r1, a2=sp.r2;
    // РАДИУС ВИТКА. На скруглении стадиона радиус равен малой полуоси B.
    // Если B меньше двойного технологического предела, замкнуть виток
    // нельзя: марш не проходит скругление, срывается (цель уходит внутрь
    // непроходимого круга), начинает петлять — отсюда лишний метраж и
    // сотни самопересечений. В таком сечении лента не сворачивается в
    // виток, а КОЛЕБЛЕТСЯ вдоль длинной полуоси — пластика LC0217:
    // частота колебания ограничена тем же правилом кривизны.
    let A1s=a1*0.88, A2s=a2*0.88;
    // ПЛАСТИКА «НА РЕБРО»: лента стоит на ребре и закручивается спиралью
    // в плане. Изгиб идёт вокруг стержней (они вертикальны) — это самый
    // лёгкий для каркаса изгиб, поэтому спираль физична при любом радиусе
    // от 150 мм. Радиально лента занимает только толщину трубки, значит
    // витки спирали можно ставить через 26 мм + воздух.
    if(box.plast==="edge"){
      // ПЛАСТИКА «НА РЕБРО»: вся лента стоит на ребре (стержни вертикальны)
      // и закручивается спиралью ОТ КРАЯ ФОРМЫ К ЦЕНТРУ. Изгиб идёт вокруг
      // стержней — самый лёгкий для каркаса, поэтому спираль физична при
      // любом радиусе от 150 мм. Радиально лента занимает только толщину
      // трубки, поэтому соседние витки ставятся через диаметр с воздухом —
      // композиция выходит плотной.
      const H=dims[1];
      const sphE=formOf(dims, rw, box.form);
      const kx=(dims[0]/2-ROD_R-20), kz=(dims[2]/2-ROD_R-20);
      // КОНЦЕПТ-ФОРМЫ строят направляющую сами — минуя правила спирали
      if(box.concept && CONCEPT_DIRECT[box.concept]){
        const gC=conceptGuide(box.concept, {dims, rw, rng, lane, lanes,
                                            kx, kz, densK:box.densK});
        if(gC){ gC.__target=0; gC.__edge=true; return gC; }
      }
      // радиальный шаг между витками: толщина трубки + воздух с запасом
      // (на минимальном шаге плотная спираль срывалась в касания)
      const dR=ROD_D+28;
      const rho1=1.0;                       // внешний виток — по контуру формы
      // НИЖНИЙ КОНЕЦ ЗАКРУЧИВАЕТСЯ К ЦЕНТРУ ФОРМЫ: последний виток уходит
      // почти в ось. Лента на ребре гнётся вокруг своих вертикальных
      // стержней — это самый лёгкий изгиб, поэтому финальный завиток
      // радиусом 110 мм каркас проходит
      // радиус финального завитка: не меньше 110 мм и не меньше трети ширины
      // ленты — у широкой ленты на ребре слишком тесный завиток упирается
      // сам в себя (витки выше перекрывают его по высоте)
      const rho0=Math.max(0.10, Math.max(110, rw*0.35)/Math.min(kx,kz));
      // СИЛУЭТ В ПЛАНЕ СЪЕДАЕТ РАДИАЛЬНЫЙ ЗАПАС. Радиус витка умножается на
      // контур r(θ), поэтому в «впадинах» силуэта (у звезды 0.52 от радиуса)
      // радиальный зазор между соседними витками сжимается во столько же раз.
      // Без этого множителя в высокой звезде вставало 14 витков и витки
      // пересекались (замер: 1456 касаний, габарит 1500×1500×3000)
      const planF0=(PLAN_SHAPES[box.plan]||PLAN_SHAPES.circle).r;
      let pMinE=1e9, pGMax=0;
      for(let ip=0; ip<360; ip++){
        const ap=ip*Math.PI/180, v0=planF0(ap), v1=planF0(ap+Math.PI/180);
        pMinE=Math.min(pMinE, v0);
        pGMax=Math.max(pGMax, Math.abs(v1-v0)/(Math.PI/180));   // |dr/dθ|
      }
      pMinE=Math.max(0.25, Math.min(1, pMinE));
      // сколько витков влезает радиально и сколько просит правило метража
      // у силуэтов с быстрым контуром (звезда, клевер) радиальный зазор
      // должен быть с запасом: контур успевает уйти в сторону внутри витка
      const dRplan=dR*(1+0.5*Math.min(1.6, pGMax));
      const nFit=Math.max(1.2, (pMinE*Math.min(kx,kz)*(rho1-rho0))/dRplan);
      const dens0=Math.max(0, Math.min(1, (lengthK-0.6)/1.4));
      const wK0=Math.max(0.5, Math.min(1.8, 300/rw));
      // ПРАВИЛО МЕТРАЖА ДЛЯ «НА РЕБРО» — ВДВОЕ БОЛЬШЕ, чем для «микса»: лента
      // стоит на ребре, радиально занимает только толщину трубки, и витки
      // ставятся вплотную — в тот же габарит входит вдвое больше метража.
      // Ширина формы учитывается так же, как в «миксе»: базовые 700 мм дают
      // правило как есть, шире форма — больше метража. Без этого множителя
      // витков выходило вдвое меньше и спираль читалась редкой
      const dimsSe=[...dims].sort((a,b)=>b-a);
      const wRuleE=1+0.55*Math.max(-0.35, (dimsSe[1]-700)/700);
      // МЕТРАЖ — ИЗ ПЛОЩАДИ СИЛУЭТА, А НЕ ИЗ ГЛАВНОГО ГАБАРИТА. У конуса
      // силуэт вдвое меньше цилиндра того же габарита, и правило метража,
      // посчитанное по габариту, просило витков больше, чем контур вмещает:
      // плотный вариант отбраковывался, композицию собирала страховка —
      // отсюда «недокручивание» и воздух между витками. Множитель — средняя
      // доля контура по спуску (у цилиндра 1, у конуса ≈0.5)
      let kArea=1;
      if(sphE && sphE.prof){
        let acc=0;
        for(let i=0;i<=40;i++) acc+=Math.max(0.1, sphE.prof(i/40));
        kArea=Math.max(0.35, Math.min(1, acc/41));
      }
      const tgt=Math.max(2*2.05*dimsSe[0]*wRuleE*kArea,
                         (1.72+0.62*dens0)*1.14*Math.max(...dims)*wK0*kArea);
      const perimMean=Math.PI*(kx+kz)*(rho0+rho1)/2;
      // ПЛОТНОСТЬ ПО ВЕРТИКАЛИ: шаг витка меньше ширины ленты — верхний виток
      // всегда немного перекрывает нижний, поэтому пустот между витками не
      // видно. Радиально соседние витки при этом разнесены на толщину трубки
      // с воздухом, так что перекрытие только зрительное.
      // Витков не меньше, чем требует правило метража (×1.5), и не больше,
      // чем влезает радиально: брать всю радиальную ёмкость нельзя —
      // в габарите 2400×900 это 24 пог. м стекла
      // ПРОФИЛЬ РАДИУСА СПИРАЛИ. У форм, широких посередине (ромб, шар,
      // барабан), радиус держится у контура — иначе центральные завитки не
      // доходят до точки излома. У всех остальных (параллелепипед, цилиндр,
      // конус, капля) радиус убывает РАВНОМЕРНО: каждый нижний виток меньше
      // верхнего по диаметру, спуск читается ровным плавным конусом
      let midWide=false, tMid=0;
      if(sphE && sphE.prof){
        let kmid=0, kend=0, hMax=1;
        for(let i=0;i<=24;i++){
          const h=i/24, kk=sphE.prof(h);
          if(h>=0.3 && h<=0.7) kmid=Math.max(kmid, kk);
          if(h<=0.15 || h>=0.85) kend=Math.max(kend, kk);
          if(kk>=kmid && h>=0.3 && h<=0.7) hMax=h;
        }
        midWide = kmid > kend*1.02;
        // спуск идёт сверху вниз, поэтому самое широкое место формы
        // приходится на долю пути (1 − h): до него радиус держится ПО
        // КОНТУРУ (витки доходят до экватора, до точки излома ромба),
        // после — уходит в центр
        if(midWide) tMid=Math.max(0.15, Math.min(0.7, 1-hMax));
      }
      const riseMax=Math.max(0, H-rw-40);
      const nRule=tgt/Math.max(300,perimMean);
      // ШАГ ВИТКА ПО ВЫСОТЕ. Радиус витка держится у контура формы (t^2.5),
      // поэтому в круглых формах соседние витки стоят почти на одном радиусе
      // и разводит их только высота: шаг обязан быть больше ширины ленты.
      // Раньше шаг был 0.85 ширины (витки перекрывались) — в цилиндре, конусе
      // и ромбе это давало касания, и композицию собирала страховка
      const kminE0=Math.max(1, Math.min(kx,kz));
      // ЗАВАЛ ГОРИЗОНТА тоже съедает вертикальный зазор — резервируем его
      // ВОЛНЫ БОЛЬШИЕ И ОЧЕНЬ ПЛАВНЫЕ: одна волна на виток, размах до 40%
      // ширины ленты (мелкая частая рябь на кантах не допускается — она
      // читалась «шагренью» и волнами не той природы)
      // ЗАВАЛ ВИТКА — НЕ БОЛЬШЕ 5°. Это предел на ПОЛНЫЙ наклон плоскости
      // витка (общий завал плюс свой наклон витка вместе): угол наклона равен
      // arctg(tiltMm / полуось сечения), поэтому предел задан тангенсом 5°.
      // При 0.20 полуоси наклон доходил до 11° — витки заваливались слишком
      // сильно; при 0.30 ширины ленты, наоборот, наклон был 11-40 мм и не
      // читался вовсе
      // 4.5° в расчёте, а не 5°: композиция потом растягивается вписыванием в
      // габарит по высоте, и угол растёт на величину растяжки — замер давал
      // 5.4-5.7° при расчётных 5°
      const TILT_DEG=4.5;
      const tiltMm=Math.min(Math.tan(TILT_DEG*Math.PI/180)*kminE0, 0.75*rw, 0.15*H);
      // НИЖНИЙ ВИТОК НЕМНОГО СКРЫВАЕТСЯ ПОД ВЕРХНИМ. Перекрытие по высоте
      // допустимо ТОЛЬКО когда витки разведены РАДИАЛЬНО (каждый нижний
      // меньше верхнего по диаметру): тогда перекрытие зрительное, а не
      // касание. У форм, широких посередине (ромб, шар, барабан), у экватора
      // радиус почти не меняется — там шаг витка остаётся больше ширины
      const riseFree=Math.max(rw, riseMax-2*tiltMm);
      // контур формы на высоте (в долях полуоси сечения)
      const kfAt=(yq)=>{
        if(!sphE) return 1;
        if(sphE.ax===1) return Math.max(0.2, sphE.kAt(yq));
        const uy=(yq-sphE.c[1])/Math.max(1,sphE.R[1]);
        return Math.max(0.2, Math.sqrt(Math.max(0, 1-uy*uy)));
      };
      const nOvl=Math.min((rho1-rho0)*kminE0/40, riseFree/Math.max(1, rw*0.85));
      const nFlat=riseFree/Math.max(1, rw+14+0.7*tiltMm);
      // ВИТКОВ ВДВОЕ БОЛЬШЕ, ЕСЛИ ОНИ РАЗВЕДЕНЫ РАДИАЛЬНО. Шаг витка по высоте
      // можно опустить до 0.42 ширины ленты (виток перекрывает соседний
      // больше чем наполовину) — при условии, что радиальный шаг спирали
      // остаётся не меньше толщины трубки с воздухом. В сужающихся формах
      // радиального хода много (в конусе 1500 мм это 615 мм), поэтому там
      // плотная раскладка проходит и композиция читается вдвое насыщеннее
      const pitchOvl=rw*0.42;
      const nDense=riseFree/pitchOvl;
      const stepDense=(rho1-rho0)*kminE0/Math.max(1, Math.min(nDense, 16));
      const pitchE0=(!midWide && nOvl>nFlat*1.05)
                   ? ((stepDense>=ROD_D+40) ? pitchOvl : rw*0.72)
                   // НИЖНИЙ ВИТОК ВСЕГДА ЗАХОДИТ ПОД ВЕРХНИЙ. Даже там, где
                   // витки почти не расходятся радиально (формы, широкие
                   // посередине), шаг витка меньше ширины ленты: перекрытие
                   // остаётся, между витками не бывает воздуха
                   : Math.min(rw*0.92, rw+14+0.7*tiltMm);
      const pitchE=pitchE0;
      const nOver=riseFree/pitchE;
      // РАДИАЛЬНЫЙ ШАГ ЗА ВИТОК ОГРАНИЧЕН: если радиус уходит к центру больше
      // чем на ~220 мм за виток, спираль превращается в конус с крутым
      // заходом и марш её не проходит. Значит витков нужно не меньше, чем
      // требует плавность закручивания
      const nCurl=(rho1-rho0)*Math.min(kx,kz)/220;
      let nNeed=Math.max(nRule*1.5, nOver, nCurl);
      // ПРЕДЕЛ ПО РАДИАЛЬНОЙ ЁМКОСТИ ФОРМЫ — ДО СБОРКИ, А НЕ ПОСЛЕ ОТБРАКОВКИ.
      // Соседние витки разведены радиальным ходом спирали. Если правило
      // метража просит больше витков, чем этот ход вмещает, плотный вариант
      // выходит с касаниями, отбраковывается, и композицию собирает
      // страховочный проход — спираль получается вдвое короче и «не
      // докручивается» (замер: конус 1500×1500×2000 при ленте 400 мм давал
      // 4.71 пог. м вместо ~20 и пустой верх; конус 900×900×1500 при ленте
      // 300 мм — 471 касание). Теперь число витков сразу ограничено тем,
      // что реально разводится
      nNeed=Math.min(nNeed, Math.max(2.5, (rho1-rho0)*kminE0/(ROD_D+34)));
      // ВИТКОВ — СКОЛЬКО ВЛЕЗАЕТ ПО ШАГУ, а не сколько требует правило
      // метража: правило метража — НИЖНЯЯ граница, а не верхняя. У большой
      // формы один виток сам по себе длинный (в габарите 2200 мм — 3.7 м),
      // и потолок «2.2 правила метража» давал всего 4 витка на 3.5 м высоты.
      // Предел теперь — радиальная ёмкость формы и предел марша: очень
      // длинную спираль он не проходит
      const nMax=Math.max(3, Math.min(nFit*0.92, 14));
      // плотность витков можно снизить сверху: этим страховочные проходы
      // разводят спираль, не меняя пластику
      const densKE=Math.max(0.18, Math.min(1, box.densK||1));
      const nA=Math.max(2.5, Math.min(nMax, nNeed)*densKE);
      // спуск (вершина внизу) — по шагу витка; размах завала горизонта
      // зарезервирован в габарите, иначе спираль вылезает за верх и низ
      const kminE=kminE0;
      // спуск по числу витков. Растягивать его на всю высоту нельзя: резерв
      // завала горизонта тогда выходит за габарит, вписывание утягивает сцену
      // и витки сближаются — замер давал 194-559 касаний
      // спуск — по числу витков и шагу. Растяжка на всю свободную высоту
      // замером отклонена: шаг витка становится больше ширины ленты, спуск
      // выходит крутым, и марш его не проходит (замер: звезда 1500×1500×3000
      // — 184 касания против чистой укладки при том же зерне)
      let rise=Math.min(riseFree, nA*pitchE);
      let y0=(H-rise)/2;
      // СПУСК ЗАКАНЧИВАЕТСЯ ТАМ, ГДЕ КОНТУР УЖЕ ФИНАЛЬНОГО ЗАВИТКА. У конуса
      // и пирамиды ниже некоторой высоты контур формы становится уже радиуса
      // финального завитка, радиус витка упирается в этот предел, и несколько
      // нижних витков идут на ОДНОМ радиусе — разведены только шагом по
      // высоте. При плотной раскладке это касания (замер: 471 касание в конусе
      // 900×900×1500), а после отбраковки страховка отдаёт вдвое короткую
      // спираль (конус 1500×1500×2000 — 4.71 пог. м вместо ~20 и пустой верх).
      // Поэтому спуск обрезается по высоте, где контур ещё шире завитка
      if(sphE && sphE.ax===1){
        const kAtY=(y2)=>Math.max(0.2, sphE.kAt(y2));
        let yStop=y0;
        for(let i=0;i<=48;i++){
          const y2=y0+rise*i/48;
          if(kAtY(y2)>=rho0*1.25){ yStop=y2; break; }
        }
        if(yStop>y0+2 && rise-(yStop-y0)>=rw*1.2){ rise-=(yStop-y0); y0=yStop; }
      }
      const NE=Math.max(90, Math.round(nA*56));
      const axisAtE=[];
      const phE=rng()*Math.PI*2, dirE=rng()<0.5?1:-1;
      // ЗАВАЛ ГОРИЗОНТА У ВИТКОВ: плоскость витка немного наклонена, и
      // направление наклона медленно поворачивается по спуску — витки
      // перестают читаться стопкой ровных колец, композиция получается
      // живой. Наклон меняется плавно, поэтому вертикальный шаг между
      // соседними витками сохраняется и они не сближаются: размах завала
      // ограничен третью шага витка. Стержни при этом остаются
      // вертикальными — завал это изгиб ленты вокруг них, самый лёгкий
      // силуэт в плане: функция r(θ) из таблицы (по умолчанию круг)
      const planF=(PLAN_SHAPES[box.plan]||PLAN_SHAPES.circle).r;
      // ХАОС В КОНТУРЕ (у «боба»): на каждую генерацию своя случайная
      // модуляция силуэта — форма выемки и лепестков каждый раз другая
      const planCh=((PLAN_SHAPES[box.plan]||{}).chaos||0);
      const chA=planCh?(0.10+0.12*rng()):0;
      const chP1=rng()*Math.PI*2, chP2=rng()*Math.PI*2;
      const chF1=2+Math.floor(rng()*3), chF2=4+Math.floor(rng()*3);
      const planR=(a)=>Math.max(0.25, planF(a)*(1+chA*(0.62*Math.sin(chF1*a+chP1)
                                                      +0.38*Math.sin(chF2*a+chP2))));
      // ПОВОРОТ СИЛУЭТА НА ВИТОК ОГРАНИЧЕН РАДИАЛЬНЫМ ШАГОМ. Поворот контура
      // между соседними витками сдвигает границу радиально на |dr/dθ|·угол:
      // если этот сдвиг больше шага витка, нижний виток выходит наружу
      // верхнего и ленты ПЕРЕСЕКАЮТСЯ (замер: звезда 1500×1500×3000 —
      // 1456 касаний при 15° на виток). Поэтому угол урезается до того,
      // что помещается в шаг; в разреженной укладке остаются полные 15°
      const twAsk=((PLAN_SHAPES[box.plan]||{}).tw||0)*Math.PI/180;
      const stepMmE=pMinE*kminE*(rho1-rho0)/Math.max(1, nA);
      const twCap=Math.max(0, stepMmE-(ROD_D+16))/Math.max(1e-6, pGMax*kminE);
      const planTw=Math.min(twAsk, twCap);
      const liftA=((PLAN_SHAPES[box.plan]||{}).lift||0)*(rng()*2-1)*rw*0.55;
      const tiltMax=tiltMm/kminE;
      // РАНДОМ ЗАВАЛА: у каждой генерации свой характер — размах от чуть
      // заметного до предельного, своё направление, своя скорость поворота
      // наклона по спуску и своё дыхание размаха
      // размах делится между ОБЩИМ завалом (вся спираль завалена в одну
      // сторону) и СВОИМ НАКЛОНОМ КАЖДОГО ВИТКА; сумма долей — единица,
      // поэтому запас по высоте (2·tiltMm) остаётся прежним
      const tiltCK=0.35+0.15*rng();             // доля общего завала
      const tiltK=tiltCK*(0.55+0.45*rng());     // доля предельного размаха
      const tiltPh=rng()*Math.PI*2;             // куда завален верхний виток
      const tiltRot=(rng()<0.5?-1:1)*(0.08+rng()*0.34);  // оборотов на спуск
      const tiltVar=rng()*Math.PI*2;            // фаза дыхания размаха
      const tiltF=0.5+rng()*1.1;                // частота дыхания размаха
      // ВИТКИ НЕ ЛОЖАТСЯ ЧЁТКОЙ ГОРИЗОНТАЛЬНОЙ ЛЕСЕНКОЙ. Общий завал наклоняет
      // всю спираль в одну сторону — витки при этом остаются параллельными
      // друг другу, и спуск читается ровными горизонтальными ступенями.
      // Поэтому у КАЖДОГО ВИТКА свой небольшой наклон: своя величина и своё
      // направление. Наклон задан вектором (не углом) и сшивается между
      // витками по s-кривой — лента остаётся ровной и плавной, изломов на
      // стыке витков нет
      const nTurnJ=Math.max(2, Math.ceil(nA)+2);
      const tJx=[], tJz=[];
      for(let i=0;i<=nTurnJ;i++){
        const aJ=tiltMax*(1-tiltCK)*(0.55+0.45*rng());
        const pJ=rng()*Math.PI*2;
        tJx.push(aJ*Math.cos(pJ)); tJz.push(aJ*Math.sin(pJ));
      }
      for(let k3=0;k3<=NE;k3++){
        const t=k3/NE;
        // ВЕРШИНА ВСЕГДА ВНИЗ: спираль закручивается к центру и одновременно
        // ОПУСКАЕТСЯ, поэтому самый маленький внутренний виток оказывается
        // снизу — композиция висит вершиной вниз, как люстра
        // ЗАВИТОК ГУЛЯЕТ ПО ВЕРТИКАЛИ (у «капли»): внутренние витки уходят
        // случайно выше или ниже, движение плавное и растёт к концу спуска
        const yq=y0+rise*(1-t)+liftA*t*t*(3-2*t);
        // контур формы на этой высоте (у шара сечение сужается к полюсам)
        let kf=1;
        if(sphE){
          if(sphE.ax===1) kf=Math.max(0.2, sphE.kAt(yq));
          else {
            const uy=(yq-sphE.c[1])/Math.max(1,sphE.R[1]);
            kf=Math.max(0.2, Math.sqrt(Math.max(0, 1-uy*uy)));
          }
        }
        // КАЖДЫЙ НИЖНИЙ ВИТОК МЕНЬШЕ ВЕРХНЕГО, но радиус держится У КОНТУРА
        // ФОРМЫ почти до конца и уходит в центр на последних витках (t^2.5).
        // Иначе середина композиции не доходит до границы у форм, широких
        // посередине: у ромба центральные завитки обязаны подходить к самой
        // точке излома, у шара и барабана — к экватору.
        // Если витков мало (широкая лента в шаре), такой профиль даёт слишком
        // крутой заход и марш его не проходит — там радиус убывает мягче
        // прижим конца идёт ПОВЕРХ убывающего профиля: держать радиус на
        // контуре целый виток нельзя — соседний виток окажется на том же
        // радиусе, а по высоте витки перекрыты, и это касание. Потерю
        // габарита от прижима добирает вписывание (secK)
        const tHug=Math.min(0.35, 0.6/Math.max(1,nA));
        const uR=midWide
          ? Math.pow(Math.max(0, (t-tMid)/(1-tMid)), (nA>=5)?1.6:1.25)
          : Math.pow(t, 1.05);
        // РАДИУС: меньший из «своего» радиуса спирали и контура формы, но не
        // меньше радиуса финального завитка. Раньше они перемножались, и в
        // сужающихся формах (конус, капля) спираль схлопывалась в точку
        // РАДИУС: меньший из «своего» радиуса спирали и контура формы, но не
        // меньше радиуса финального завитка
        let rho=Math.max(rho0, Math.min(rho1-(rho1-rho0)*uR, kf));
        // КОНЕЦ ЛЕНТЫ ПРИЖАТ К СОСЕДНЕМУ ВИТКУ ВПЛОТНУЮ. Соседние витки
        // разнесены радиально на целый шаг спирали (в габарите 2200 мм это
        // ~120 мм), и свободный конец висел в стороне от следующего витка.
        // Теперь на первых 3/4 витка радиус подтягивается ВНУТРЬ ровно на
        // столько, чтобы между концом и соседним витком осталась толщина
        // трубки с воздухом — кончик ложится вплотную. По высоте они всё
        // равно разведены шагом витка, поэтому касания нет
        {
          const dTurn=(rho1-rho0)*kminE/Math.max(1,nA);   // радиальный шаг витка
          const press=Math.max(0, dTurn-(ROD_D+12))/kminE;
          const uT=Math.min(1, t/Math.max(1e-6,tHug));
          rho=Math.max(rho0, rho-press*(1-uT)*(1-uT));
        }
        const th=phE+dirE*Math.PI*2*nA*t;
        // внутренние витки — круглые, внешние вытянуты по габариту: иначе
        // у вытянутого внутреннего витка радиус на конце (b²/a) падает ниже
        // технологического предела и лента его не пройдёт
        const kmin=Math.min(kx,kz);
        const sxE=kmin+(kx-kmin)*rho, szE=kmin+(kz-kmin)*rho;
        // завал витка: высота ходит по кругу витка — плоскость наклонена.
        // Общий завал (одно направление на всю спираль) плюс свой наклон
        // каждого витка, сшитый по s-кривой между соседними витками
        const sT=tiltMax*tiltK*(0.62+0.38*Math.sin(Math.PI*2*tiltF*t+tiltVar));
        const phT=tiltPh+Math.PI*2*tiltRot*t;
        const uJ=nA*t, iJ=Math.min(nTurnJ-1, Math.floor(uJ));
        const wJ=uJ-iJ, smJ=wJ*wJ*(3-2*wJ);
        const jx=tJx[iJ]+(tJx[iJ+1]-tJx[iJ])*smJ;
        const jz=tJz[iJ]+(tJz[iJ+1]-tJz[iJ])*smJ;
        const yT=rho*kminE*((sT*Math.cos(phT)+jx)*Math.cos(th)
                           +(sT*Math.sin(phT)+jz)*Math.sin(th));
        // СИЛУЭТ В ПЛАНЕ: радиус витка модулируется контуром r(θ). Витки
        // вкладываются друг в друга по одному и тому же контуру, поэтому
        // радиальный зазор между ними сохраняется
        // ПОВОРОТ СИЛУЭТА НА КАЖДЫЙ ВИТОК (у «звезды» 15°): контур витка
        // доворачивается вокруг вертикальной оси пропорционально номеру витка
        const kPlan=planR(th - planTw*nA*t);
        const q=[dims[0]/2+sxE*rho*kPlan*Math.cos(th), yq+yT,
                 dims[2]/2+szE*rho*kPlan*Math.sin(th)];
        // плавный подход к стенке габарита (жёсткое обрезание давало зубцы).
        // У ленты НА РЕБРО стержни вертикальны и за контур витка радиально не
        // выступают, поэтому подход к стенке жёстче (колено 0.97): мягкое
        // колено 0.9 съедало ~5% габарита у круглых форм
        for(let x2=0;x2<3;x2++) q[x2]=dims[x2]/2
              +softLim((q[x2]-dims[x2]/2)*sK[x2], dims[x2]/2-25, 0.97);
        // отступ от силуэта формы: у ленты на ребре — только радиус проволоки
        // (стержни идут вверх-вниз, а не наружу), иначе теряется ещё 18 мм
        // на сторону и композиция не доходит до контура
        if(sphE) sphE.clampTo(q, 1.0, 2, true);
        pts.push(q);
        axisAtE.push([0,1,0]);      // стержни вертикальны — лента на ребре
      }
      // ВЕРХНИЙ КОНЕЦ ЛЕНТЫ ПРИЖАТ К СОСЕДНЕМУ ВИТКУ — ДЛЯ ЛЮБОЙ ФОРМЫ,
      // РОВНО И ПЛАВНО. Шаг витка замеряется (профиль его не предсказывает:
      // его задают ещё контур формы, завал горизонта и вписывание), а прижим
      // растягивается на такую длину, чтобы радиус ТОЛЬКО УБЫВАЛ. Короткий
      // прижим давал бугор: радиус сначала рос, потом падал — на конце ленты
      // был виден залом. Длина прижима считается из условия монотонности
      // (скорость прижима не больше скорости убывания спирали), после чего
      // монотонность ещё и принудительно выравнивается
      {
        const per=Math.max(4, Math.round(NE/Math.max(1,nA)));   // точек на виток
        const cx=dims[0]/2, cz=dims[2]/2;
        const rad=(q)=>Math.hypot(q[0]-cx, q[2]-cz);
        if(pts.length>per+4){
          const dTurn=Math.max(1, rad(pts[0])-rad(pts[per]));   // шаг витка, мм
          // просвет между концом и соседним витком — 55 мм (5-6 см):
          // «почти вплотную», но конец читается отдельно и монтаж проще
          const press=Math.max(0, dTurn-55);
          // длина прижима: 2·прижим/шаг витка — при ней производная радиуса
          // не меняет знак; не короче витка и не длиннее двух
          const nH=Math.min(pts.length-2,
                    Math.round(per*Math.max(1, Math.min(2.2, 2.2*press/dTurn))));
          if(press>1 && nH>4){
            for(let i=0;i<nH;i++){
              const u=i/nH, w=(1-u)*(1-u);
              const r1=rad(pts[i]);
              const k=Math.max(0.1, (r1-press*w)/Math.max(1,r1));
              pts[i][0]=cx+(pts[i][0]-cx)*k;
              pts[i][2]=cz+(pts[i][2]-cz)*k;
            }
            // СТРАХОВКА ОТ БУГРА: по ходу ленты радиус на прижиме не имеет
            // права РАСТИ — иначе на конце виден залом. Идём от конца вперёд
            // и подрезаем всё, что выше предыдущей точки: получается ровный
            // заход, плавно переходящий в спираль
            for(let i=1;i<=nH;i++){
              const r0=rad(pts[i-1]), r1=rad(pts[i]);
              if(r1>r0){
                const k=r0/Math.max(1,r1);
                pts[i][0]=cx+(pts[i][0]-cx)*k;
                pts[i][2]=cz+(pts[i][2]-cz)*k;
              }
            }
          }
        }
      }
      // НИЖНИЙ КОНЕЦ ВСЕГДА ПРИХОДИТ В ЦЕНТР ФОРМЫ. Последний завиток
      // доводится до оси: точки дотягиваются к центру по дуге, а самая
      // последняя стоит ровно на оси — лента заканчивается в центре низа,
      // как в люстре, а не обрывается на радиусе
      {
        const cx=dims[0]/2, cz=dims[2]/2;
        const per=Math.max(4, Math.round(NE/Math.max(1,nA)));
        const nT=Math.min(pts.length-2, Math.max(6, Math.round(per*0.55)));
        const n0=pts.length-1;
        for(let k=0;k<=nT;k++){
          const i=n0-nT+k;
          const u=k/nT;                       // 0 — начало завитка, 1 — центр
          const w=u*u*(3-2*u);                // плавная сглаженная дуга
          pts[i][0]=pts[i][0]+(cx-pts[i][0])*w;
          pts[i][2]=pts[i][2]+(cz-pts[i][2])*w;
        }
      }
      pts.__axisAt=axisAtE;
      pts.__target=tgt;
      pts.__edge=true;
      if(sphE){
        pts.__formIn=sphE.inside;
        pts.__formAx={ax:sphE.ax, c:sphE.c.slice(),
                      s0:sphE.c[sphE.ax]-sphE.Rax, s1:sphE.c[sphE.ax]+sphE.Rax};
        pts.__formDraw={c:sphE.c.slice(), R:sphE.R.slice(), form:box.form};
        pts.__formClamp=sphE.clampTo;
      }
      return pts;
    }
    // ФОРМА ГАБАРИТА «ШАР»: лента вписывается в эллипсоид, вписанный в
    // габарит. Осевая линия навивки идёт по оси эллипсоида, а сечение витка
    // сужается по его силуэту: на осевой координате u (в долях полуоси)
    // допустимая полуось сечения = √(1−u²)
    const fo=formOf(dims, rw, box.form);
    const isSphere=!!fo;                   // форма задана (не параллелепипед)
    if(fo){ A1s=Math.min(A1s, fo.R1); A2s=Math.min(A2s, fo.R2); }
    const Amax=Math.max(A1s,A2s), Bmin=Math.min(A1s,A2s);
    const coil=Bmin>=170;
    // ОДНОРЯДНАЯ ЛЕНТА: СКРУЧИВАНИЯ ЧЕРЕДУЮТСЯ С ПОВОРОТАМИ. У ленты в один
    // ряд каркас узкий, она охотно идёт витком — и композиция читалась
    // «вся из спиралей»: глубина чередования и размах поворота на плато
    // у неё больше (altA, tK ниже), витки разбавлены поворотами
    const oneRow=(box.rows===1);
    const lenTurn=coil ? sectionPerim(A1s, A2s) : 4*Amax;
    // ПРАВИЛО ПРОИЗВОДСТВА: метраж ленты пропорционален длине композиции —
    // на 2000 мм габарита идёт ~4 пог. м, на 4000 мм ~8 пог. м. Лишняя
    // длина уходит в повороты и изгибы, а не растягивается по габариту.
    // «Насыщенность» — множитель к этому правилу (≈2× при 1.15, до ≈3.3×).
    // множитель откалиброван по факту: марш и вписывание съедают 10–20%
    // от заданной цели, поэтому цель берём с запасом
    // метраж даёт НЕ только навивка: ход вдоль осевой линии формы — уже
    // длина ленты. Витки добирают лишь остаток по теореме Пифагора
    // (винт разворачивается в прямоугольный треугольник S × витки·периметр)
    const rest=Math.max(0, target*target - S*S);
    const turnsCap=Math.max(0.9, Math.sqrt(rest)/Math.max(300,lenTurn));
    // число витков — ИЗ ЦЕЛЕВОГО МЕТРАЖА (правило производства), а шаг
    // витка получается как следствие; ограничение снизу — ширина ленты
    // с зазором, иначе витки задели бы друг друга
    // шаг витка не может быть меньше ширины ленты с воздухом: иначе
    // соседние витки заведомо пересекаются (это и была причина сотен
    // самопересечений на гнутых формах)
    let turns=Math.max(0.9, Math.min(16, turnsCap, S/(rw+34)));
    // добор витков по факту: марш срезает повороты и теряет до трети
    // длины, поэтому buildRibbon замеряет предмарш и просит добавить
    // витков — иначе «Насыщенность» не отражает реальный метраж
    turns=Math.min(turns*(box.turnsBoost||1), S/(rw+34));
    // колебание вместо витка: частота ограничена радиусом на гребне
    if(!coil) turns=Math.max(0.5, Math.min(turns, sineFMax(S, Amax)));
    // ЗАЗОР МЕЖДУ ЖИЛАМИ: соседние заходы разнесены по осевой линии на
    // шаг_витка/lanes, а шаг витка = длина_осевой/витки. Требуем, чтобы
    // этот разнос был не меньше ширины ленты с воздухом — тогда жилы
    // физически не могут сблизиться ближе 10 мм
    if(lanes>1) turns=Math.min(turns, S/(lanes*(rw+30)));
    // ФОРМА ДОЛЖНА ЧИТАТЬСЯ: у шара лента обязана заполнить силуэт целиком,
    // поэтому витков берём столько, сколько физически влезает (шаг витка —
    // ширина ленты с зазором), а не сколько просит правило метража
    if(isSphere) turns=Math.max(turns, S/(rw+60)*0.70);
    // РАЗРЕЖЕНИЕ ЛЕСТНИЦЕЙ: попытки с fillRelax реально раздвигают витки.
    // Раньше relax раздувал только бюджеты болтанки при неизменных витках —
    // каждая следующая попытка была ХУЖЕ предыдущей (замер 900×900×3500:
    // попытка 0 — 451 касание, попытка 4 — 1766)
    turns=Math.max(0.9, turns/(1+relax*0.45));
    // ФАКТИЧЕСКИЙ шаг витка — от него считаются бюджеты дыхания и
    // блуждания. Раньше бюджеты шли от предположительного шага rw+150
    // (а у однорядной — 1.55×(rw+150), из-за чего болтанка превышала
    // фактический зазор и однорядная лента уходила в страховку на 3 из
    // 5 зёрен эталона 2400×900×800). Правило шара держит фактический шаг
    // на (rw+60)/0.7 ≈ rw+214 — бюджеты от него точны для всех рядностей
    const pitchAct=S/turns;
    // фаза захода: жилы равномерно по окружности витка
    const ph0=rng()*Math.PI*2 + Math.PI*2*lane/Math.max(1,lanes);
    // «дыхание» сечения и блуждание центра — винт живой, не цилиндр.
    // У каждой жилы своя фаза дыхания: жилы слегка меняются радиусом и
    // переплетаются, но осевой разнос от этого не меняется — безопасно
    const bf=1.1+rng()*1.2, bp=rng()*Math.PI*2+lane*2.1;
    // «дыхание» сечения ограничено шагом витка: радиальное отклонение не
    // должно съедать зазор между соседними витками, иначе плотный винт не
    // разводится и вся генерация уходит в страховку (метраж падал втрое)
    const bMax=Math.max(0.03, (pitchAct - rw*0.97 - 34)/(2*Math.max(1,a1)));
    const bAmp=Math.min(0.16+0.10*rng(), bMax);
    const cf1=0.8+rng()*0.9, cp1=rng()*Math.PI*2;
    const cf2=1.3+rng()*1.1, cp2=rng()*Math.PI*2;
    // блуждание центра витка тоже сближает соседние витки: соседи могут
    // разойтись в противоположные стороны, поэтому бюджет делится пополам
    const cBud=Math.max(6,(pitchAct - rw*0.97 - 34)/4);
    const cAmp1=Math.min(a1*0.20, 90, cBud), cAmp2=Math.min(a2*0.20, 90, cBud);
    // ЧЕРЕДОВАНИЕ ПЛАСТИКИ. При постоянной скорости навивки лента только
    // скручивается. Скорость сделана переменной: на «плато» (dθ/dt≈0) лента
    // почти не крутится и проходит поворот или изгиб, между плато — виток.
    // Фаза = интеграл скорости, поэтому число витков (а с ним метраж по
    // правилу производства) не меняется. Глубина чередования — по запасу
    // сечения: в тесном сечении плато требует изгиба, который лента там
    // пройти не может
    // ЧЕРЕДОВАНИЕ БЕЗ ДВУХ СКРУТОК ПОДРЯД. Частота чередования у однорядной
    // равна числу витков: на каждый виток приходится ровно одно плато,
    // поэтому «скрутка — поворот — скрутка — поворот». Метраж от этого не
    // меняется: фаза есть интеграл скорости, а средняя скорость та же
    // одно плато на виток и у двухрядной: при частоте turns/1.6 плато
    // приходилось не на каждый виток, и скрутки шли подряд
    const altF=Math.max(0.7, Math.min(6, turns/2.0));
    // глубина чередования: у однорядной больше единицы — на плато фаза витка
    // не просто замирает, а немного отходит назад: это РАЗВОРОТ, лента
    // раскручивается и уходит в поворот, а не крутится дальше
    // ГЛУБИНА ЧЕРЕДОВАНИЯ. Полный разворот фазы (0.98 с нижним пределом 0.45)
    // у ДВУХРЯДНОЙ ленты замером отклонён: касания 311/632/191 на попытках
    // лестницы, сборка 38 с вместо 6-10 с — двухрядной ленте не хватает
    // радиального места на разворот. Поэтому у двухрядной разворот мягче
    const altA=(oneRow?0.98:0.86)
               *Math.max(oneRow?0.45:0.30,
                         Math.min(1, (Math.min(a1,a2)*0.88-150)/220));
    // на плато лента уходит в сторону — это и есть поворот; размах
    // ограничен тем же бюджетом зазора между витками
    // размах поворота на плато: у однорядной больше — шаг витка увеличен,
    // и высвободившийся зазор между витками можно потратить на поворот
    const tK=oneRow?0.34:0.16;
    const tAmp1=Math.min(a1*tK, cBud), tAmp2=Math.min(a2*tK, cBud);
    // точек хватает и на витки, и на изгибы самой осевой линии
    const N=Math.max(30, Math.round(Math.max(turns*16, S/60)));
    const axisAt=[];
    // У СУЖАЮЩИХСЯ ФОРМ ЛЕНТА ИДЁТ СВЕРХУ ВНИЗ И КОНЧАЕТСЯ В НИЖНЕМ ЦЕНТРЕ
    // ФОРМЫ: обход осевой линии разворачивается, а сечение витка сходит к оси
    // на последних процентах пути
    const revAx=!!(fo && fo.ax===1);
    // СПУСК СИНХРОНЕН ФАЗЕ ВИТКА. Чередование «плато/скрутка» модулирует
    // скорость вращения фазы, и при равномерном спуске витки скучиваются:
    // в фазе скрутки вертикальный шаг падал с 514 до ~276 мм при ленте
    // 300 мм — отрицательный зазор и сотни касаний (замер 900×900×3500).
    // Ход вдоль осевой линии идёт по той же мере t+phMod, что и фаза:
    // высота линейна по углу витка, шаг между витками постоянный везде
    const phN=(tq)=>altA*Math.sin(Math.PI*2*altF*tq)/(Math.PI*2*altF);
    // ДОЛЯ СИНХРОНИЗАЦИИ. У вертикальной навивки спуск синхронен фазе
    // целиком: пробег вдоль оси на плато — это пикирование вдоль
