name: Security scan vargov.ru

on:
  schedule:
    - cron: "0 5 * * 1"  # еженедельно по понедельникам 05:00 UTC; ежедневный прогон в 8 потоков падал 8 дней подряд — сам же попадал под fail2ban
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Скрипт падает (exit 1) при чужом скрипте, неожиданном счётчике Метрики
      # или новом внешнем домене — упавший workflow = уведомление владельцу.
      - name: Scan external domains and Metrika counters
        run: python scripts/security_scan.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-report
          path: scan/security_report.md
          if-no-files-found: ignore
